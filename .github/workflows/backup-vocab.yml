# 每 6 小时把线上生词本存进仓库 data/vocab.json、插件数据存进 data/ext.json、视频字幕存进 data/captions/（有变化才提交）。
# 原声和截图存成普通文件放进 data/media/（.webm / .jpg，只下载新增或改过的），在 GitHub 上能直接看、直接听。
# 生词本不设口令，被乱改时从这里的历史版本还原；data/ 不在 web/ 里，不会触发网站重新部署。
# 个人学习资料（/api/mine：错题本、阅读写作口语记录…）：仓库设成私有后才备份进 data/mine/（家人 data/users/<id>/mine/）。
# 家人（多用户）：名单存进 data/users.json，每个人的生词本、插件数据、原声截图存进 data/users/<id>/（vocab.json、ext.json、media/）。
name: 备份生词本和字幕
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: backup-vocab
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: 下载生词本
        run: |
          mkdir -p data
          curl -fsS --retry 3 https://ruilearning-my.pages.dev/api/vocab -o /tmp/vocab.json
          jq -e '.ok == true and (.custom | type == "array")' /tmp/vocab.json > /dev/null
          jq 'del(.ok)' /tmp/vocab.json > data/vocab.json
      - name: 下载插件数据（已保存的词和句子、标记、标签、设置、录音截图的索引）
        run: |
          curl -fsS --retry 3 https://ruilearning-my.pages.dev/api/ext -o /tmp/ext.json
          jq -e '.ok == true and (.items | type == "object")' /tmp/ext.json > /dev/null
          jq '{ver, items}' /tmp/ext.json > data/ext.json
      - name: 下载原声和截图（只下新增或有变化的）
        run: python3 tools/backup-media.py
      - name: 下载家人的生词本、插件数据、原声截图
        run: |
          curl -fsS --retry 3 https://ruilearning-my.pages.dev/api/users -o /tmp/users.json
          jq -e '.ok == true and (.users | type == "array")' /tmp/users.json > /dev/null
          jq '.users' /tmp/users.json > data/users.json
          for u in $(jq -r '.users[].id | select(. != "")' /tmp/users.json); do
            mkdir -p "data/users/$u"
            curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/vocab?u=$u" -o /tmp/v.json && jq -e '.ok == true and (.custom | type == "array")' /tmp/v.json > /dev/null && jq 'del(.ok)' /tmp/v.json > "data/users/$u/vocab.json"
            curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/ext?u=$u" -o /tmp/e.json && jq -e '.ok == true and (.items | type == "object")' /tmp/e.json > /dev/null && jq '{ver, items}' /tmp/e.json > "data/users/$u/ext.json"
            python3 tools/backup-media.py --user "$u"
          done
      - name: 下载其它学习语言（德语…）的生词本、插件数据（每种语言分开存：主人 data/lang/<语言>/，家人 data/users/<id>/lang/<语言>/；没内容的不存）
        run: |
          for lg in de; do
            for u in "" $(jq -r '.users[].id | select(. != "")' /tmp/users.json); do
              if [ -z "$u" ]; then d="data/lang/$lg"; q="lang=$lg"; else d="data/users/$u/lang/$lg"; q="u=$u&lang=$lg"; fi
              curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/vocab?$q" -o /tmp/v.json && jq -e '.ok == true and (.custom | type == "array")' /tmp/v.json > /dev/null || continue
              curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/ext?$q" -o /tmp/e.json && jq -e '.ok == true and (.items | type == "object")' /tmp/e.json > /dev/null || continue
              if [ "$(jq '(.custom | length) + (.pending // [] | length)' /tmp/v.json)" = "0" ] && [ "$(jq '.items | length' /tmp/e.json)" = "0" ] && [ ! -d "$d" ]; then continue; fi
              mkdir -p "$d"; jq 'del(.ok)' /tmp/v.json > "$d/vocab.json"; jq '{ver, items}' /tmp/e.json > "$d/ext.json"
            done
          done
      - name: 下载个人学习资料 /api/mine（错题本、阅读 / 写作 / 口语记录、每日、模考成绩…；只在仓库设成私有后才备份，公开仓库谁都能看）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then echo "仓库是公开的：个人资料不备份到这里（网站后台每天有存档，30 天内能找回）"; exit 0; fi
          for lg in "" de; do
            for u in "" $(jq -r '.users[].id | select(. != "")' /tmp/users.json); do
              d="data"; q=""
              [ -n "$u" ] && { d="data/users/$u"; q="u=$u&"; }
              [ -n "$lg" ] && { d="$d/lang/$lg"; q="${q}lang=$lg&"; }
              for k in reading writing vtest speak daily sme err exam; do
                curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/mine?${q}k=$k" -o /tmp/m.json && jq -e '.ok == true and (.items | type == "object")' /tmp/m.json > /dev/null || continue
                if [ "$(jq '.items | length' /tmp/m.json)" = "0" ] && [ ! -f "$d/mine/$k.json" ]; then continue; fi
                mkdir -p "$d/mine"; jq '.items' /tmp/m.json > "$d/mine/$k.json"
              done
            done
          done
      - name: 下载视频字幕（只下新增或有变化的）
        run: |
          mkdir -p data/captions
          curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/cap?list=1" -o /tmp/list.json
          jq -e '.ok == true and (.items | type == "array")' /tmp/list.json > /dev/null
          jq '.items | sort_by(.v)' /tmp/list.json > data/captions/index.json
          for v in $(jq -r '.items[].v' /tmp/list.json); do
            at=$(jq -r --arg v "$v" '.items[] | select(.v == $v) | .at' /tmp/list.json)
            f="data/captions/$v.json"
            if [ -f "$f" ] && [ "$(jq -r '.at // empty' "$f")" = "$at" ]; then continue; fi
            curl -fsS --retry 3 "https://ruilearning-my.pages.dev/api/cap?v=$v" -o /tmp/cap.json && jq -e '.ok == true' /tmp/cap.json > /dev/null && jq 'del(.ok)' /tmp/cap.json > "$f"
          done
          # 网站上删掉的视频，备份里保留（Git 历史里也有），不在这里删
      - name: 更新「🔎 真人例句」的例句库（视频字幕 + BBC 最近几期文稿 → web/corpus.json；没变化不改文件）
        run: node tools/build-corpus.mjs || echo "例句库没更新（不影响备份）"
      - name: 有变化就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vocab.json data/ext.json data/media data/captions data/users.json
          [ -d data/users ] && git add data/users
          [ -d data/lang ] && git add data/lang
          [ -d data/mine ] && git add data/mine
          [ -f web/corpus.json ] && git add web/corpus.json
          if git diff --cached --quiet; then echo "没有变化"; exit 0; fi
          git commit -m "备份生词本、插件数据、原声截图和字幕 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git push
