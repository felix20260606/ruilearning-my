# 全站 AI 真人语音：每天把还没生成的固定英文（口语句子、生词本的词和例句、雅思笔记）生成一批 mp3（web/tts/），有新文件就提交，Cloudflare Pages 跟着部署。
# 一次最多 3600 个字母（约 4,900 neurons，2026-11-22 从 6000 降下来：加上白天练习，原来每天会超过 1 万）；Workers AI 免费额度每天 1 万 neurons，00:00 UTC（吉隆坡早上 8 点）重置。
# 选在 22:30 UTC（吉隆坡早上 6:30）跑：用的是这一天快结束时剩下的额度，重置后白天练习不受影响。额度不够时生成到报错就停，第二天接着做。
# 全部生成完以后每天跑一次，只补新加的生词和句子；生词本新加的词当天先现场生成（/api/tts），第二天换成静态文件。也可以在 Actions 页面点「Run workflow」手动多跑一批。
name: 生成口语 AI 语音
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: tts
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 生成一批
        run: node tools/gen-tts.mjs
      - name: 有新文件就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/tts
          if git diff --cached --quiet; then echo "没有新语音"; exit 0; fi
          git commit -m "口语 AI 语音：新生成一批 $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git pull --rebase
          git push
