<!doctype html><html lang="zh-CN"><head>
<link rel="icon" href="/icon.svg?v=c523a8a0" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=c615e9d4" sizes="48x48"><link rel="apple-touch-icon" href="/icon-192.png?v=aa949b6f">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="theme-color" content="#1d1e21">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
{{COMMENT}}
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#1E2733;--soft:#7C8794;--line:#E5EAE8;--bg:#EFF2F1;--paper:#FFFFFF;--paper-2:#F1F4F3;
    --display:"Fraunces",Georgia,"Songti SC",serif;--font:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px 70px}
  .hero{position:relative;color:#fff;padding:44px 22px 34px;text-align:center;overflow:hidden;background:linear-gradient(150deg,#3b2368 0%,#1e3a44 55%,#222128 100%)}
  .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,rgba(197,155,239,.25),transparent 45%),radial-gradient(circle at 85% 85%,rgba(124,227,184,.14),transparent 50%)}
  .hin{position:relative}.hero .k{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}
  .hero h1{font-family:var(--display);font-size:32px;margin:8px 0 6px;font-weight:900}.hero .sub{font-size:14.5px;opacity:.95;margin-bottom:16px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 16px;min-width:92px}
  .stat b{display:block;font-family:var(--display);font-size:21px;font-weight:900}.stat span{font-size:12px;opacity:.92}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);max-width:420px;margin:14px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ce3b8,#c59bef);transition:width .3s}
  .sync{font-size:12px;opacity:.8;margin-top:8px}
  .tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}.row:first-child{margin-top:0}
  .q{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;outline:none}
  .q:focus{border-color:var(--ui-pur-line,#6d3a8f)}
  select.so{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
  .chip{font:inherit;font-size:12.5px;font-weight:700;color:var(--soft);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
  .chip.on{color:#fff;background:var(--ui-pur,#8b5cf6);border-color:var(--ui-pur,#8b5cf6)}.chip small{font-weight:500;opacity:.8;margin-left:3px}
  .lbl{font-size:12px;color:var(--soft);margin-right:2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--ui-radius,16px);overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:120px}
  .card.been{border-color:rgba(124,227,184,.55)}.card.want{border-color:rgba(255,196,84,.6)}
  .ph{position:relative;display:block;line-height:0;background:var(--paper-2)}
  .ph img{width:100%;height:190px;object-fit:cover;display:block}
  .ph .no{display:flex;align-items:center;justify-content:center;height:190px;font-size:54px;line-height:1}
  .rate{position:absolute;left:8px;top:8px;font-size:11.5px;line-height:1.5;color:#ffd166;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:999px;letter-spacing:1px}
  .ct{position:absolute;right:8px;top:8px;font-size:11.5px;line-height:1.5;color:#fff;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:999px}
  .cb{padding:12px 15px 14px;display:flex;flex-direction:column;flex:1}
  .nm b{font-size:16.5px;font-weight:900;display:block;line-height:1.4}.nm small{display:block;color:var(--soft);font-size:12.5px;line-height:1.45}
  .area{font-size:12.5px;color:var(--soft);margin-top:3px}
  .info{display:grid;grid-template-columns:22px 1fr;gap:3px 4px;margin-top:9px;font-size:13px;line-height:1.55}
  .info dt{text-align:center}.info dd{color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .desc{font-size:13.5px;margin-top:9px;color:var(--ui-ink-2,var(--ink))}
  .warn{font-size:12.8px;margin-top:8px;color:#ff8a6b;background:rgba(255,120,90,.1);border:1px solid rgba(255,120,90,.4);border-radius:10px;padding:5px 10px}
  .tips{font-size:12.8px;margin-top:7px;color:var(--soft);background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:12px}
  .bt{font:inherit;font-size:13px;font-weight:800;border-radius:999px;padding:5px 13px;cursor:pointer;border:1px solid var(--line);background:var(--paper-2);color:var(--ink)}
  .lk{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--jade-deep,#c59bef);background:var(--ui-pur-soft,rgba(197,155,239,.12));border:1px solid rgba(197,155,239,.3);border-radius:999px;padding:5px 12px;text-decoration:none;line-height:1.5}
  .lk.s{color:var(--soft);background:transparent;border-color:var(--line)}
  .empty{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
  footer{text-align:center;color:var(--soft);font-size:12px;margin-top:26px;line-height:1.8}
  @media (max-width:520px){.hero h1{font-size:25px}.grid{grid-template-columns:1fr}.ph img,.ph .no{height:180px}.tools{padding-top:9px}
    #st,#cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}#st::-webkit-scrollbar,#cats::-webkit-scrollbar{display:none}.lbl{flex:none}}
</style><link rel="stylesheet" href="theme.css">
<script src="trip-state.js"></script>
</head><body>
<div class="hero"><div class="hin">
  <div class="k">{{K}}</div>
  <h1>{{H1}}</h1>
  <div class="sub">{{SUB}}</div>
  <div class="stats">
    <div class="stat"><b id="n-all">{{N}}</b><span>个景点</span></div>
    <div class="stat"><b id="n-been">0</b><span>✅ 去过</span></div>
    <div class="stat"><b id="n-want">0</b><span>⭐ 想去</span></div>
    <div class="stat"><b id="n-left">0</b><span>还没去（不算不想去的）</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="sync" id="sync">…</div>
</div></div>
<div class="wrap">
  <div class="tools">
    <div class="row"><input class="q" id="q" type="search" placeholder="🔍 搜名字、区域、地铁站……" autocomplete="off">
      <select class="so" id="so"><option value="rate">按推荐</option><option value="area">按区域</option><option value="cat">按类型</option></select></div>
    <div class="row" id="st"></div>
    <div class="row" id="cats"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有符合的景点，换个筛选试试</div>
  <footer>★★★ 必去 · ★★ 值得 · ★ 有空再去 · 开放时间、票价是 2026-11 网上查到的，以官网 / 现场为准（每张卡片有「来源」）<br>照片来自 Wikimedia Commons，点照片看原图和作者 · 想加景点、改信息跟 Claude 说一声</footer>
</div>
<script>
(function(){
"use strict";
TRIPST.S.css(); // 去过 / 想去 / 计划 / 不想去 / 评价 / 再去：按钮、标记、筛选都用 trip-state.js 的 TRIPST.S
var DATA=/*DATA*/[];
var CATS=["地标","街区","美食夜市","商场","宗教建筑","博物馆","室内","公园自然","动物","徒步","乐园","周边一日"];
var EM={"地标":"🏙","街区":"🏮","美食夜市":"🍢","商场":"🛍","宗教建筑":"🕌","博物馆":"🏛","室内":"🎡","公园自然":"🌳","动物":"🦜","徒步":"🥾","乐园":"🎢","周边一日":"🚌"};
var FILES=/*FILES*/{},CFG=/*CFG*/{};
function mapUrl(q){return CFG.map==="amap"?"https://uri.amap.com/search?keyword="+encodeURIComponent(q)+"&amp;city="+encodeURIComponent(CFG.city||"")+"&amp;callnative=1":"https://www.google.com/maps/search/?api=1&amp;query="+encodeURIComponent(q);}
var BY={};DATA.forEach(function(x){BY[x.id]=x;});
function st(x){return TRIPST.get(x.id)||{been:!!x.been,want:false};}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function img(f){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width=640";}
function page(f){return "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));}
var F={cat:"",st:"",q:"",so:"rate"},mine=false; // mine：自己点的改动只更新那一张卡片，别处（后台、别的页面）来的才整页重画
function card(x){
  var s=st(x),ph=x.photo?'<img loading="lazy" src="'+esc(img(x.photo))+'" alt="'+esc(x.zh)+'" onerror="this.outerHTML=\'<div class=no>'+(EM[x.cat]||"📍")+'</div>\'">':'<div class="no">'+(EM[x.cat]||"📍")+'</div>';
  var row=function(i,v){return v?'<dt>'+i+'</dt><dd>'+esc(v)+'</dd>':"";};
  return '<article class="card '+TRIPST.S.cls(s)+'" id="c-'+esc(x.id)+'" data-id="'+esc(x.id)+'">'+
    (x.photo?'<a class="ph" href="'+esc(page(x.photo))+'" target="_blank" rel="noopener">':'<div class="ph">')+ph+
    '<span class="rate">'+"★★★".slice(0,x.rate)+'</span><span class="ct">'+(EM[x.cat]||"")+' '+esc(x.cat)+'</span>'+TRIPST.S.mark(s)+(x.photo?'</a>':'</div>')+
    '<div class="cb"><div class="nm"><b>'+esc(x.zh)+'</b><small>'+esc(x.en)+'</small></div><div class="area">📍 '+esc(x.area)+'</div>'+(x.warn?'<p class="warn">⚠️ '+esc(x.warn)+'</p>':"")+
    '<dl class="info">'+row("🚇",x.transit)+row("🕘",x.hours)+row("💵",x.price)+row("⏱",x.dur)+row("🏠",x.addr)+'</dl>'+
    (x.desc?'<p class="desc">'+esc(x.desc)+'</p>':"")+(x.tips?'<p class="tips">💡 '+esc(x.tips)+'</p>':"")+
    '<div class="acts">'+TRIPST.S.btns(s)+
    (x.q?'<a class="lk" href="'+mapUrl(x.q)+'" target="_blank" rel="noopener">📍 '+(CFG.map==="amap"?"高德地图":"地图")+'</a>':"")+
    (x.go&&FILES[x.go]?'<a class="lk" href="'+FILES[x.go]+'" data-go="'+esc(x.go)+'">🧭 照着走 ›</a>':"")+
    (x.src?'<a class="lk s" href="'+esc(x.src)+'" target="_blank" rel="noopener">来源</a>':"")+'</div></div></article>';
}
function match(x){
  var s=st(x);
  if(F.cat&&x.cat!==F.cat)return false;
  if(!TRIPST.S.match(s,F.st,x.warn))return false;
  if(F.q){var h=(x.zh+" "+x.en+" "+x.area+" "+x.transit+" "+x.cat+" "+x.addr+" "+x.desc).toLowerCase();if(h.indexOf(F.q.toLowerCase())<0)return false;}
  return true;
}
function order(a,b){
  if(F.so==="area")return (a.area||"").localeCompare(b.area||"","zh")||b.rate-a.rate;
  if(F.so==="cat")return CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||b.rate-a.rate;
  return b.rate-a.rate||CATS.indexOf(a.cat)-CATS.indexOf(b.cat);
}
function stats(){
  var b=0,w=0,sk=0;DATA.forEach(function(x){var s=st(x);if(s.been)b++;else if(s.want||s.plan)w++;else if(s.skip)sk++;});
  document.getElementById("n-been").textContent=b;document.getElementById("n-want").textContent=w;document.getElementById("n-left").textContent=DATA.length-b-sk;
  document.getElementById("bar").style.width=(DATA.length?Math.round(b*100/DATA.length):0)+"%";
  var cnt={};DATA.forEach(function(x){cnt[x.cat]=(cnt[x.cat]||0)+1;});
  document.getElementById("cats").innerHTML='<span class="lbl">类型</span><button class="chip'+(F.cat?"":" on")+'" data-cat="">全部<small>'+DATA.length+'</small></button>'+CATS.filter(function(c){return cnt[c];}).map(function(c){return '<button class="chip'+(F.cat===c?" on":"")+'" data-cat="'+c+'">'+EM[c]+" "+c+'<small>'+cnt[c]+'</small></button>';}).join("");
  document.getElementById("st").innerHTML='<span class="lbl">状态</span>'+TRIPST.S.chips(DATA,st,function(x){return x.warn;},F.st);
}
function render(){
  var L=DATA.filter(match).sort(order);
  document.getElementById("grid").innerHTML=L.map(card).join("");
  document.getElementById("empty").style.display=L.length?"none":"";
  stats();
}
function toggle(id,k){
  var x=BY[id];if(!x)return;var v=TRIPST.S.toggle(st(x),k);
  mine=true;TRIPST.set(id,v);mine=false;
  var el=document.getElementById("c-"+id);if(el&&match(x)){el.outerHTML=card(x);}else render();
  stats();
}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("button,a[data-go]");if(!t)return;
  if(t.dataset.k){var c=t.closest(".card");if(c)toggle(c.dataset.id,t.dataset.k);return;}
  if(t.hasAttribute("data-cat")){F.cat=t.dataset.cat;render();return;}
  if(t.hasAttribute("data-st")){F.st=t.dataset.st;render();return;}
  if(t.dataset.go&&window.parent&&window.parent!==window){e.preventDefault();try{parent.postMessage({tripGo:t.dataset.go},"*");}catch(er){}}
});
var qT=0;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){F.q=e.target.value.trim();render();},150);});
document.getElementById("so").addEventListener("change",function(e){F.so=e.target.value;render();});
var sy=document.getElementById("sync");
render();
TRIPST.on(function(){if(!mine)render();});
if(!TRIPST.cloud){sy.textContent="📱 单独打开：勾的只存在这台设备（在网站「旅游」里打开会同步）";}
else{sy.textContent="☁️ 同步中…";TRIPST.sync().then(function(r){sy.textContent=r==="ok"?"☁️ 已同步（换设备也在）":"⚠️ 现在连不上后台，勾的先存在这台设备，下次打开再同步";});}
})();
</script>
</body></html>
