y 为准）","dur":"1–2 小时","desc":"421 米高的电讯塔，建在武吉纳纳斯森林保护区的小山上，所以观景台视觉高度比双子塔还高。276 米的观景台室内 360° 环景；300 米的露天 Sky Deck 和突出塔外的玻璃 Sky Box 是最刺激的拍照点，还能看到双子塔全身。","tips":"想拍双子塔就选 KL 塔而不是双子塔观景台——在双子塔上看不到双子塔。日落前 1 小时上去可同时拍白天/黄昏/夜景；Sky Deck 下雨或大风会临时关闭。","q":"KL Tower","src":"https://pickyourtrail.com/blog/menara-kuala-lumpur","warn":"","rate":3,"photo":"Kuala Lumpur Tower taken from the Ampang Elevated Highway.jpg","been":false,"go":""},{"id":"lm-merdeka-118","zh":"默迪卡 118（The View at 118 观景台）","en":"Merdeka 118 / The View at 118","cat":"地标","area":"老城 / 默迪卡 Merdeka","addr":"118 Mall, Merdeka 118, Jalan Hang Jebat, 50150 Kuala Lumpur","transit":"MRT Merdeka 站（Kajang 线）直通 118 Mall；或 LRT Hang Tuah 站（从 Bukit Jalil 直达，Sri Petaling 线）走 8 分钟","hours":"观景台计划 2026-12-15 开放，10:00–22:00，21:00 最后入场（随 118 Mall 营业时间）；118 Mall 已于 2026-11-01 开业","price":"外国成人约 RM150（平日）/ RM160（周末）；大马人 RM55/65（媒体报道，以官网为准）","dur":"1–2 小时","desc":"678.9 米的默迪卡 118 是世界第二高楼，塔顶尖顶造型取自宋谷布的几何纹样。The View at 118 是东南亚最高的观景台，入口在塔底 118 Mall 的 LG 层；即使不上去，塔下的新商场和隔壁的独立体育场、默迪卡体育场也值得一逛。","tips":"截至 2026-11-23 观景台尚未开放，12 月 15 日之后再去，去之前查官方是否需预约时段。118 Mall 现在就能逛，可顺路走到茨厂街（约 15 分钟）。","q":"Merdeka 118","src":"https://thesmartlocal.my/the-view-at-118/amp/","warn":"观景台 12/15 才开放（商场已开）","rate":3,"photo":"The Merdeka 118 alongside the KL Tower on its right.jpg","been":false,"go":""},{"id":"lm-merdeka-square","zh":"独立广场 + 苏丹阿都沙末大厦","en":"Dataran Merdeka & Sultan Abdul Samad Building","cat":"地标","area":"老城 / 独立广场 Dataran Merdeka","addr":"Jalan Raja, City Centre, 50050 Kuala Lumpur","transit":"LRT Masjid Jamek 站，走 5 分钟（从 Bukit Jalil 坐 Sri Petaling 线直达）","hours":"广场全天开放；大厦外观随时可看（内部不对公众开放）","price":"免费","dur":"1 小时","desc":"1957 年 8 月 31 日马来亚在这里降下英国国旗宣布独立，广场南端立着 95 米高、号称世界最高之一的旗杆。对面的苏丹阿都沙末大厦（1897）是摩尔复兴式红砖建筑，铜顶钟楼是 KL 最经典的明信片画面；周边还有皇家雪兰莪俱乐部、圣玛丽大教堂和 I ♥ KL 标志。","tips":"白天拍红砖楼最好是上午 9–10 点顺光，晚上 19:30 后大厦亮灯也很美；广场无遮阳，带伞和水。可与 River of Life、Masjid Jamek、中央艺术坊串成一条步行线。","q":"Sultan Abdul Samad Building","src":"https://en.wikipedia.org/wiki/Merdeka_Square,_Kuala_Lumpur","warn":"","rate":3,"photo":"Kuala Lumpur Malaysia Sultan-Abdul-Samad-Building-02.jpg","been":false,"go":""},{"id":"lm-river-of-life","zh":"生命之河 · 蓝池（占美清真寺）","en":"River of Life / Kolam Biru (Masjid Jamek)","cat":"地标","area":"老城 / 占美清真寺 Masjid Jamek","addr":"Lebuh Pasar Besar, City Centre, 50050 Kuala Lumpur（巴生河与鹅麦河汇流处）","transit":"LRT Masjid Jamek 站，出站即到（Sri Petaling 线直达）","hours":"步道全天开放；蓝色灯光 + 雾气喷泉约 19:30 起至深夜，间歇运行","price":"免费","dur":"30–45 分钟","desc":"两河交汇的“泥泞汇流处”就是 Kuala Lumpur 名字的由来，1909 年的占美清真寺就建在河口三角洲上。整治后的河岸夜晚打上蓝色灯光，河面喷出雾气，配上清真寺的白色圆顶，是 KL 最出片的夜景之一。","tips":"雾气不是一直开，到了等 10–20 分钟；最佳机位在 Lebuh Pasar Besar 桥上或 Masjid Jamek 站旁的观景台。白天参观清真寺需穿长袖长裤（门口可借袍子）。","q":"River of Life Masjid Jamek","src":"https://nashaplaneta.net/asia/malaysia/kuala-lumpur-river-of-life_en","warn":"","rate":3,"photo":"Masjid Jamek confluence.jpg","been":false,"go":""},{"id":"lm-petaling-street","zh":"茨厂街（唐人街）","en":"Petaling Street (Jalan Petaling, Chinatown)","cat":"街区","area":"老城 / 茨厂街 Chinatown","addr":"Jalan Petaling, City Centre, 50000 Kuala Lumpur","transit":"LRT Pasar Seni 站走 5 分钟；或 LRT Plaza Rakyat / Masjid Jamek 走 8 分钟","hours":"摊位约 10:00–23:00；美食店各有营业时间","price":"免费","dur":"1–2 小时","desc":"KL 最早的华人商业街，绿色雨棚下的“Petaling Street Market”卖仿品、纪念品和小吃。周边有关帝庙、仙四师爷庙、印度教马里安曼庙，以及大量老字号：生果冰、猪肠粉、炒粉、煲仔饭、南香/何九茶店的早餐。","tips":"买东西一定砍价（喊价的 3–5 折起），仿品不要买。早上吃早餐 + 逛老店，傍晚再来看夜市；附近 Jalan Sultan、Jalan Panggong 有很多咖啡馆和老店屋。","q":"Petaling Street","src":"https://en.wikipedia.org/wiki/Petaling_Street","warn":"","rate":3,"photo":"Kuala Lumpur. Jalan Petaling. 2019-12-07 15-24-49.jpg","been":false,"go":""},{"id":"lm-bukit-bintang","zh":"武吉免登购物区","en":"Bukit Bintang","cat":"街区","area":"武吉免登 Bukit Bintang","addr":"Jalan Bukit Bintang & Jalan Sultan Ismail 交界一带，55100 Kuala Lumpur","transit":"MRT/Monorail Bukit Bintang 站，出站即到（从 Bukit Jalil：LRT 到 Hang Tuah 换 Monorail，约 35 分钟）","hours":"街区全天；商场 10:00–22:00；酒吧街 Changkat 营业至凌晨","price":"免费","dur":"2–4 小时","desc":"KL 最繁华的购物娱乐区，Pavilion、Lot 10、Starhill、Fahrenheit88、Berjaya Times Square 几大商场集中在十字路口周围。夜里霓虹闪烁，附近 Jalan Alor 是美食街，Changkat Bukit Bintang 是外国人最爱的酒吧街。","tips":"路口人流大，注意手机和背包（偶有飞车抢夺）；街头按摩店多，选明码标价的。从 Pavilion 有空调天桥步道 Pedestrian Walkway 可一路走到 KLCC（约 20 分钟）。","q":"Bukit Bintang","src":"https://en.wikipedia.org/wiki/Bukit_Bintang","warn":"","rate":3,"photo":"Bukit Bintang Junction in 2023.jpg","been":false,"go":""},{"id":"lm-jalan-alor","zh":"亚罗街美食街","en":"Jalan Alor Food Street","cat":"美食夜市","area":"武吉免登 Bukit Bintang","addr":"Jalan Alor, Bukit Bintang, 50200 Kuala Lumpur","transit":"MRT/Monorail Bukit Bintang 站，走 3 分钟","hours":"每日约 17:00–次日 2:00（部分店白天也营业）","price":"免费进入；人均约 RM30–60","dur":"1–2 小时","desc":"KL 最有名的夜宵街，整条街两边是华人大排档和小吃摊：黄亚华烧鸡翼、沙爹、炒粿条、福建面、榴莲、椰子、泰式海鲜等。灯笼和招牌一字排开，人声鼎沸，是吉隆坡夜生活的代表画面。","tips":"游客价偏高，点海鲜前先问清按什么称、多少钱一份；揽客店员很热情，先走一圈再选。想吃得地道可看本地人多的档口，黄亚华烧鸡翼是招牌。","q":"Jalan Alor","src":"https://en.wikipedia.org/wiki/Jalan_Alor","warn":"","rate":3,"photo":"Jalan Alor Kuala Lumpur.jpg","been":false,"go":""},{"id":"lm-connaught-night-market","zh":"康乐夜市（周三）","en":"Taman Connaught Night Market","cat":"美食夜市","area":"蕉赖 Cheras / 康乐花园 Taman Connaught","addr":"Jalan Cerdas, Taman Connaught, Cheras, 56000 Kuala Lumpur","transit":"MRT Taman Connaught 站（Kajang 线），走 10 分钟；从 Bukit Jalil 打 Grab 约 20 分钟","hours":"仅周三，约 17:00–24:00（19:00–21:00 最热闹）","price":"免费；小吃每样约 RM3–15","dur":"1.5–2 小时","desc":"号称全马最长的夜市，一条约 2 公里的街摆满七八百个摊位，周三晚上才有。烤鱿鱼、拉丝芝士、炸鸡、糖水、各种马来/华人/泰式小吃，加上衣服杂货，是体验本地 pasar malam 最好的地方。","tips":"17:30–18:30 到人还不多；带现金（小额钞票）和湿纸巾；不要开车（停车极难），坐 MRT 或 Grab。","q":"Taman Connaught Night Market","src":"https://www.tripzilla.com/night-markets-kuala-lumpur/71020","warn":"","rate":3,"photo":"","been":false,"go":""},{"id":"cu-masjid-negara","zh":"国家清真寺","en":"Masjid Negara (National Mosque)","cat":"宗教建筑","area":"湖滨公园 Perdana","addr":"Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur","transit":"KTM 吉隆坡旧火车站 Kuala Lumpur 步行约 5 分钟；LRT/MRT Pasar Seni 步行约 12 分钟（走天桥）","hours":"非穆斯林参观：周六至周四约 9:00–12:00、15:00–16:00、17:30–18:30；周五仅下午两段（15:00–16:00、17:30–18:30）；礼拜时间暂停入内（以官网为准）","price":"免费","dur":"45 分钟–1 小时","desc":"1965 年落成的马来西亚国家清真寺，屋顶是 18 角星形折板大屋顶，象征 13 个州和伊斯兰五功，旁边 73 米宣礼塔是地标。现代主义建筑风格在东南亚清真寺里很少见，大理石回廊、倒影水池和整齐的柱廊非常上镜。","tips":"入口处免费借长袍和头巾，进去要脱鞋；非穆斯林走侧门的游客入口。可与旁边的伊斯兰艺术博物馆、湖滨公园、旧火车站排成半天路线。","q":"Masjid Negara Kuala Lumpur","src":"https://www.nomadotravel.app/en/attractions/masjid-negara","warn":"","rate":3,"photo":"Kuala Lumpur, Malaysia, Masjid Negara Malaysia.jpg","been":false,"go":""},{"id":"cu-masjid-jamek","zh":"占美清真寺","en":"Masjid Jamek Sultan Abdul Samad","cat":"宗教建筑","area":"老城 / 独立广场 Dataran Merdeka","addr":"Jalan Tun Perak, City Centre, 50050 Kuala Lumpur","transit":"LRT Masjid Jamek 站出来即到（步行 1–2 分钟）","hours":"非穆斯林参观约 10:00–12:30、14:30–16:00；周五不对非穆斯林开放；礼拜时间不可入内（以官网为准）","price":"免费","dur":"30 分钟","desc":"建于 1909 年，是吉隆坡最古老的清真寺之一，坐落在巴生河与鹅麦河交汇处——吉隆坡（“泥泞河口”）名字的起源地。红砖白条纹的摩尔式（印度-伊斯兰）建筑，配洋葱圆顶和棕榈林，河对岸看过去最好看。","tips":"先到游客服务台登记，女士会借长袍和头巾，男士穿短裤也会被要求穿袍；鞋子脱在门外鞋架。傍晚河岸“生命之河”蓝光灯秀很适合顺路看。","q":"Masjid Jamek Sultan Abdul Samad","src":"https://www.malaysia-traveller.com/masjid-jamek.html","warn":"","rate":3,"photo":"Masjid Jamek in Kuala Lumpur.jpg","been":false,"go":""},{"id":"cu-thean-hou","zh":"天后宫","en":"Thean Hou Temple","cat":"宗教建筑","area":"敦善班丹 / 旧巴生路 Robson Heights","addr":"65 Persiaran Endah, off Jalan Syed Putra, Taman Persiaran Desa, 50460 Kuala Lumpur","transit":"无近站；Monorail Tun Sambanthan 步行约 20 分钟上坡，建议 Grab（从 Bukit Jalil 约 15–20 分钟车程）","hours":"每日约 9:00–18:00，节庆期间延长（以官网为准）","price":"免费（欢迎香油）","dur":"1 小时","desc":"海南会馆于 1987 年建成的六层高宫殿式庙宇，供奉天后妈祖、观音和水尾圣娘，红柱金瓦飞檐，是东南亚最大的华人庙宇之一。顶层可俯瞰吉隆坡天际线，庭院有十二生肖雕像、许愿池和草药园。","tips":"农历新年和中秋前后挂满红灯笼最漂亮，但人也最多；傍晚去可看日落和亮灯。正殿内勿用闪光灯，衣着得体即可。","q":"Thean Hou Temple Kuala Lumpur","src":"https://www.malaysia-traveller.com/thean-hou-temple.html","warn":"","rate":3,"photo":"Thean Hou Temple outview (220116).jpg","been":false,"go":""},{"id":"cu-sri-mahamariamman","zh":"马里安曼印度庙","en":"Sri Mahamariamman Temple","cat":"宗教建筑","area":"老城 / 茨厂街 Chinatown","addr":"163 Jalan Tun H S Lee, City Centre, 50000 Kuala Lumpur","transit":"LRT/MRT Pasar Seni 步行约 5 分钟","hours":"每日约 6:00–20:30（周五至 21:30、周六至 21:00），中午可能短暂关闭（以官网为准）","price":"免费（寄存鞋子约 20 仙）","dur":"30 分钟","desc":"始建于 1873 年，是吉隆坡最古老的印度教神庙，5 层高的彩色塔门（gopuram）上雕满数百尊印度神祇，在茨厂街中间格外醒目。每年大宝森节，银色战车从这里出发前往黑风洞。","tips":"进庙必须脱鞋，可在门口左侧寄存柜台付几毛钱寄鞋；穿过膝衣物、遮肩。黄昏法会时段有鼓乐和仪式，气氛最好，拍照前先征得同意。","q":"Sri Mahamariamman Temple Kuala Lumpur","src":"https://www.timeout.com/kuala-lumpur/attractions/sri-maha-mariamman-temple","warn":"","rate":3,"photo":"Sri Mahamariamman Temple, Kuala Lumpur (240806).jpg","been":false,"go":""},{"id":"cu-islamic-arts-museum","zh":"马来西亚伊斯兰艺术博物馆","en":"Islamic Arts Museum Malaysia (IAMM)","cat":"博物馆","area":"湖滨公园 Perdana","addr":"Jalan Lembah Perdana, 50480 Kuala Lumpur","transit":"KTM 吉隆坡旧火车站 Kuala Lumpur 步行约 10 分钟（经国家清真寺）；LRT/MRT Pasar Seni 步行约 15–20 分钟","hours":"每日 9:30–18:00（斋月 9:30–17:00）；仅开斋节和哈芝节休馆","price":"成人 RM20","dur":"2–3 小时","desc":"东南亚最大的伊斯兰艺术博物馆，藏品逾万件，涵盖古兰经手抄本、建筑模型、珠宝、兵器、纺织和陶瓷，来源从中国、印度一直到奥斯曼帝国。馆内多座彩绘穹顶本身就是看点，伊朗工匠打造的穹顶内壁尤其惊艳。","tips":"建议安排在国家清真寺之后，馆内冷气足、适合避暑；楼下中东餐厅评价不错，礼品店的书和工艺品值得逛。","q":"Islamic Arts Museum Malaysia","src":"https://iamm.org.my/visit-us","warn":"","rate":3,"photo":"Islamic Arts Museum Malaysia Exterior (May 2022) - img 02.jpg","been":false,"go":""},{"id":"na-perdana-botanical","zh":"帕迪纳植物园（湖滨公园）","en":"Perdana Botanical Garden (Taman Botani Perdana / Lake Gardens)","cat":"公园自然","area":"湖滨公园 Tasik Perdana","addr":"Jalan Kebun Bunga, Tasik Perdana, 55100 Kuala Lumpur","transit":"MRT 加影线 Muzium Negara 站步行约 15–20 分钟（上坡）；或从 KL Sentral 打 Grab 约 5–10 分钟","hours":"每天 5:30–22:00；周五、周六开到 24:00","price":"免费","dur":"2–3 小时（可与飞禽公园、蝴蝶园连游）","desc":"吉隆坡最老的公共公园，围绕湖泊而建，大片草坪、林荫步道和小桥，园内及周边串起飞禽公园、蝴蝶园、胡姬花园、鹿园等景点。适合清晨或傍晚散步、野餐、拍照，也能远眺 KL Sentral 一带的天际线。","tips":"白天很晒，建议早上或 17 点后去，带水和防晒；园区大、坡多，想连游几个园区可以在园内段落之间打 Grab。","q":"Perdana Botanical Garden Kuala Lumpur","src":"https://www.thestar.com.my/metro/metro-news/2026/05/09/10-kl-parks-now-open-from-530am-10pm","warn":"","rate":3,"photo":"Perdana Botanical Gardens in 2023 01.jpg","been":false,"go":""},{"id":"na-batu-caves","zh":"黑风洞","en":"Batu Caves","cat":"公园自然","area":"鹅唛 Gombak, Selangor","addr":"Gombak, 68100 Batu Caves, Selangor","transit":"KTM 到 Batu Caves 站，出站就是","hours":"每天约 7:00–21:00（以现场为准）","price":"免费（主洞）","dur":"1.5–2 小时","desc":"石灰岩山中的印度教圣地，门口有巨大金色穆鲁甘神像和 272 级彩虹阶梯，爬上去是高大的神庙洞穴。山脚还有罗摩衍那洞等小洞，是吉隆坡最著名的地标之一。","tips":"你已经去过；猕猴会抢食物和塑料袋；进庙需遮膝盖，可现场租围裙。","q":"Batu Caves","src":"https://en.wikipedia.org/wiki/Batu_Caves","warn":"","rate":3,"photo":"Batu Caves Murugan Statue and Stairs 2015.jpg","been":true,"go":""},{"id":"na-bird-park","zh":"吉隆坡飞禽公园","en":"KL Bird Park (Taman Burung Kuala Lumpur)","cat":"动物","area":"湖滨公园 Tasik Perdana","addr":"920 Jalan Cenderawasih, Taman Tasik Perdana, 50480 Kuala Lumpur","transit":"MRT 加影线 Muzium Negara 站步行约 20 分钟（上坡）；或 KL Sentral 打 Grab 约 5–10 分钟","hours":"每天 9:00–17:30（含公共假期）","price":"标准价（非 MyKad）成人 RM90，儿童 3–11 岁 RM70","dur":"2–3 小时","desc":"建在湖滨公园山坡上的大型网罩式鸟园，许多鸟类在巨大网棚里自由飞翔，可近距离看到犀鸟、红鹳、鹦鹉、鹳和孔雀。园内分区有鹦鹉喂食、鸵鸟喂食和猛禽区，是吉隆坡最受欢迎的亲近自然景点之一。","tips":"留意喂食时间：自由飞鸟 10:30、犀鸟 11:30、老鹰 14:30，鹦鹉/鸵鸟喂食 10:00–17:00；上午去较凉快，鸟也更活跃，雨天活动可能取消。","q":"KL Bird Park","src":"https://www.klbirdpark.com/plan-your-visit/","warn":"","rate":3,"photo":"Taman Burung, Kuala Lumpur.jpg","been":false,"go":""},{"id":"dt-genting","zh":"云顶高原","en":"Genting Highlands","cat":"周边一日","area":"彭亨 Pahang · 吉隆坡东北 1 小时","addr":"Genting Highlands, 69000 Pahang","transit":"LRT 到 Bandar Tasik Selatan 走天桥进 TBS 坐巴士，或 KL Sentral LG 层坐官方快线，约 1–1.5 小时到 Awana 缆车站","hours":"Awana SkyWay 缆车约 07:00–23:00（以官网为准）","price":"巴士 RM 10–18 + 缆车单程约 RM 11","dur":"1 天","desc":"山上 18–23 度的度假区：坐 Awana 缆车穿过雨林，中途下车看清水岩庙的九层宝塔和大佛，山顶 SkyAvenue 商场吃饭，山腰有名牌奥特莱斯。","tips":"上午雾少，清水岩庙先去；主题公园门票贵可以不进；带外套。","q":"Genting Highlands Premium Outlets","src":"https://rwgenting.com/en/getting-here/express-bus.html","warn":"","rate":3,"photo":"Chin Swee Caves Temple Pagoda.jpg","been":false,"go":"genting"},{"id":"dt-kselangor","zh":"瓜拉雪兰莪：猴子 + 蓝眼泪 + 萤火虫","en":"Kuala Selangor","cat":"周边一日","area":"雪兰莪 Selangor · 吉隆坡西北 1.5–2 小时","addr":"Kuala Selangor, 45000 Selangor","transit":"LRT 到 Bandar Tasik Selatan → TBS 坐快线巴士（Sri Theven 09:00），约 1.5–2 小时；镇上靠 Grab","hours":"皇家山白天；蓝眼泪船 20:00 / 21:00 / 22:00；萤火虫约 19:45–22:30","price":"巴士约 RM 20 一程；蓝眼泪 RM 75–90；萤火虫 RM 50 / 船","dur":"2 天 1 夜（晚上没公交回 KL）","desc":"皇家山（Bukit Melawati）上有古炮台、灯塔和很亲人的银叶猴，河对岸渔村吃海鲜，晚上坐船看海里的蓝眼泪和红树林里的萤火虫。","tips":"蓝眼泪不保证有，满月前后月亮亮，订最早那班；晚上打车难，提前和司机约好。","q":"Bukit Melawati Kuala Selangor","src":"https://www.visitselangor.com/?p=4363","warn":"","rate":3,"photo":"Silvery leaf monkey mother and baby.jpg","been":false,"go":"ks"},{"id":"dt-melaka","zh":"马六甲古城","en":"Melaka (Malacca)","cat":"周边一日","area":"马六甲 Melaka · 吉隆坡南 2 小时","addr":"Bandar Hilir, 75000 Melaka","transit":"TBS 坐巴士到 Melaka Sentral，约 2 小时，再 Grab 到老城","hours":"全天；博物馆多数 9:00–17:00","price":"巴士约 RM 12–15 一程；红屋博物馆 RM 10 左右","dur":"1 天","desc":"世界遗产老城：荷兰红屋、圣保罗山、鸡场街（Jonker Street）、马六甲河，娘惹菜和鸡饭粒。","tips":"周末鸡场街晚上有夜市；中午很晒。","q":"Stadthuys Melaka","src":"https://www.melaka.gov.my/","warn":"","rate":3,"photo":"Melaka Malaysia Stadthuys-01.jpg","been":true,"go":"mel1"},{"id":"lm-saloma-link","zh":"萨罗玛天桥","en":"Saloma Link","cat":"地标","area":"甘榜巴鲁 Kampung Baru / KLCC","addr":"Saloma Link, Kampung Baru, 50300 Kuala Lumpur（跨巴生河连接甘榜巴鲁与 KLCC）","transit":"LRT Kampung Baru 站走 8 分钟；或从 KLCC 公园 / Jalan Ampang 一侧走 15 分钟","hours":"每日 5:00–01:00（周日及公共假期 0:30 关闭）；晚上亮灯","price":"免费","dur":"30 分钟","desc":"2020 年启用的 69 米人行与单车桥，跨越巴生河和大道，连接甘榜巴鲁马来村与 KLCC。造型取自马来传统“sirih junjung”槟榔叶，晚上外壳会变换彩色 LED 灯光，桥上可同时拍到双子塔和甘榜老屋。","tips":"天黑后 19:30–21:00 去，灯光最好看；可以从 KLCC 走过桥直接去甘榜巴鲁吃马来晚餐。","q":"Saloma Link","src":"https://en.wikipedia.org/wiki/Saloma_Link","warn":"","rate":2,"photo":"Saloma Link Bridge 04.jpg","been":false,"go":""},{"id":"lm-heli-lounge","zh":"直升机停机坪酒吧","en":"Heli Lounge Bar (Menara KH)","cat":"地标","area":"武吉免登 Bukit Bintang","addr":"Level 34, Menara KH, Jalan Sultan Ismail, 50250 Kuala Lumpur","transit":"Monorail Raja Chulan 站，走 3 分钟","hours":"每日约 17:00–次日 1:00（周五六至 2:00）；下雨时停机坪关闭（以店家公告为准）","price":"免入场费，需点饮料消费（价格以现场为准）","dur":"1–2 小时","desc":"办公楼 34 楼的酒吧，从室内爬两段楼梯到 36 楼的真正直升机停机坪，没有护栏遮挡，360° 俯瞰 KL 塔、双子塔和武吉免登夜景。日落时分是 KL 最有名的“喝一杯看夜景”体验。","tips":"傍晚 17:30–18:00 开门就到，才能抢到停机坪位置看日落；21:00 后转 smart casual，忌拖鞋短裤。雷阵雨季节（11 月常见）傍晚可能临时关闭停机坪。","q":"Heli Lounge Bar","src":"https://therooftopguide.com/rooftop-bars-in-kuala-lumpur/heli-lounge-bar.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"lm-kampung-baru","zh":"甘榜巴鲁马来村","en":"Kampung Baru","cat":"街区","area":"甘榜巴鲁 Kampung Baru","addr":"Jalan Raja Muda Musa / Jalan Raja Alang, Kampung Baru, 50300 Kuala Lumpur","transit":"LRT Kampung Baru 站，走 5 分钟","hours":"街区全天；餐馆多 7:00–23:00，部分 24 小时","price":"免费","dur":"1.5–2 小时","desc":"1899 年英国人划给马来人的保留地，至今仍保留木质高脚屋，背景却是双子塔和摩天楼，新旧对比非常强烈。这里是 KL 吃正宗马来菜的地方：椰浆饭、烤鱼、Nasi Kandar、马来糕点 kuih 应有尽有。","tips":"主街 Jalan Raja Muda Musa 傍晚最热闹；这是穆斯林社区，穿着得体、勿在清真寺附近大声喧哗。斋戒月傍晚有大型开斋市集。","q":"Kampung Baru Kuala Lumpur","src":"https://en.wikipedia.org/wiki/Kampung_Baru","warn":"","rate":2,"photo":"Kampung Baru Kuala Lumpur 20230317.jpg","been":false,"go":""},{"id":"lm-kwai-chai-hong","zh":"鬼仔巷","en":"Kwai Chai Hong","cat":"街区","area":"老城 / 茨厂街 Chinatown","addr":"Lorong Panggung, City Centre, 50000 Kuala Lumpur（茨厂街西侧后巷）","transit":"LRT Pasar Seni 站走 7 分钟","hours":"约 9:00–22:00（巷内店铺各异，以现场为准）","price":"免费","dur":"20–30 分钟","desc":"茨厂街后巷里修复的一段 1930 年代老街，墙上壁画重现旧时华人生活：裁缝、拉二胡的老人、趴窗的小孩。入口的红色拱桥和灯笼是打卡点，巷内有几家咖啡馆和小酒吧。","tips":"面积很小，顺路逛即可；傍晚灯笼亮起时氛围最好，周末人多要排队拍照。","q":"Kwai Chai Hong","src":"https://www.edgeprop.my/content/1556008/heritage-walls-kwai-chai-hong","warn":"","rate":2,"photo":"Kwai Chai Hong, Kuala Lumpur in May 2020 04.jpg","been":false,"go":""},{"id":"lm-brickfields","zh":"十五碑小印度","en":"Brickfields Little India","cat":"街区","area":"十五碑 Brickfields / KL Sentral","addr":"Jalan Tun Sambanthan, Brickfields, 50470 Kuala Lumpur","transit":"KL Sentral 站 / Monorail KL Sentral 站，走 5 分钟","hours":"街区全天；商店约 10:00–22:00","price":"免费","dur":"1–1.5 小时","desc":"KL 的“小印度”，Jalan Tun Sambanthan 两侧有彩色拱门和灯柱，店铺卖纱丽、花环、香料、金饰，空气中飘着宝莱坞音乐和茉莉花香。可以吃香蕉叶饭、Thosai、印式奶茶 Teh Tarik 和印度甜点。","tips":"屠妖节（Deepavali，约 10–11 月）前后最热闹，有灯饰和市集；香蕉叶饭用右手吃更地道。离 KL Sentral 很近，适合转车前后顺路逛。","q":"Brickfields Little India","src":"https://en.wikipedia.org/wiki/Brickfields","warn":"","rate":2,"photo":"Kuala Lumpur. Brickfields. Little India Fountain. 2019-12-14 09-25-26.jpg","been":false,"go":""},{"id":"lm-lot10-hutong","zh":"Lot 10 胡同美食街","en":"Lot 10 Hutong","cat":"美食夜市","area":"武吉免登 Bukit Bintang","addr":"Lower Ground Floor, Lot 10 Shopping Centre, 50 Jalan Sultan Ismail, 50250 Kuala Lumpur","transit":"MRT/Monorail Bukit Bintang 站，出站即到","hours":"每日约 10:00–22:00（各档口时间不一）","price":"免费进入；每份约 RM12–25","dur":"1 小时","desc":"Lot 10 商场地下层的美食中心，集合了 KL 和槟城等地的老字号街头小吃分店，如金莲记福建面、新九如肉骨茶、槟城炒粿条等，装修成老街风格。有空调、干净，适合想一次尝多种大马华人小吃的游客。","tips":"中午 12–14 点人最多，避开饭点；价格比路边贵一点，但卫生和舒适度好，下雨天首选。","q":"Lot 10 Hutong","src":"https://www.timeout.com/kuala-lumpur/restaurants-and-cafes/hutong-lot-10","warn":"","rate":2,"photo":"Lot 10 Hutong View 1.jpg","been":false,"go":""},{"id":"lm-sri-petaling-night-market","zh":"大城堡夜市（周二）","en":"Sri Petaling Night Market (Pasar Malam Sri Petaling)","cat":"美食夜市","area":"大城堡 Sri Petaling（Bukit Jalil 隔壁）","addr":"Jalan Radin Tengah, Bandar Baru Sri Petaling, 57000 Kuala Lumpur","transit":"LRT Sri Petaling 站（离 Bukit Jalil 1 站），走 10 分钟；从 The Tropika 打 Grab 约 10 分钟","hours":"仅周二，约 17:00–23:00","price":"免费；小吃每样约 RM3–15","dur":"1–1.5 小时","desc":"离住处最近的大型夜市，位于华人聚居的大城堡市中心，摊位以华人小吃为主：炸物、烤肉、肠粉、糖水、水果，也有衣服杂货。规模比康乐小，但更本地、更少游客。","tips":"适合住 Bukit Jalil 的周二晚上随手去；大城堡本身也是美食区，夜市旁的茶餐室和肉骨茶店值得一试。","q":"Sri Petaling Night Market","src":"https://www.tripzilla.com/night-markets-kuala-lumpur/71020","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"lm-central-market","zh":"中央艺术坊（中央市场）","en":"Central Market (Pasar Seni)","cat":"商场","area":"老城 / 茨厂街 Chinatown","addr":"Jalan Hang Kasturi, City Centre, 50050 Kuala Lumpur","transit":"LRT Pasar Seni 站走 3 分钟（过天桥）；LRT Masjid Jamek 走 7 分钟","hours":"每日约 10:00–21:30/22:00（以官网为准）","price":"免费","dur":"1 小时","desc":"1888 年建的湿货市场，1930 年代改建成浅蓝色 Art Deco 大楼，现在是有空调的手工艺与纪念品商场：蜡染 batik、锡器、木雕、马来服饰、榴莲零食等。旁边 Kasturi Walk 风筝顶棚长廊有小吃和纪念品摊。","tips":"买纪念品比茨厂街正规、价格标得更清楚；二楼有美食阁，可以顺便午餐。是下雨天在老城的好去处。","q":"Central Market Kuala Lumpur","src":"https://www.timeout.com/kuala-lumpur/shops/central-market","warn":"","rate":2,"photo":"Central Market, Kuala Lumpur.jpg","been":false,"go":""},{"id":"lm-pavilion-kl","zh":"柏威年购物中心","en":"Pavilion Kuala Lumpur","cat":"商场","area":"武吉免登 Bukit Bintang","addr":"168 Jalan Bukit Bintang, Bukit Bintang, 55100 Kuala Lumpur","transit":"MRT Bukit Bintang 站出口直通（走 2 分钟）；Monorail Bukit Bintang 走 5 分钟","hours":"每日 10:00–22:00","price":"免费","dur":"2–3 小时","desc":"武吉免登最高档的地标商场，七层数百家店，从奢侈品到日系平价都有。正门的水晶喷泉是打卡点，节庆（圣诞、新春）大型布景很有看头；顶层 Dining Loft 和 Food Republic 美食广场选择多，连通的 Tokyo Street 日式街和 Pavilion Elite。","tips":"游客可在服务台凭护照领 Tourist Privilege Card 享部分店折扣；11–12 月有圣诞装饰和年终大促。","q":"Pavilion Kuala Lumpur","src":"https://www.pavilion-kl.com/","warn":"","rate":2,"photo":"Pavilion KL outview 2 (211030).jpg","been":false,"go":""},{"id":"lm-suria-klcc","zh":"阳光广场（Suria KLCC）","en":"Suria KLCC","cat":"商场","area":"吉隆坡城中城 KLCC","addr":"Kuala Lumpur City Centre, Jalan Ampang, 50088 Kuala Lumpur","transit":"LRT KLCC 站出站直通","hours":"每日 10:00–22:00","price":"免费","dur":"1–2 小时","desc":"双子塔底座的六层商场，参观双子塔、KLCC 公园、水族馆 Aquaria KLCC、国家石油管弦乐厅都要经过这里。店铺齐全，4 楼有美食阁 Rasa Food Arena 和景观餐厅；正门外就是湖边音乐喷泉平台。","tips":"参观双子塔前后来这里吃饭最方便；想要“从下往上拍双塔”的竖图，在正门 Esplanade 外广场取景。","q":"Suria KLCC","src":"https://www.suriaklcc.com.my/","warn":"","rate":2,"photo":"Suria KLCC (211031).jpg","been":false,"go":""},{"id":"lm-trx","zh":"TRX 交易所商场 + 屋顶城市公园","en":"The Exchange TRX & TRX City Park","cat":"商场","area":"敦拉萨国际贸易中心 TRX","addr":"Persiaran TRX, Tun Razak Exchange, 55188 Kuala Lumpur","transit":"MRT Tun Razak Exchange (TRX) 站直通（从 Bukit Jalil：LRT 到 Chan Sow Lin 换 MRT Putrajaya 线 1 站）","hours":"商场每日 10:00–22:00；屋顶公园约早上至晚上（以官网为准）","price":"免费","dur":"2–3 小时","desc":"2023 年底开业的新地标商场，位于 KL 新金融区，顶层是 10 英亩的屋顶城市公园 TRX City Park，种了 150 种本地植物，有草坪、步道、水景和多家餐厅。站在公园能看到默迪卡 118 和 TRX 大楼天际线，环境比老商场更开阔现代。","tips":"傍晚去屋顶公园散步看日落、晚上看城市灯光最舒服；地铁站直通，雨天也方便。","q":"The Exchange TRX","src":"https://theexchange.my/discover/trx-city-park","warn":"","rate":2,"photo":"The Exchange TRX 20231216 (1).jpg","been":false,"go":""},{"id":"cu-masjid-wilayah","zh":"联邦直辖区清真寺（蓝色清真寺）","en":"Masjid Wilayah Persekutuan (Federal Territory Mosque)","cat":"宗教建筑","area":"Jalan Duta / Sri Hartamas 一带","addr":"Jalan Duta, 50480 Kuala Lumpur","transit":"附近无步行可达车站，建议 Grab（从 KL Sentral 约 15 分钟车程）","hours":"游客参观：周六至周四 10:00–15:30；周五 10:00–11:30、15:00–16:30（仅随导览参观）","price":"免费","dur":"1 小时（导览约 45 分钟）","desc":"2000 年建成，融合奥斯曼土耳其（仿伊斯坦布尔蓝色清真寺）与马来传统风格，22 个蓝白圆顶倒映在水池里，是吉隆坡最上镜的清真寺之一。有免费英语导览，讲解伊斯兰文化与建筑细节。","tips":"从 B 门（Anjung B）进，现场借长袍和头巾并分配导游；外廊石地被太阳晒得很烫，建议带袜子。上午光线最好拍圆顶倒影。","q":"Masjid Wilayah Persekutuan","src":"https://masjidwilayah.gov.my/mosque-tour-programme","warn":"","rate":2,"photo":"Kuala Lumpur Malaysia Federal-Territory-Mosque-01.jpg","been":false,"go":""},{"id":"cu-guan-di","zh":"关帝庙（茨厂街）","en":"Guan Di Temple (Kuan Ti Temple)","cat":"宗教建筑","area":"老城 / 茨厂街 Chinatown","addr":"168 Jalan Tun H S Lee, City Centre, 50000 Kuala Lumpur","transit":"LRT/MRT Pasar Seni 步行约 5 分钟","hours":"每日约 7:00–19:00（以官网为准）","price":"免费","dur":"15–20 分钟","desc":"1888 年由广东会馆建立，供奉武圣关公，橙红色外墙在街上一眼可见。殿内有一把约 59 公斤重的青龙偃月刀复制品，信众相信摸一摸能带来好运；与马里安曼印度庙隔街相望。","tips":"早上人少、香火氛围好；和对面的印度庙、附近的仙四师爷庙一起逛。","q":"Guan Di Temple Jalan Tun H S Lee Kuala Lumpur","src":"https://www.wonderfulmalaysia.com/attractions/guan-di-temple-chinatown-kuala-lumpur.htm","warn":"","rate":2,"photo":"Guan Di Temple KL (2022-05).jpg","been":false,"go":""},{"id":"cu-sin-sze-si-ya","zh":"仙四师爷宫","en":"Sin Sze Si Ya Temple","cat":"宗教建筑","area":"老城 / 茨厂街 Chinatown","addr":"14A Lebuh Pudu（另一入口 113A Jalan Tun H S Lee），City Centre, 50050 Kuala Lumpur","transit":"LRT/MRT Pasar Seni 或 LRT Masjid Jamek 步行约 5 分钟","hours":"每日约 7:00–17:00（以官网为准）","price":"免费","dur":"15–20 分钟","desc":"由吉隆坡开埠功臣叶亚来于 1864 年兴建，是吉隆坡最古老的道教庙宇，供奉仙师爷与四师爷。庙身藏在店屋巷子里、与街道成斜角，规模不大但木雕、神龛很有年代感。","tips":"入口不显眼，建议用地图导航找巷口；庙内光线暗，别用闪光灯打扰信众。","q":"Sin Sze Si Ya Temple Kuala Lumpur","src":"https://travel.sygic.com/en/poi/sin-sze-si-ya-temple-poi:20757","warn":"","rate":2,"photo":"Sin Sze Si Ya Temple KL (2022-05) - img 01.jpg","been":false,"go":""},{"id":"cu-chan-see-shu-yuen","zh":"陈氏书院","en":"Chan See Shu Yuen Clan Association","cat":"宗教建筑","area":"老城 / 茨厂街南端 Chinatown","addr":"172 Jalan Petaling, City Centre, 50000 Kuala Lumpur","transit":"MRT Merdeka 步行约 5 分钟；LRT/MRT Pasar Seni 步行约 8 分钟","hours":"每日约 8:00–18:00（以官网为准）","price":"免费（欢迎捐献）","dur":"20 分钟","desc":"1906 年建成的陈氏宗祠，是吉隆坡最精美的宗祠建筑之一。屋脊和外墙布满广东石湾陶塑，描绘戏曲、神话场景，岭南风格的砖雕木刻细节非常耐看。","tips":"重点看屋脊陶塑，带长焦或手机放大拍细节；就在茨厂街南端，可接着逛茨厂街和关帝庙。","q":"Chan See Shu Yuen Temple Jalan Petaling","src":"https://www.malaysia-traveller.com/chan-she-shu-yuen.html","warn":"","rate":2,"photo":"Kuala Lumpur Malaysia Chan-She-Shu-Yuen-Clan-Association-01.jpg","been":false,"go":""},{"id":"cu-sri-kandaswamy","zh":"斯里甘达斯瓦米印度庙","en":"Sri Kandaswamy Kovil","cat":"宗教建筑","area":"小印度 Brickfields","addr":"No 3, Jalan Tebing, Brickfields, 50470 Kuala Lumpur","transit":"Monorail Tun Sambanthan 步行约 5 分钟；KL Sentral 步行约 10 分钟","hours":"每日 5:30–13:00（周五至周日至 13:30）、17:00–21:00（周五至周日至 21:30）","price":"免费","dur":"20–30 分钟","desc":"1902 年由斯里兰卡泰米尔人社群创建的室建陀（穆鲁甘）神庙，按南印度 Agama 规制重建，彩绘塔门和花岗岩神殿雕工精细。是吉隆坡斯里兰卡泰米尔人最重要的宗教中心之一。","tips":"中午 13:00–17:00 关闭，最好傍晚 18:30 法会时段去；进庙脱鞋、遮肩过膝。可顺便逛 Brickfields 小印度吃香蕉叶饭。","q":"Sri Kandaswamy Kovil Brickfields","src":"https://www.srikandaswamykovil.org/contact","warn":"","rate":2,"photo":"Kuala Lumpur. Sri Kandaswamy Kovil. Temple gate. 2019-12-13 17-53-27.jpg","been":false,"go":""},{"id":"cu-muzium-negara","zh":"马来西亚国家博物馆","en":"Muzium Negara (National Museum of Malaysia)","cat":"博物馆","area":"湖滨公园 / KL Sentral 附近","addr":"Jalan Damansara, 50566 Kuala Lumpur","transit":"MRT Muzium Negara 站直达（步行约 3–5 分钟）；KL Sentral 步行约 10 分钟","hours":"每日 9:00–17:00（16:30 停止售票）；开斋节首日、哈芝节首日休馆（以官网为准）","price":"外国成人 RM5","dur":"1.5–2 小时","desc":"1963 年落成，外观是马来传统高脚屋造型，正面两幅巨型马赛克壁画讲述马来亚历史。四个展厅从史前、马六甲王朝、殖民时期讲到独立建国，户外还展出古董火车头和传统马来木屋。","tips":"想快速了解马来西亚历史最适合来这里，门票很便宜。距 Bukit Jalil 坐 LRT→KL Sentral 换 MRT 很方便。","q":"Muzium Negara Kuala Lumpur","src":"https://www.malaysia-traveller.com/national-museum.html","warn":"","rate":2,"photo":"Muzium Negara Malaysia KL (2022-05).jpg","been":false,"go":""},{"id":"cu-textile-museum","zh":"国家纺织博物馆","en":"Muzium Tekstil Negara (National Textile Museum)","cat":"博物馆","area":"老城 / 独立广场 Dataran Merdeka","addr":"26 Jalan Sultan Hishamuddin, 50050 Kuala Lumpur","transit":"LRT Masjid Jamek 步行约 5 分钟；LRT/MRT Pasar Seni 步行约 7 分钟","hours":"每日 9:00–17:00（16:30 停止售票）；开斋节前两天、哈芝节首日休馆","price":"外国成人 RM5","dur":"1 小时","desc":"位于 1905 年建成的摩尔式红白条纹殖民建筑里（原联邦铁路局大楼），展示马来西亚各族传统织物：宋锦（songket）、峇迪（batik）、娘惹珠绣、婆罗洲伊班族编织等，还有金银首饰展厅。","tips":"建筑本身就值得拍，就在独立广场旁边，适合与占美清真寺、苏丹阿都沙末大厦串成老城步行线。","q":"National Textile Museum Kuala Lumpur","src":"https://www.malaysia-traveller.com/textile-museum.html","warn":"","rate":2,"photo":"2016 Kuala Lumpur, Narodowe Muzeum Włókiennictwa.jpg","been":false,"go":""},{"id":"cu-kl-city-gallery","zh":"吉隆坡城市馆（I ♥ KL）","en":"Kuala Lumpur City Gallery (KLCG)","cat":"博物馆","area":"老城 / 独立广场 Dataran Merdeka","addr":"Bangunan Sultan Abdul Samad, Jalan Raja, Dataran Merdeka, 50050 Kuala Lumpur","transit":"LRT Masjid Jamek 步行约 5 分钟","hours":"每日 9:00–18:00","price":"收费（2026 年起对外国游客售票，网购约 RM40，以官网为准）","dur":"1–1.5 小时","desc":"原本在独立广场旁的旧馆以巨型吉隆坡城市模型和门口“I ♥ KL”打卡牌出名；2026 年 2 月苏丹阿都沙末大厦修复后重新开放，城市馆迁入大厦一楼，以时间线、老照片、立体模型和声光装置讲述吉隆坡从锡矿小镇到大都会的历程。","tips":"顺便参观整栋修复后的苏丹阿都沙末大厦（底层有游客中心和咖啡馆）；I ♥ KL 打卡牌位置以现场为准。","q":"Kuala Lumpur City Gallery Bangunan Sultan Abdul Samad","src":"https://thesmartlocal.my/bangunan-sultan-abdul-samad/","warn":"","rate":2,"photo":"Sultan Abdul Samad Building in 2023.jpg","been":false,"go":""},{"id":"cu-bank-negara-museum","zh":"国家银行博物馆与美术馆","en":"Museum and Art Gallery Bank Negara Malaysia","cat":"博物馆","area":"Jalan Dato' Onn / 独立广场北","addr":"Sasana Kijang, 2 Jalan Dato' Onn, 50480 Kuala Lumpur","transit":"KTM Bank Negara 站步行约 3 分钟；LRT Bandaraya 步行约 10 分钟","hours":"周二至周日 10:00–17:00；周一及开斋节前三天休馆（以官网为准）","price":"免费","dur":"1–1.5 小时","desc":"位于央行 Sasana Kijang 大楼内，分货币史、钱币、伊斯兰金融、经济等多个展厅；最受欢迎的是透明“钱隧道”，墙里塞满上百万令吉现钞，以及答题开金库的互动装置。顶楼美术馆展出央行收藏的马来西亚与东盟艺术品。","tips":"入口需过安检登记，不要带大型行李；冷气很足适合雨天。","q":"Museum and Art Gallery Bank Negara Malaysia","src":"https://www.malaysia-traveller.com/bank-negara-museum.html","warn":"","rate":2,"photo":"Bank Negara Malaysia Museum and Art Gallery.jpg","been":false,"go":""},{"id":"cu-national-art-gallery","zh":"国家美术馆","en":"Balai Seni Negara (National Art Gallery)","cat":"博物馆","area":"蒂蒂旺沙 Titiwangsa / Jalan Tun Razak","addr":"No. 2, Jalan Temerloh, off Jalan Tun Razak, 53200 Kuala Lumpur","transit":"LRT/Monorail/MRT Titiwangsa 步行约 10–15 分钟","hours":"每日 10:00–18:00（斋月 9:00–17:00）；开斋节、哈芝节休馆（以官网为准）","price":"免费","dur":"1–2 小时","desc":"马来西亚最重要的现当代艺术馆，收藏数千件本地艺术家作品，多层展厅轮换展出绘画、装置与摄影。建筑造型现代，旁边就是国家剧院（Istana Budaya）。","tips":"展览常轮换，出发前看官网当期展；可与国家剧院、蒂蒂旺沙湖公园一起安排。","q":"Balai Seni Negara Kuala Lumpur","src":"https://www.visitselangor.com/?p=3194","warn":"","rate":2,"photo":"Balai Seni Negara.jpg","been":false,"go":""},{"id":"cu-ilham-gallery","zh":"ILHAM 美术馆","en":"ILHAM Gallery","cat":"博物馆","area":"KLCC / Jalan Binjai","addr":"Levels 3 & 5, ILHAM Tower, No 8 Jalan Binjai, 50450 Kuala Lumpur","transit":"LRT Ampang Park 步行约 2 分钟；MRT Persiaran KLCC 步行约 3 分钟","hours":"周二至周六 11:00–19:00，周日 11:00–17:00；周一及公众假期休","price":"免费","dur":"1 小时","desc":"位于 Foster + Partners 设计的 ILHAM 大厦内的私立当代艺术馆，策展质量高，定期推出马来西亚及东南亚现当代艺术大展，也有电影放映与讲座。","tips":"展期之间会闭馆换展，去前看官网是否有展；大厦楼下有咖啡馆，离双子塔步行约 15 分钟。","q":"ILHAM Gallery Kuala Lumpur","src":"https://ilhamgallery.com/data/uploads/2025/ias25/ilham-art-show-2025_leaflet_web.pdf","warn":"","rate":2,"photo":"Ilham Tower, Kuala Lumpur in April 2020.jpg","been":false,"go":""},{"id":"cu-seri-negara","zh":"Seri Negara 国家宅邸","en":"Seri Negara (Galeri Seri Negara)","cat":"博物馆","area":"湖滨公园 Perdana","addr":"Persiaran Tuanku Ja'afar, Tasik Perdana, 50480 Kuala Lumpur","transit":"无近站，建议 Grab；KTM 吉隆坡旧火车站步行约 25 分钟","hours":"周二至周日 10:00–18:00；周一休","price":"需提前网上购票（标准票约 RM40 起）（以官网为准）","dur":"1.5 小时","desc":"1913 年建成的英殖民总督府“King's House”，1957 年马来亚联合邦协定在此签署，也是电影《摘金奇缘》里杨家大宅的取景地。2025 年 12 月修复后开放，设四个主题展厅讲述独立前后的历史，有签约场景复原和沉浸式短片。","tips":"须在官网预约时段并先购票；与隔壁 Carcosa、湖滨公园、国家清真寺可连成一线。","q":"Seri Negara Kuala Lumpur","src":"https://thesmartlocal.my/?p=276733","warn":"","rate":2,"photo":"2026 - Seri Negara 12.jpg","been":false,"go":""},{"id":"cu-aquaria-klcc","zh":"KLCC 水族馆","en":"Aquaria KLCC","cat":"室内","area":"KLCC","addr":"Concourse Level, Kuala Lumpur Convention Centre, Jalan Pinang, 50088 Kuala Lumpur","transit":"LRT KLCC 站步行约 10 分钟（穿过 Suria KLCC 与会展中心）；或从 Bukit Bintang 走空中步道约 15 分钟","hours":"每日 10:00–20:00（最后入场 19:00）（以官网为准）","price":"外国成人约 RM60–75（网上提前买较便宜）（以官网为准）","dur":"1.5–2 小时","desc":"位于吉隆坡会展中心地下层的大型水族馆，饲养约 5,000 只海洋与淡水生物，最大亮点是 90 米长的海底隧道，可看到沙虎鲨、魟鱼和海龟从头顶游过。还有喂食秀、电鳗区和雨林展区。","tips":"网上购票通常比柜台便宜；工作日上午人最少。逛完可去 KLCC 公园看双子塔夜景和喷泉秀。","q":"Aquaria KLCC","src":"https://www.redbus.my/travel-guide/?p=974","warn":"","rate":2,"photo":"Underwater tunnel in Aquaria KLCC.jpg","been":false,"go":""},{"id":"na-kl-forest-eco-park","zh":"吉隆坡生态森林公园（武吉纳纳斯树冠吊桥）","en":"KL Forest Eco Park (Taman Eko Rimba Kuala Lumpur, Bukit Nanas)","cat":"公园自然","area":"市中心 武吉纳纳斯 Bukit Nanas","addr":"Jalan Raja Chulan, Bukit Nanas, 50250 Kuala Lumpur（近吉隆坡塔）","transit":"Monorail Bukit Nanas 站或 LRT Dang Wangi 站步行约 10–15 分钟；也可从吉隆坡塔一侧入园","hours":"约 8:00–16:30（有资料称周五及恶劣天气关闭，以官网为准）","price":"外国人 RM40（MyKad RM10），含树冠吊桥","dur":"1–2 小时","desc":"位于市中心的原始雨林保护区，是马来西亚最古老的森林保护区之一。园内有几条短步道和离地数层楼高的树冠吊桥（Canopy Walk），能在雨林树冠间穿行，同时看到吉隆坡塔。","tips":"入口售票据称只收现金；有猴子出没，食物收好；雨后步道湿滑，穿防滑鞋。","q":"KL Forest Eco Park","src":"https://rollinggrace.com/2026/04/03/kl-forest-eco-park-canopy-walk/","warn":"雪兰莪的森林公园 11/16 起雨季关闭，这里受不受影响没查到，去前看官网","rate":2,"photo":"KL Forest Eco-Park Canopy Walk 5.jpg","been":false,"go":""},{"id":"na-titiwangsa","zh":"蒂蒂旺沙湖滨公园","en":"Titiwangsa Lake Gardens (Taman Tasik Titiwangsa)","cat":"公园自然","area":"蒂蒂旺沙 Titiwangsa","addr":"Jalan Temerloh, Titiwangsa, 53200 Kuala Lumpur","transit":"LRT/MRT/Monorail Titiwangsa 站步行约 10–15 分钟","hours":"每天 5:30–22:00；周五、周六开到 24:00","price":"免费","dur":"1–2 小时","desc":"围绕大湖的城市公园，湖面可以拍到双子塔和吉隆坡塔同框的经典天际线。本地人在这里跑步、骑车、划船，傍晚和夜景尤其好看。","tips":"日落前后去最佳，可以拍天际线夜景；周末傍晚人多。","q":"Taman Tasik Titiwangsa","src":"https://www.thestar.com.my/metro/metro-news/2026/05/09/10-kl-parks-now-open-from-530am-10pm","warn":"","rate":2,"photo":"Taman Tasik Titiwangsa (220413) 04.jpg","been":false,"go":""},{"id":"na-bukit-jalil-park","zh":"武吉加里尔休闲公园","en":"Bukit Jalil Recreational Park (Taman Rekreasi Bukit Jalil)","cat":"公园自然","area":"武吉加里尔 Bukit Jalil","addr":"Jalan Jalil Perkasa 1, Bukit Jalil, 57000 Kuala Lumpur（以地图为准）","transit":"离 The Tropika 很近，步行或 Grab 几分钟；也可从 LRT Awan Besar 站搭免费接驳车到 Pavilion Bukit Jalil，再步行过桥约 5 分钟","hours":"每天 5:30–22:00","price":"免费","dur":"1–2 小时","desc":"市政局管理的大型休闲公园，有湖泊、林荫步道、跑步道、儿童游乐场和健身设施，是武吉加里尔居民晨跑和散步的地方。紧邻 Pavilion Bukit Jalil 商场，逛完公园可以直接去商场吃饭。","tips":"就在住处旁边，适合早晨跑步或傍晚散步；早上 7–9 点最凉快。","q":"Bukit Jalil Recreational Park","src":"https://www.thestar.com.my/metro/metro-news/2026/05/09/10-kl-parks-now-open-from-530am-10pm","warn":"","rate":2,"photo":"Lake at Taman Bukit Jalil - panoramio.jpg","been":false,"go":""},{"id":"na-frim","zh":"马来西亚森林研究院 FRIM（甲洞）","en":"Forest Research Institute Malaysia (FRIM), Kepong","cat":"公园自然","area":"甲洞 Kepong, Selangor","addr":"Jalan FRIM, 52109 Kepong, Selangor","transit":"MRT 加影线 Kepong Baru 站或 KTM Kepong 站转 Grab 约 10–15 分钟；园区很大，建议开车/Grab 进园","hours":"园区白天开放；Forest Skywalk 周六至周四 8:30–12:30、14:30–15:30，周五休息，视天气（以官网为准）","price":"入园外国人约 RM5（2022 价目）；Forest Skywalk 外国成人 RM40","dur":"半天","desc":"1929 年起由人工种植的热带雨林研究园区，被列入联合国教科文组织世界遗产，林间步道可以看到樟脑树\"树冠羞避\"现象。老的树冠吊桥（Canopy Walkway）目前开放情况未能确认，主推的是园区内甲洞植物园的 Forest Skywalk：11 座塔、8 段吊桥，最高 50 米观景台可眺望森林和吉隆坡天际线。","tips":"Forest Skywalk 建议提前在官网预订，大雨时会关闭；园区大且没有公交，带足水，注意蚊虫。","q":"FRIM Kepong Forest Skywalk","src":"https://skywalk.frim.gov.my","warn":"雨季可能有步道关闭，去前看官网","rate":2,"photo":"FRIM 02.jpg","been":false,"go":""},{"id":"na-butterfly-park","zh":"吉隆坡蝴蝶公园","en":"Kuala Lumpur Butterfly Park (Taman Rama-Rama)","cat":"动物","area":"湖滨公园 Tasik Perdana","addr":"Jalan Cenderasari, Tasik Perdana, 50480 Kuala Lumpur","transit":"MRT 加影线 Muzium Negara 站步行约 15 分钟；或 KL Sentral 打 Grab 约 5 分钟","hours":"每天约 9:00–18:00（以官网为准）","price":"成人约 RM25–30（各来源说法不一，以现场为准，有资料称只收现金）","dur":"1 小时","desc":"模拟热带雨林的大网棚蝴蝶园，种满开花植物，数千只蝴蝶在步道间飞舞，还有锦鲤池和昆虫标本馆。规模不大但很适合拍照，可和旁边的飞禽公园、胡姬花园安排在同一天。","tips":"晴天上午蝴蝶最活跃，阴雨天蝴蝶多停着不飞；园内闷热潮湿，带水。","q":"Kuala Lumpur Butterfly Park","src":"https://www.timeout.com/kuala-lumpur/attractions/kl-butterfly-park","warn":"","rate":2,"photo":"Kuala Lumpur Butterfly Park (5).jpg","been":false,"go":""},{"id":"na-zoo-negara","zh":"国家动物园","en":"Zoo Negara (National Zoo of Malaysia)","cat":"动物","area":"乌鲁巴生 Hulu Kelang, Ampang","addr":"Zoo Negara Malaysia, Hulu Kelang, 68000 Ampang, Selangor","transit":"LRT Kelana Jaya 线 Wangsa Maju 站转 Grab 约 10 分钟（约 3.6 公里）","hours":"每天 9:00–17:00","price":"外国人成人约 RM88（门市价，网购常更便宜，以官网为准）","dur":"3–4 小时","desc":"马来西亚最大的动物园，饲养数百种动物，包括马来虎、红毛猩猩、大象和长颈鹿。2025 年 11 月新抵达的大熊猫\"Chen Xing\"和\"Xiao Yue\"已于 2026 年 1 月正式与公众见面。","tips":"园区大且炎热，早上开门就去；园内有游园车，带水和防晒。","q":"Zoo Negara","src":"https://www.malaysia.travel/explore/zoo-negara","warn":"","rate":2,"photo":"Zoo Negara entrance with elephant sculpture.jpg","been":false,"go":""},{"id":"na-sunway-lagoon","zh":"双威水上乐园","en":"Sunway Lagoon","cat":"乐园","area":"双威城 Bandar Sunway, Petaling Jaya","addr":"3, Jalan PJS 11/11, Bandar Sunway, 47500 Selangor","transit":"LRT Sri Petaling 线（与 Awan Besar 同线）到 USJ 7 站，换 BRT Sunway 线到 Sunway Lagoon 站；或 Grab 约 20–30 分钟","hours":"周三至周一 10:00–23:00（夜间乐园 18:00–23:00）；周二休息（马来西亚学校假期和公共假期除外）","price":"非 MyKad 成人 RM268，儿童 RM200（一日票）","dur":"全天","desc":"由废弃矿坑改建的大型主题乐园，包含水上乐园、游乐园、野生动物园、极限公园和夜间乐园等多个区。有人造冲浪池、长距离水滑梯和吊桥，是吉隆坡周边最大的乐园。","tips":"官网提前买票有时有优惠；带泳衣、防晒，储物柜和毛巾另收费；下午常有雷阵雨，水上项目会暂停。","q":"Sunway Lagoon","src":"https://sunwaylagoon.com/pricing/","warn":"","rate":2,"photo":"Sunway Lagoon view from Sunway Resort Hotel.jpg","been":false,"go":""},{"id":"na-genting-skyworlds","zh":"云顶云星主题乐园","en":"Genting SkyWorlds Theme Park","cat":"乐园","area":"彭亨州 云顶高原 Genting Highlands","addr":"Genting SkyWorlds, Resorts World Genting, 69000 Genting Highlands, Pahang","transit":"LRT Sri Petaling 线到 Bandar Tasik Selatan 站（TBS 巴士总站）搭巴士到 Awana Skyway 缆车站，再坐缆车上山，单程约 1.5 小时；或 Grab 约 1 小时","hours":"约 10:00–18:00（有资料称周二休，以官网为准）","price":"非 MyKad 网购约 RM86，现场约 RM116（2025 年价目，以官网为准）","dur":"全天","desc":"云顶高原上的户外主题乐园，以好莱坞电影为主题分区，有过山车和多种刺激项目。山上气温约 15–25°C，可以顺便坐缆车、逛云顶商场和室内乐园 Skytropolis。","tips":"山上常起雾下雨，带外套和雨具；周末和假期排队长，平日去更划算。","q":"Genting SkyWorlds","src":"https://gentingskyworlds.com/en/tickets.html","warn":"","rate":2,"photo":"Genting SkyWorlds Theme Park.jpg","been":false,"go":""},{"id":"na-putrajaya","zh":"布城","en":"Putrajaya","cat":"周边一日","area":"布城联邦直辖区 Putrajaya","addr":"Putra Mosque, Persiaran Persekutuan, Presint 1, 62502 Putrajaya","transit":"MRT 布城线到 Putrajaya Sentral 站，再 Grab 约 10 分钟到粉红清真寺；或 KLIA Transit 到 Putrajaya & Cyberjaya 站","hours":"公园和广场全天；清真寺开放参观时间以现场为准（周五中午祈祷时段不开放）","price":"免费","dur":"半天到一天","desc":"马来西亚的行政首都，规划了大湖、桥梁和宏伟政府建筑，代表景点有粉红色的布特拉清真寺、首相署和铁清真寺。可以环湖散步或坐游船，部分公园和步道早上 5:30 开放。","tips":"你已经去过；白天非常晒，建议傍晚去看日落和桥梁夜景。","q":"Putra Mosque Putrajaya","src":"https://www.thestar.com.my/metro/metro-news/2026/05/09/10-kl-parks-now-open-from-530am-10pm","warn":"","rate":2,"photo":"Putra Mosque being reflected in the lake (crop).jpg","been":true,"go":""},{"id":"na-blue-mosque","zh":"莎阿南蓝色清真寺","en":"Sultan Salahuddin Abdul Aziz Shah Mosque (Masjid Sultan Salahuddin Abdul Aziz Shah)","cat":"周边一日","area":"莎阿南 Shah Alam, Selangor","addr":"Persiaran Masjid, Seksyen 14, 40000 Shah Alam, Selangor","transit":"Grab 最方便（从 Bukit Jalil 约 30–40 分钟）；或 KTM 到 Shah Alam 站再 Grab 约 10 分钟","hours":"游客约 9:00–12:30、14:45–16:00、17:00–18:30，周五上午不开放（各来源不一，以现场为准）","price":"免费","dur":"1 小时","desc":"雪兰莪州的州清真寺，拥有巨大的蓝银色圆顶和四座高耸宣礼塔，是东南亚最大的清真寺之一。2025 年接待游客超过 10 万人次，旁边湖滨公园适合拍全景。","tips":"穿长袖长裤，女性需包头（一般可借长袍和头巾）；避开周五中午祈祷时段。","q":"Masjid Sultan Salahuddin Abdul Aziz Shah","src":"https://www.visitselangor.com/?p=235","warn":"","rate":2,"photo":"Sultan Salahuddin Abdul Aziz Mosque by Fairus Khafiz.jpg","been":false,"go":""},{"id":"na-royal-selangor","zh":"皇家雪兰莪锡器访客中心","en":"Royal Selangor Visitor Centre","cat":"周边一日","area":"文良港 Setapak","addr":"4, Jalan Usahawan 6, Setapak Jaya, 53300 Kuala Lumpur","transit":"LRT Kelana Jaya 线 Wangsa Maju 站打 Grab 约 10 分钟；访客中心也提供部分酒店免费接驳（需预约）","hours":"每天 9:00–17:00（含公共假期）","price":"免费入场；School of Hard Knocks 锡器敲打体验 RM80（30 分钟），The Foundry 工作坊 RM180（60 分钟，15 岁以上）","dur":"1–2 小时","desc":"百年锡器品牌皇家雪兰莪的工厂与博物馆，可以免费参观锡器历史展厅、看工匠现场制作，还有用锡器搭成的巨型双子塔模型。亲手敲打锡碗的 School of Hard Knocks 体验很受欢迎。","tips":"导览和工作坊建议提前在官网预约；可以和国家动物园安排在同一天（都在 Wangsa Maju 一带）。","q":"Royal Selangor Visitor Centre","src":"https://visitorcentre.royalselangor.com/","warn":"","rate":2,"photo":"Royal Selangor Visitor Centre entrance.JPG","been":false,"go":""},{"id":"lm-istana-negara","zh":"国家王宫（大门）","en":"Istana Negara (National Palace)","cat":"地标","area":"杜塔 Jalan Duta","addr":"Jalan Tuanku Abdul Halim (Jalan Duta), 50480 Kuala Lumpur","transit":"无轨道直达，打 Grab 最方便（从市中心约 15 分钟）；城市观光巴士也停靠","hours":"只能在 1 号大门外参观，白天约 8:00–17:00；大型换岗仪式不定期举办（多在周六上午 9:00），日常有骑兵/卫兵站岗","price":"免费","dur":"30 分钟","desc":"马来西亚最高元首的官邸，2011 年启用，金色圆顶宫殿坐落在山坡上。游客只能在大门前拍照，门口有身穿传统制服的皇家骑兵和步兵站岗，偶尔举行有乐队、骑兵的正式换岗仪式。","tips":"大门外很晒且停留时间短，适合和国家清真寺、国家英雄纪念碑等一起打车串游；不要触碰卫兵或马匹。","q":"Istana Negara","src":"https://www.thestar.com.my/news/nation/2025/05/10/changing-of-the-guard-at-istana-negara-showcases-military-tradition","warn":"","rate":1,"photo":"Kuala Lumpur Malaysia-Istana Negara-Jalan-Duta-01.jpg","been":false,"go":""},{"id":"lm-tugu-negara","zh":"国家英雄纪念碑","en":"Tugu Negara (National Monument)","cat":"地标","area":"湖滨公园 Perdana Botanical Garden","addr":"Jalan Parlimen, Tasik Perdana, 50480 Kuala Lumpur","transit":"无轨道直达，从 LRT Masjid Jamek / KL Sentral 打 Grab 约 10 分钟","hours":"每日约 7:00–18:00","price":"免费","dur":"30–45 分钟","desc":"纪念二战及马来亚紧急状态中牺牲军人的青铜群雕，15.5 米高的 7 人雕像出自美国硫磺岛纪念碑作者 Felix de Weldon 之手。四周是倒影池和新月形廊道，旁边还有东盟雕塑园，环境安静、视野开阔。","tips":"可与湖滨公园（佩尔达纳植物园）、国家清真寺、国家王宫一起打车游；早上或傍晚去，避开正午暴晒。","q":"Tugu Negara","src":"https://www.visitselangor.com/?p=3078","warn":"","rate":1,"photo":"Kuala Lumpur Malaysia Tugu-Negara-Malaysia-01.jpg","been":false,"go":""},{"id":"lm-masjid-india","zh":"印度清真寺 / 东姑阿都拉曼路","en":"Masjid India & Jalan Tuanku Abdul Rahman (Jalan TAR)","cat":"街区","area":"老城 / 印度清真寺 Masjid India","addr":"Jalan Masjid India & Jalan Tuanku Abdul Rahman, City Centre, 50100 Kuala Lumpur","transit":"LRT Masjid Jamek 站走 3 分钟；LRT Bandaraya 站走 5 分钟","hours":"街区全天；商店约 10:00–21:00；周六傍晚 Lorong TAR 有夜市（约 17:00–24:00）","price":"免费","dur":"1–1.5 小时","desc":"KL 最老的商业区之一，印度清真寺周边是印裔穆斯林商圈，卖布料、纱丽、马来传统服、香料和金饰。Jalan TAR 是老牌布料街，有 Coliseum 老戏院和 1921 年的 Coliseum Café；周六晚 Lorong TAR 有本地人逛的夜市。","tips":"开斋节前布料街最热闹，人潮拥挤小心扒手；可从 Masjid Jamek 一路步行逛到 Sogo，再坐 LRT 回去。","q":"Masjid India Kuala Lumpur","src":"https://en.wikipedia.org/wiki/Jalan_Tuanku_Abdul_Rahman","warn":"","rate":1,"photo":"Masjid India Kuala Lumpur 20230506 203528.jpg","been":false,"go":""},{"id":"lm-chow-kit","zh":"秋杰巴刹（Chow Kit 菜市场）","en":"Chow Kit Market (Bazaar Baru Chow Kit)","cat":"美食夜市","area":"秋杰 Chow Kit","addr":"Jalan Raja Bot, Chow Kit, 50300 Kuala Lumpur","transit":"Monorail Chow Kit 站，走 5 分钟","hours":"每日约 6:00–17:00（早上最热闹）","price":"免费","dur":"1 小时","desc":"KL 最大的传统湿货市场，迷宫一样的棚下摊位卖鲜鱼、肉类、热带水果、香料和马来糕点，还有便宜衣服日用品。能看到最原汁原味的本地日常，市场边的马来摊档早餐、Nasi Lemak 便宜又地道。","tips":"早上 8–10 点去最有活力；地面湿滑穿防水鞋，看好随身物品，拍摊主前先打招呼。","q":"Chow Kit Market","src":"https://www.timeout.com/kuala-lumpur/shops/chow-kit-market","warn":"","rate":1,"photo":"Bazaar Baru Chow Kit.JPG","been":false,"go":""},{"id":"lm-kampung-baru-market","zh":"甘榜巴鲁周末夜市","en":"Pasar Minggu Kampung Baru","cat":"美食夜市","area":"甘榜巴鲁 Kampung Baru","addr":"Jalan Raja Muda Musa / Jalan Raja Bot, Kampung Baru, 50300 Kuala Lumpur","transit":"LRT Kampung Baru 站，走 5 分钟","hours":"每周一次，傍晚约 18:00–凌晨 1:00（名为“星期日市集”，各资料周六晚/周日晚说法不一，以当地为准）","price":"免费；小吃每样约 RM2–15","dur":"1–1.5 小时","desc":"自 1899 年延续至今的马来传统市集，以马来小吃为主：烤鸡翅、沙爹、Murtabak 煎饼、各色 kuih 糕点、椰浆饭，还有便宜的马来传统服装和布料。","tips":"出发前用 Google Maps 查当晚是否开市；摊位基本只收现金。","q":"Pasar Minggu Kampung Baru","src":"https://www.tripzilla.com/night-markets-kuala-lumpur/71020","warn":"","rate":1,"photo":"Jalan Raja Muda Musa, Kampong Bharu (220813).jpg","been":false,"go":""},{"id":"lm-mid-valley","zh":"谷中城 + 花园购物中心","en":"Mid Valley Megamall & The Gardens Mall","cat":"商场","area":"谷中城 Mid Valley","addr":"Mid Valley City, Lingkaran Syed Putra, 59200 Kuala Lumpur","transit":"KTM Mid Valley 站，走 3 分钟（从 Bukit Jalil：LRT 到 Bandar Tasik Selatan 换 KTM 往 KL Sentral 方向 3 站）；Grab 约 20 分钟","hours":"每日 10:00–22:00","price":"免费","dur":"2–4 小时","desc":"东南亚最大的商场之一，Mid Valley 偏大众平价（AEON、Uniqlo、各种连锁餐厅），相连的 The Gardens Mall 偏精品高档。吃喝逛一站式，是本地人周末最常去的商场。","tips":"商场很大容易迷路，记住停靠的入口编号；周末下午人极多，工作日上午最舒服。","q":"Mid Valley Megamall","src":"https://www.midvalley.com.my/","warn":"","rate":1,"photo":"Mid Valley Megamall 2020 1.jpg","been":false,"go":""},{"id":"lm-berjaya-times-square","zh":"成功时代广场","en":"Berjaya Times Square","cat":"商场","area":"武吉免登 Bukit Bintang / 燕美路 Imbi","addr":"1 Jalan Imbi, Bukit Bintang, 55100 Kuala Lumpur","transit":"Monorail Imbi 站，天桥直通（走 2 分钟）","hours":"商场每日 10:00–22:00；室内游乐园约平日 12:00–20:00、周末 11:00–21:00（以官方为准）","price":"商场免费；室内游乐园外国成人约 RM60（以官方为准）","dur":"1–3 小时","desc":"48 层的双塔综合体，商场部分约千家店铺，以平价服饰、电子产品、动漫周边和日韩美食为主。5 楼起有东南亚最大的室内游乐园之一，含室内过山车。","tips":"商场偏平价、人气比 Pavilion 低，适合淘电子配件和平价衣物；带小孩或下雨天可考虑游乐园，单人旅行优先级不高。","q":"Berjaya Times Square","src":"https://www.traveloka.com/en-en/activities/indonesia/product/2001429893381","warn":"","rate":1,"photo":"Kuala Lumpur Malaysia Berjaya-Times-Square-02.jpg","been":false,"go":""},{"id":"lm-pavilion-bukit-jalil","zh":"武吉加里尔柏威年","en":"Pavilion Bukit Jalil","cat":"商场","area":"武吉加里尔 Bukit Jalil（住处附近）","addr":"2 Persiaran Jalil 8, Bandar Bukit Jalil, 57000 Kuala Lumpur","transit":"LRT Awan Besar 站有免费接驳巴士（8:00–23:00）；从 The Tropika 打 Grab 约 5–10 分钟","hours":"每日 10:00–22:00","price":"免费","dur":"1–3 小时","desc":"2021 年底开业的超大商场，面积比市中心的 Pavilion 还大，有超市、各类连锁餐厅、电影院和户外中庭。有槟城老街风格的美食区 Penang Street，是住 Bukit Jalil 日常吃饭购物的首选。","tips":"平时傍晚或下雨天最适合来吃饭；周末下午人多，Grab 回程可能要等。","q":"Pavilion Bukit Jalil","src":"https://www.pavilion-bukitjalil.com/about","warn":"","rate":1,"photo":"Pavilion Bukit Jalil (211205) 01.jpg","been":false,"go":""},{"id":"cu-st-marys-cathedral","zh":"圣玛丽座堂","en":"St. Mary's Cathedral","cat":"宗教建筑","area":"老城 / 独立广场 Dataran Merdeka","addr":"Jalan Raja, City Centre, 50050 Kuala Lumpur（独立广场北侧）","transit":"LRT Masjid Jamek 步行约 5–7 分钟","hours":"官网写每日 9:00–17:00；周日上午有多场英文礼拜（7:00、9:00、11:00 等）（以官网为准）","price":"免费","dur":"20–30 分钟","desc":"建于 1894 年的英国圣公会座堂，是马来西亚最古老的英式哥特复兴风格教堂之一，白色外墙、尖顶山墙配绿草坪，与独立广场的殖民建筑群相呼应。堂内保存有 1895 年的 Henry Willis 管风琴。","tips":"有消息称主堂因修复工程暂停游客参观，去前看官网公告；周日礼拜时段请勿随意走动拍照，避免短裤、背心。","q":"St. Mary's Cathedral Kuala Lumpur","src":"https://stmaryscathedral.org.my/opening-hours","warn":"","rate":1,"photo":"Kuala Lumpur Malaysia St-Marys-Cathedral-01.jpg","been":false,"go":""},{"id":"cu-buddhist-maha-vihara","zh":"十五碑佛寺（大精舍）","en":"Buddhist Maha Vihara, Brickfields","cat":"宗教建筑","area":"小印度 Brickfields","addr":"123 Jalan Berhala, Brickfields, 50470 Kuala Lumpur","transit":"Monorail Tun Sambanthan 步行约 5 分钟；KL Sentral 步行约 8 分钟","hours":"大门每日 7:00–22:00","price":"免费","dur":"20–30 分钟","desc":"1894 年由僧伽罗人社群创建的上座部佛寺，是马来西亚最古老的佛寺之一，也是每年卫塞节花车游行的起点。院内有菩提树、佛塔和白色主殿，环境清静。","tips":"进殿脱鞋，衣着端庄；卫塞节（约 5 月）期间极其热闹，平日则很安静适合歇脚。","q":"Buddhist Maha Vihara Brickfields","src":"https://buddhistmahavihara.org/?p=4078","warn":"","rate":1,"photo":"Mahavihara brickfields.jpg","been":false,"go":""},{"id":"cu-royal-museum","zh":"皇家博物馆（旧国家皇宫）","en":"Muzium Diraja (Royal Museum, former Istana Negara)","cat":"博物馆","area":"Jalan Istana / 敦善班丹附近","addr":"Jalan Istana, 50460 Kuala Lumpur","transit":"无近站，建议 Grab；KL Sentral 约 2 公里","hours":"【维修闭馆中】2026 年 1 月 1 日起闭馆保养，预计 2027 年 2 月 1 日重开；开放时为每日 9:00–17:00","price":"外国成人 RM10（重开后以官网为准）","dur":"1 小时","desc":"1928 年建成的华人富商宅邸，1957–2011 年作为马来西亚最高元首的国家皇宫，2013 年改为博物馆。可参观王座厅、宴会厅、元首与王后的起居空间，了解马来皇室礼仪。","tips":"目前闭馆维修，2027 年 2 月前请勿前往；门口仍可远看建筑外观。","q":"Muzium Diraja Jalan Istana Kuala Lumpur","src":"https://says.com/my/seismik/muzium-diraja-bakal-dibuka-semula-kepada-orang-awam-pada-februari-2027","warn":"维修闭馆中，预计 2027-02 重开","rate":1,"photo":"Pintu masuk Muzium Diraja KL.jpg","been":false,"go":""},{"id":"cu-galeri-petronas","zh":"国油美术馆","en":"Galeri PETRONAS","cat":"博物馆","area":"KLCC","addr":"Ground Floor, Plaza Ombak KLCC, 20 Persiaran KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur","transit":"LRT KLCC 或 MRT Persiaran KLCC 步行约 10 分钟（以官网为准）","hours":"周二至周五 10:00–18:00，周末 10:00–18:30，周一休（试营运期间）（以官网为准）","price":"常设预览展一般免费，部分展览/活动收费（以官网为准）","dur":"30–45 分钟","desc":"国油旗下的艺术馆，原位于 Suria KLCC 三楼，2026 年 7 月底迁往新落成的 Ombak KLCC，以“The First Glimpse”预览展分阶段开放，预计 2027 年底全面开放。展出马来西亚现当代艺术与国油收藏。","tips":"目前只开放底层预览空间，规模较小，适合逛 KLCC 时顺路；注意别去 Suria KLCC 旧址。","q":"Galeri PETRONAS Ombak KLCC","src":"https://kualalumpurcity.my/?p=9662","warn":"搬到 Ombak KLCC，目前是预展，完整开放要到 2027 年底","rate":1,"photo":"Future Galeri Petronas in Ombak KLCC.jpg","been":false,"go":""},{"id":"cu-muzium-muzik","zh":"音乐博物馆","en":"Muzium Muzik (Music Museum)","cat":"博物馆","area":"老城 / 独立广场 Dataran Merdeka","addr":"Jalan Raja（原渣打银行大楼，独立广场旁），50050 Kuala Lumpur","transit":"LRT Masjid Jamek 步行约 5 分钟","hours":"每日 9:00–17:00（16:30 停止售票）；开斋节前两天、哈芝节首日休馆","price":"免费","dur":"30–45 分钟","desc":"设在独立广场旁 1891 年的旧渣打银行大楼里，小而精，展出马来西亚各族传统乐器，如甘美兰、马来鼓、沙捞越沙贝琴等。","tips":"规模小，适合逛独立广场时顺路进来吹冷气。","q":"Muzium Muzik Kuala Lumpur","src":"https://www.jmm.gov.my/en/node/4088","warn":"","rate":1,"photo":"Gamelan Melayu Muzium Muzik.jpg","been":false,"go":""},{"id":"cu-petrosains","zh":"石油科技馆","en":"Petrosains, The Discovery Centre","cat":"室内","area":"KLCC","addr":"Level 4, Suria KLCC, Kuala Lumpur City Centre, 50088 Kuala Lumpur","transit":"LRT KLCC 站步行约 5 分钟（经 Suria KLCC 商场）","hours":"周二至周日 9:30–17:30（周末、公众假期 9:30–19:30）；每月第 1、3 个周一休馆；最后入场为闭馆前 1.5 小时（以官网为准）","price":"外国成人约 RM49（平日）/ RM56（周末）（以官网为准）","dur":"2–3 小时","desc":"由国油 Petronas 打造的互动科学馆，以石油天然气为主题，有模拟海上钻油平台、直升机模拟、恐龙展区等大量动手装置，另有付费的“Energy Capsule”体验。偏亲子向，但做工扎实。","tips":"平日上午学校团多，下午相对清净；与双子塔、阳光广场、水族馆可安排一天，下雨天的好去处。","q":"Petrosains The Discovery Centre Suria KLCC","src":"https://nashaplaneta.net/vopros-otvet/7124-skolko-stoit-bilet-v-petrosains-dlya-inostrancev-v-2026-godu_en","warn":"","rate":1,"photo":"F1 car at Petrosains museum (6349809786).jpg","been":false,"go":""},{"id":"cu-planetarium-negara","zh":"国家天文馆","en":"Planetarium Negara (National Planetarium)","cat":"室内","area":"湖滨公园 Perdana","addr":"53 Jalan Perdana, Tasik Perdana, 50480 Kuala Lumpur","transit":"KTM 吉隆坡旧火车站 Kuala Lumpur 步行约 15 分钟（上坡，经伊斯兰艺术博物馆）；或 Grab","hours":"周二至周日 9:30–16:30；周一及部分公众假期休（以官网为准）","price":"展厅免费；球幕电影成人约 RM12（以官网为准）","dur":"1–1.5 小时","desc":"蓝色伊斯兰风格圆顶建筑，内有航天与天文互动展厅、火箭和太空舱模型，以及球幕天象厅放映太空电影。户外有仿各国古天文台的观测台建筑模型。","tips":"周五中午礼拜时段暂停放映；离伊斯兰艺术博物馆很近，可串在湖滨公园半日游里。","q":"Planetarium Negara Kuala Lumpur","src":"https://www.malaysia-traveller.com/national-planetarium.html","warn":"","rate":1,"photo":"Planetarium Negara (exterior), Kuala Lumpur 20241026 111406.jpg","been":false,"go":""},{"id":"cu-museum-of-illusions","zh":"错觉博物馆","en":"Museum of Illusions Kuala Lumpur","cat":"室内","area":"武吉免登 Bukit Bintang","addr":"1st & 2nd Floor, Ansa Hotel, 101 Jalan Bukit Bintang, 55100 Kuala Lumpur","transit":"MRT/Monorail Bukit Bintang 步行约 3 分钟","hours":"每日约 10:00–22:00（以官网为准）","price":"外国成人约 RM45–56（以官网为准）","dur":"1 小时","desc":"亚洲首家 Museum of Illusions 连锁馆，展出艾姆斯小屋、旋转隧道、无限镜屋、颠倒房间等数十个视错觉装置与益智玩具，专门为拍照打卡设计。","tips":"一个人去也能玩，工作人员会帮忙找拍照角度；规模不大，适合逛 Pavilion 时顺路或雨天备选。","q":"Museum of Illusions Kuala Lumpur Ansa Hotel","src":"https://www.pelago.com/en-MY/activity/ple2p-museum-of-illusions-admission-tickets-kuala-lumpur/","warn":"","rate":1,"photo":"Museum of Illusions Kuala Lumpur.jpg","been":false,"go":""},{"id":"na-orchid-hibiscus","zh":"胡姬花园与大红花园","en":"Orchid Garden & Hibiscus Garden (Taman Orkid & Taman Bunga Raya)","cat":"公园自然","area":"湖滨公园 Tasik Perdana","addr":"Jalan Cenderawasih, Tasik Perdana, 50480 Kuala Lumpur（飞禽公园对面）","transit":"MRT 加影线 Muzium Negara 站步行约 20 分钟；或 KL Sentral 打 Grab 约 5–10 分钟","hours":"约 9:00–18:00（以现场为准）","price":"平日免费；周末/公共假期有资料称收 RM1（以现场为准）","dur":"30–60 分钟","desc":"飞禽公园对面相邻的两座花园：胡姬花园种植上百种兰花，大红花园展示马来西亚国花大红花（扶桑）的各种品种。园子不大、免费或几乎免费，逛完飞禽公园顺路看看即可。","tips":"和飞禽公园同一天去最省事；中午很晒，带伞或帽子。","q":"Orchid Garden Perdana Botanical Garden Kuala Lumpur","src":"https://en.wikivoyage.org/wiki/Kuala_Lumpur/Botanical_Garden","warn":"","rate":1,"photo":"Hibiscus and Orchid Garden nearby the Bird Park in Kuala Lumpur, Malaysia (25).jpg","been":false,"go":""},{"id":"na-permaisuri","zh":"皇后湖公园","en":"Taman Tasik Permaisuri","cat":"公园自然","area":"蕉赖 Cheras / Bandar Tun Razak","addr":"Jalan Tasik Permaisuri 2, Bandar Tun Razak, 56000 Kuala Lumpur（以地图为准）","transit":"LRT Sri Petaling 线（与 Awan Besar 同线）Bandar Tun Razak 站，步行约 15 分钟或 Grab 约 5 分钟","hours":"每天 5:30–22:00","price":"免费","dur":"1–1.5 小时","desc":"蕉赖区的大型湖滨公园，湖边有环湖步道、花园和健身设施，本地人气很高。游客较少，适合想体验当地人日常生活的散步。","tips":"和住处在同一条 LRT 线上，方便；中午很晒，早晚去。","q":"Taman Tasik Permaisuri","src":"https://www.thestar.com.my/metro/metro-news/2026/05/09/10-kl-parks-now-open-from-530am-10pm","warn":"","rate":1,"photo":"Taman Tasik Permaisuri (220419) 03.jpg","been":false,"go":""},{"id":"na-kanching-templer","zh":"甘清瀑布 / 坦普勒公园","en":"Kanching Waterfall (Taman Eko Rimba Kanching) & Templer's Park (Taman Rimba Templer)","cat":"公园自然","area":"万挠 Rawang, Selangor","addr":"Taman Eko Rimba Kanching, Jalan Ipoh, 48000 Rawang, Selangor","transit":"KTM 到 Kuang 或 Rawang 站，再 Grab 约 10–15 分钟；从市区 Grab 约 40 分钟","hours":"平时约 7:00–17:30；2026-11-16 至 2027-01-31 关闭","price":"平时外国人约 RM8（以现场为准）","dur":"半天","desc":"吉隆坡北面的两处森林生态公园：甘清瀑布有七层瀑布，沿台阶往上可逐层戏水；附近的坦普勒公园是英殖民时期设立的森林保护区，也有瀑布和步道。【目前关闭】雪兰莪州 11 月 11 日起关闭永久森林保护区内所有瀑布休闲区（无限期），并于 2026-11-16 至 2027-01-31 季风期关闭所有生态公园与徒步活动。","tips":"季风期内请勿前往；重开后也要避开雨后山洪，周末人多，带防滑鞋和换洗衣物。","q":"Taman Eko Rimba Kanching","src":"https://says.com/my/lifestyle/all-selangor-forest-eco-parks-hiking-activities-to-close-temporarily-from-16-november","warn":"雨季关闭 11/16 – 2027-01-31","rate":1,"photo":"Kanching Waterfall.jpg","been":false,"go":""},{"id":"na-desa-parkcity","zh":"德萨公园城中央公园","en":"The Central Park, Desa ParkCity","cat":"公园自然","area":"德萨公园城 Desa ParkCity","addr":"The Central Park, Desa ParkCity, 52200 Kuala Lumpur","transit":"MRT 加影线 Kepong Baru 站或 KTM Kepong 站打 Grab 约 10 分钟","hours":"全天开放（以现场为准）","price":"免费（停车收费）","dur":"1–2 小时","desc":"高档住宅区中央的人工湖公园，环湖步道、草坪和宠物公园，湖边一圈咖啡馆和餐厅，是吉隆坡最适合遛狗和周末早午餐的地方。氛围悠闲、干净，适合散步吃早午餐。","tips":"周末傍晚停车位紧张，打 Grab 更方便；可在湖边 The Waterfront 吃早午餐。","q":"The Central Park Desa ParkCity","src":"https://wanderlog.com/place/details/769284","warn":"","rate":1,"photo":"Central Park, Desa Parkcity (221113) 3.jpg","been":false,"go":""},{"id":"na-deer-park","zh":"鹿园","en":"Deer Park (Taman Rusa), Perdana Botanical Garden","cat":"动物","area":"湖滨公园 Tasik Perdana","addr":"Perdana Botanical Garden, Jalan Kebun Bunga, Tasik Perdana, 55100 Kuala Lumpur","transit":"MRT 加影线 Muzium Negara 站步行约 20 分钟；或在植物园内步行前往","hours":"约 9:00–18:00（以现场为准）","price":"免费","dur":"20–30 分钟","desc":"植物园内的小型鹿园，可以看到几种鹿和小巧的鼷鹿（kancil）。2015 年市政局曾计划关闭，但近年（2025 年）报道仍提到园内有鹿园，开放情况以现场为准。","tips":"规模很小，只适合顺路看看；不要随意喂食。","q":"Deer Park Perdana Botanical Garden","src":"https://www.freemalaysiatoday.com/category/leisure/2025/01/13/perdana-botanical-garden-kls-oldest-public-park","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"na-bukit-tabur","zh":"武吉塔布尔（龙脊山）","en":"Bukit Tabur (Dragon's Back / Klang Gates Quartz Ridge)","cat":"徒步","area":"淡江 Taman Melawati / Gombak","addr":"Klang Gates Quartz Ridge, Taman Melawati, 53100 Selangor","transit":"LRT Gombak 线 Gombak 站或 MRT 2 号线附近打 Grab 约 15 分钟（目前禁止登山）","hours":"目前禁止公众登山（2016 年起关闭）","price":"暂不开放","dur":"—","desc":"世界最长的石英岩山脊之一，山脊形似龙背，可俯瞰 Klang Gates 水库和吉隆坡天际线，曾是最热门的徒步路线。因多起致命事故，2016 年起禁止公众登山；2026 年 11 月报道称第一阶段（入口至 CP6 约 2 公里）安全设施已完成，最快 2027 年分阶段重开。","tips":"现在擅自上山属违法（最高可罚 RM30,000）且很危险，请勿前往；想看风景可去 Bukit Kiara 或 Bukit Gasing 替代。","q":"Bukit Tabur","src":"https://www.thestar.com.my/metro/metro-news/2026/11/14/bukit-tabur-to-welcome-hikers-again-in-2027","warn":"2016 年起禁止登山，最快 2027 年重开","rate":1,"photo":"View from Bukit Tabur summit.jpg","been":false,"go":""},{"id":"na-bukit-kiara","zh":"武吉基拉森林公园","en":"Bukit Kiara (Taman Rimba Kiara)","cat":"徒步","area":"敦依斯迈花园 TTDI","addr":"Taman Rimba Kiara, Jalan Burhanuddin Helmi, Taman Tun Dr Ismail, 60000 Kuala Lumpur","transit":"MRT 加影线 TTDI 站打 Grab 约 5–10 分钟到 Taman Rimba Kiara 入口","hours":"全年开放；入口门卫约 6:45–19:00（以现场为准）","price":"免费","dur":"2–3 小时","desc":"市区内的次生林小山，有铺装上坡路和多条林间土路，往返约 4–5 公里，也是著名的山地自行车场地。山脚的 Taman Rimba Kiara 有小湖和草地，周边有不少咖啡馆。","tips":"早上 8 点前出发，17 点后不要再上山（上段没有路灯）；属吉隆坡联邦直辖区，不受雪兰莪森林封闭影响，但雨后湿滑。","q":"Taman Rimba Kiara","src":"https://rollinggrace.com/2026/03/09/bukit-kiara-trail-hiking-guide/","warn":"","rate":1,"photo":"Bukit Kiara Park 3.jpg","been":false,"go":""},{"id":"na-bukit-gasing","zh":"武吉加辛森林公园","en":"Bukit Gasing Forest Park","cat":"徒步","area":"八打灵再也 Petaling Jaya / 班底谷边界","addr":"Jalan 5/57B, Bukit Gasing, 46000 Petaling Jaya, Selangor（以地图为准）","transit":"LRT Kelana Jaya 线 Asia Jaya 或 Taman Jaya 站打 Grab 约 10 分钟","hours":"白天开放（以现场为准）","price":"免费","dur":"1.5–2 小时","desc":"夹在八打灵再也和吉隆坡之间的城市森林，环线约 4–6 公里，沿途有吊桥、小溪和一座印度教小庙，山顶能看到吉隆坡天际线。路线短而有起伏，适合半天轻徒步。","tips":"雪兰莪州 2026-11-16 至 2027-01-31 关闭州内永久森林保护区和生态公园，此处是否受影响未能确认，出发前查 MBPJ 公告（以官网为准）；入口附近是住宅区，勿乱停车。","q":"Bukit Gasing Forest Park","src":"https://en.wikipedia.org/wiki/Bukit_Gasing","warn":"雪兰莪森林保护区 11/16 起雨季关闭，这里是否包括没查到，去前确认","rate":1,"photo":"Bukit Gasing, Petaling Jaya, Selangor, Malaysia - panoramio.jpg","been":false,"go":""},{"id":"na-chiling","zh":"芝灵瀑布","en":"Sungai Chiling Waterfall (Chiling Waterfalls)","cat":"徒步","area":"瓜拉古布巴鲁 Kuala Kubu Bharu, Selangor","addr":"Sungai Chiling, Jalan Kuala Kubu Bharu–Fraser's Hill, 44000 Kuala Kubu Bharu, Selangor","transit":"KTM 到 Kuala Kubu Bharu 站，再 Grab/包车约 15 分钟；从市区开车约 1–1.5 小时","hours":"目前关闭（季风期 2026-11-16 至 2027-01-31；瀑布区 11 月 11 日起无限期关闭）","price":"平时需在 SeForest 网上申请许可证，约 RM5/人","dur":"半天","desc":"雪兰莪最壮观的瀑布之一，需要涉水过河数次、沿雨林步行约 1 小时才到达，同时是苏丹鱼（mahseer）保护区。【目前关闭】2025 年曾封闭升级，2026 年 11 月 9 日附近 Sungai Pertak 发生山洪冲走 8 人后，雪兰莪州关闭了森林保护区内所有瀑布区，并实施季风期封山。","tips":"关闭期间切勿前往；重开后须提前网上申请许可证，雨天河水暴涨非常危险。","q":"Sungai Chiling Waterfall","src":"https://www.nst.com.my/amp/news/regional/2026/11/1575720/selangor-shuts-waterfall-areas-over-safety-concerns","warn":"瀑布区关闭（11/11 起，雨季到 2027-01-31）","rate":1,"photo":"Sg Chiling Waterfall.jpg","been":false,"go":""},{"id":"na-i-city","zh":"莎阿南 i-City 数码灯光城","en":"i-City Shah Alam (City of Digital Lights)","cat":"乐园","area":"莎阿南 Shah Alam, Selangor","addr":"i-City, Persiaran Multimedia, Seksyen 7, 40000 Shah Alam, Selangor","transit":"Grab 最方便（从 Bukit Jalil 约 35–50 分钟）；公共交通需转车，不推荐","hours":"灯光区约 18:00–22:30（周六较晚）；游乐设施时间各异（以官网为准）","price":"灯光区免费入场；游乐设施另收费（全日通票旧价约 RM175，以官网为准）","dur":"2–3 小时（晚上）","desc":"以 LED 灯光树和灯饰装置出名的夜间景点，入夜后整片园区亮起，适合拍照。园内还有室内雪屋、水上乐园、卡丁车、摩天轮等收费项目，2026 年还新开了 AI 体验中心。","tips":"天黑后（19 点以后）才好看；回程 Grab 可能要等，提前叫车。","q":"i-City Shah Alam","src":"https://www.visitselangor.com/i-city-shah-alam/","warn":"","rate":1,"photo":"Shah Alam - i-City 0005.jpg","been":false,"go":""},{"id":"na-kuala-gandah","zh":"瓜拉甘达大象保护中心","en":"Kuala Gandah National Elephant Conservation Centre (NECC)","cat":"周边一日","area":"彭亨州 林明 Lanchang, Pahang","addr":"National Elephant Conservation Centre, Kuala Gandah, 28500 Lanchang, Pahang","transit":"没有方便的公共交通，建议参加一日游团或包车；从吉隆坡开车约 2 小时（超出 1.5 小时范围）","hours":"每天 8:00–13:00、14:30–16:30（周五 8:00–12:30、14:30–16:30），16:30 停止登记","price":"官网未列门票；自然导览 RM50/团（最多 12 人），与小象洗澡 RM10/成人（需导览）","dur":"全天（含车程）","desc":"马来西亚野生动物局的亚洲象保护和救援中心，安置从冲突地区迁移来的野象。游客可以观看大象、听保育讲解、喂食，名额有限时还可与小象洗澡；园方明确禁止骑大象。2025 年有媒体报道动物福利方面的质疑，可自行斟酌。","tips":"与小象洗澡每天限 100 人且视天气，需早到登记；周五中午休息时间较长。","q":"Kuala Gandah Elephant Conservation Centre","src":"https://www.nres.gov.my/en-my/KetsaEcoPark/Pages/NationalElephantConservationCentre.aspx","warn":"","rate":1,"photo":"US Navy 080820-N-4009P-282 Sailors assigned to the Nimitz-class aircraft carrier USS Ronald Reagan (CVN 76) and other tourists help bathe two Asian elephants.jpg","been":false,"go":""},{"id":"na-sekinchan","zh":"适耕庄稻田","en":"Sekinchan Paddy Fields","cat":"周边一日","area":"适耕庄 Sekinchan, Sabak Bernam, Selangor","addr":"Sekinchan, 45400 Selangor","transit":"Pudu Sentral 搭 SPT 长途巴士约 3 小时到 Sekinchan，再 Grab；或 Grab/包车约 1.5–2 小时；常与瓜拉雪兰莪萤火虫合成一日游","hours":"全天（稻田无门票）","price":"免费","dur":"全天（含车程）","desc":"雪兰莪著名的华人渔村和稻米产区，一望无际的稻田配上笔直的田间小路，是拍照圣地。附近还有许愿树、渔港和海鲜餐厅，可以吃到新鲜的海鲜。","tips":"稻田最美在 3–5 月和 9–11 月（青绿或金黄期），11 月下旬可能已收割；没有专门的游客入口，在路边观赏勿踩田。","q":"Sekinchan Paddy Field","src":"https://my.trip.com/guide/info/sekinchan-day-trip.html","warn":"11 月下旬可能已经收割，稻田不一定是绿的","rate":1,"photo":"Sekinchan Paddy Fields.jpg","been":false,"go":""},{"id":"na-frasers-hill","zh":"福隆港","en":"Fraser's Hill (Bukit Fraser)","cat":"周边一日","area":"彭亨州 Bukit Fraser, Pahang","addr":"Bukit Fraser, 49000 Fraser's Hill, Pahang","transit":"KTM 到 Kuala Kubu Bharu 站，再包车/Grab 约 1 小时上山；KKB 往山上的巴士班次不确定（以现场为准）","hours":"全天","price":"免费","dur":"全天（含车程）","desc":"英殖民时期的山中避暑地，海拔约 1,500 米，气温凉爽，保留了英式石头小屋、钟楼和高尔夫球场。是著名的观鸟胜地，林间步道清幽，比云顶安静得多。","tips":"山路弯多、新路常因塌方封闭，出发前查路况；山上没有加油站，晚上冷，带外套。","q":"Fraser's Hill","src":"https://malaysia-asia.my/?p=1521","warn":"","rate":1,"photo":"Frasers Hill 1.jpg","been":false,"go":""}];
var CATS=["地标","街区","美食夜市","商场","宗教建筑","博物馆","室内","公园自然","动物","徒步","乐园","周边一日"];
var EM={"地标":"🏙","街区":"🏮","美食夜市":"🍢","商场":"🛍","宗教建筑":"🕌","博物馆":"🏛","室内":"🎡","公园自然":"🌳","动物":"🦜","徒步":"🥾","乐园":"🎢","周边一日":"🚌"};
var FILES={"genting":"genting-1day.html","ks":"kselangor-1day.html","mel1":"malacca-1day.html","last6":"last6-trip.html"},CFG={"map":"google"};
function mapUrl(q){return CFG.map==="amap"?"https://uri.amap.com/search?keyword="+encodeURIComponent(q)+"&amp;city="+encodeURIComponent(CFG.city||"")+"&amp;callnative=1":"https://www.google.com/maps/search/?api=1&amp;query="+encodeURIComponent(q);}
var BY={};DATA.forEach(function(x){BY[x.id]=x;});
function st(x){return TRIPST.get(x.id)||{been:!!x.been,want:false};}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function img(f){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width=640";}
function page(f){return "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));}
var F={cat:"",st:"",q:"",so:"rate"},mine=false; // mine：自己点的改动只更新那一张卡片，别处（后台、别的页面）来的才整页重画
function card(x){
  var s=st(x),ph=x.photo?'<img loading="lazy" src="'+esc(img(x.photo))+'" alt="'+esc(x.zh)+'" onerror="this.outerHTML=\'<div class=no>'+(EM[x.cat]||"📍")+'</div>\'">':'<div class="no">'+(EM[x.cat]||"📍")+'</div>';
  var row=function(i,v){return v?'<dt>'+i+'</dt><dd>'+esc(v)+'</dd>':"";};
  return '<article class="card'+(s.been?" been":"")+(s.want?" want":"")+'" id="c-'+esc(x.id)+'" data-id="'+esc(x.id)+'">'+
    (x.photo?'<a class="ph" href="'+esc(page(x.photo))+'" target="_blank" rel="noopener">':'<div class="ph">')+ph+
    '<span class="rate">'+"★★★".slice(0,x.rate)+'</span><span class="ct">'+(EM[x.cat]||"")+' '+esc(x.cat)+'</span><span class="mk b">✅ 去过</span><span class="mk w">⭐ 想去</span>'+(x.photo?'</a>':'</div>')+
    '<div class="cb"><div class="nm"><b>'+esc(x.zh)+'</b><small>'+esc(x.en)+'</small></div><div class="area">📍 '+esc(x.area)+'</div>'+(x.warn?'<p class="warn">⚠️ '+esc(x.warn)+'</p>':"")+
    '<dl class="info">'+row("🚇",x.transit)+row("🕘",x.hours)+row("💵",x.price)+row("⏱",x.dur)+row("🏠",x.addr)+'</dl>'+
    (x.desc?'<p class="desc">'+esc(x.desc)+'</p>':"")+(x.tips?'<p class="tips">💡 '+esc(x.tips)+'</p>':"")+
    '<div class="acts"><button class="bt b" data-k="been">'+(s.been?"✅ 已去过":"☐ 去过")+'</button><button class="bt w" data-k="want">'+(s.want?"⭐ 想去":"☆ 想去")+'</button>'+
    (x.q?'<a class="lk" href="'+mapUrl(x.q)+'" target="_blank" rel="noopener">📍 '+(CFG.map==="amap"?"高德地图":"地图")+'</a>':"")+
    (x.go&&FILES[x.go]?'<a class="lk" href="'+FILES[x.go]+'" data-go="'+esc(x.go)+'">🧭 照着走 ›</a>':"")+
    (x.src?'<a class="lk s" href="'+esc(x.src)+'" target="_blank" rel="noopener">来源</a>':"")+'</div></div></article>';
}
function match(x){
  var s=st(x);
  if(F.cat&&x.cat!==F.cat)return false;
  if(F.st==="been"&&!s.been)return false;if(F.st==="want"&&!s.want)return false;if(F.st==="left"&&s.been)return false;
  if(F.q){var h=(x.zh+" "+x.en+" "+x.area+" "+x.transit+" "+x.cat+" "+x.addr+" "+x.desc).toLowerCase();if(h.indexOf(F.q.toLowerCase())<0)return false;}
  return true;
}
function order(a,b){
  if(F.so==="area")return (a.area||"").localeCompare(b.area||"","zh")||b.rate-a.rate;
  if(F.so==="cat")return CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||b.rate-a.rate;
  return b.rate-a.rate||CATS.indexOf(a.cat)-CATS.indexOf(b.cat);
}
function stats(){
  var b=0,w=0;DATA.forEach(function(x){var s=st(x);if(s.been)b++;else if(s.want)w++;});
  document.getElementById("n-been").textContent=b;document.getElementById("n-want").textContent=w;document.getElementById("n-left").textContent=DATA.length-b;
  document.getElementById("bar").style.width=(DATA.length?Math.round(b*100/DATA.length):0)+"%";
  var cnt={};DATA.forEach(function(x){cnt[x.cat]=(cnt[x.cat]||0)+1;});
  document.getElementById("cats").innerHTML='<span class="lbl">类型</span><button class="chip'+(F.cat?"":" on")+'" data-cat="">全部<small>'+DATA.length+'</small></button>'+CATS.filter(function(c){return cnt[c];}).map(function(c){return '<button class="chip'+(F.cat===c?" on":"")+'" data-cat="'+c+'">'+EM[c]+" "+c+'<small>'+cnt[c]+'</small></button>';}).join("");
  var SS=[["","全部"],["left","还没去 "+(DATA.length-b)],["want","⭐ 想去 "+w],["been","✅ 去过 "+b]];
  document.getElementById("st").innerHTML='<span class="lbl">状态</span>'+SS.map(function(z){return '<button class="chip'+(F.st===z[0]?" on":"")+'" data-st="'+z[0]+'">'+z[1]+'</button>';}).join("");
}
function render(){
  var L=DATA.filter(match).sort(order);
  document.getElementById("grid").innerHTML=L.map(card).join("");
  document.getElementById("empty").style.display=L.length?"none":"";
  stats();
}
function toggle(id,k){
  var x=BY[id];if(!x)return;var v=Object.assign({},st(x));v[k]=!v[k];if(k==="been"&&v.been)v.want=false;
  mine=true;TRIPST.set(id,v);mine=false;
  var el=document.getElementById("c-"+id);if(el&&match(x)){el.outerHTML=card(x);}else render();
  stats();
}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("button,a[data-go]");if(!t)return;
  if(t.dataset.k){var c=t.closest(".card");if(c)toggle(c.dataset.id,t.dataset.k);return;}
  if(t.hasAttribute("data-cat")){F.cat=t.dataset.cat;render();return;}
  if(t.hasAttribute("data-st")){F.st=t.dataset.st;render();return;}
  if(t.dataset.go&&window.parent&&window.parent!==window){e.preventDefault();try{parent.postMessage({tripGo:t.dataset.go},"*");}catch(er){}}
});
var qT=0;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){F.q=e.target.value.trim();render();},150);});
document.getElementById("so").addEventListener("change",function(e){F.so=e.target.value;render();});
var sy=document.getElementById("sync");
render();
TRIPST.on(function(){if(!mine)render();});
if(!TRIPST.cloud){sy.textContent="📱 单独打开：勾的只存在这台设备（在网站「旅游」里打开会同步）";}
else{sy.textContent="☁️ 同步中…";TRIPST.sync().then(function(r){sy.textContent=r==="ok"?"☁️ 已同步（换设备也在）":"⚠️ 现在连不上后台，勾的先存在这台设备，下次打开再同步";});}
})();
</script>
</body></html>
