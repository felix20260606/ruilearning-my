:"cq-shibati","zh":"十八梯传统风貌区","en":"Shibati Traditional Neighborhood","cat":"街区","area":"渝中 · 较场口","addr":"重庆市渝中区较场口十八梯（连接较场口与解放东路）","transit":"轨道 1/2 号线较场口站 4 号口，走约 3 分钟","hours":"街区全天开放；商铺约 10:00–22:00（以官方为准）","price":"免费","dur":"1–2 小时","desc":"十八梯是连接重庆“上半城”与“下半城”的老梯道，重建后保留了老街肌理与 40 多处传统风貌建筑，石阶两侧是吊脚楼、茶馆、小吃和展馆。可看到老重庆的坡坎生活，也有夜间灯光和演艺。","tips":"从较场口上方往下走更省力，走完台阶到下半城可接白象街、湖广会馆；石阶多且陡，穿防滑鞋。","q":"十八梯传统风貌区","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/5717709.html","warn":"","rate":3,"photo":"Shibati 十八梯 2022.1.1.jpg","been":false,"go":"cq"},{"id":"cq-sanxia-museum","zh":"重庆中国三峡博物馆","en":"Chongqing China Three Gorges Museum","cat":"博物馆","area":"渝中 · 上清寺","addr":"重庆市渝中区人民路 236 号","transit":"轨道 2 号线曾家岩站，走约 8 分钟","hours":"周二至周日 09:00–17:00（16:30 停止入馆，以官方为准）；周一闭馆（法定节假日除外）","price":"免费，需提前在“重庆中国三峡博物馆”公众号预约","dur":"2–3 小时","desc":"国家一级博物馆，与人民大礼堂隔人民广场相对。常设展“壮丽三峡”“远古巴渝”“城市之路”“抗战岁月”等，讲清了三峡、巴渝文化和重庆城市历史，还有乌杨汉阙、大型环幕电影等看点。","tips":"节假日名额常约满，至少提前 1–3 天预约；可与人民大礼堂、曾家岩 50 号串成半日游。","q":"重庆中国三峡博物馆","src":"https://www.dahepiao.com/lvyounews1/20240814482072.html","warn":"周一闭馆：11/30 重庆中转那天（周一）去不了","rate":3,"photo":"Chongqing Three Gorges Museum China.JPG","been":false,"go":""},{"id":"cq-shanchengxiang","zh":"山城巷（山城步道）","en":"Shancheng Alley (Mountain City Trail)","cat":"徒步","area":"渝中 · 南纪门","addr":"重庆市渝中区中兴路（南纪门）至领事巷一带","transit":"轨道 1/2 号线较场口站，走约 15 分钟（以导航为准）","hours":"全天开放","price":"免费","dur":"1–1.5 小时","desc":"山城巷是渝中区第三步道的精华段，栈道沿着长江一侧的崖壁修建，一路有老石阶、吊脚楼、法国仁爱堂旧址和小咖啡馆。边走边能俯瞰长江与南岸，是最能感受“山城”立体感的步道之一。","tips":"建议从上方领事巷进、沿崖壁往下走；傍晚可看江景与灯光，路面有坡和台阶，穿舒适的鞋。","q":"山城巷","src":"https://chinatripedia.com/shancheng-alley-chongqing-ticket-price-opening-hours-location-and-highlights","warn":"","rate":3,"photo":"Shancheng Alley, Chongqing.jpg","been":false,"go":"cq"},{"id":"cq-dazu","zh":"大足石刻（宝顶山）","en":"Dazu Rock Carvings (Baodingshan)","cat":"周边一日","area":"大足区（主城约1.5–2小时）","addr":"重庆市大足区宝顶镇宝顶山","transit":"重庆西站坐动车/高铁到「大足南」站（约40分钟），再打车约30–40分钟到宝顶山；或在菜园坝、陈家坪汽车站坐大巴到大足城区（约2小时），再转车去宝顶（以官方为准）","hours":"约09:00–18:00，16:30停止检票（以官方为准）","price":"宝顶山：旺季（3/1–11/30）¥115，淡季¥100；宝顶+北山联票：旺季¥140，淡季¥120；需在「大足石刻」官方公众号预约（以官方为准）","dur":"1天（宝顶约3小时，加北山共1天）","desc":"1999年入选世界文化遗产，宝顶山是南宋高僧赵智凤主持开凿的大型佛教摩崖造像群。千手观音、释迦涅槃卧佛、六道轮回图等规模宏大，雕刻精细，色彩保存得很好。","tips":"从12月起是淡季票价；千手观音前常排队，早点到。一个人去也很值得，建议请讲解或租讲解器，故事比单看好得多。","q":"大足石刻宝顶山","src":"https://sina.cn/detail/nimfwqi5215555","warn":"","rate":3,"photo":"Dazu rock carvings - Baodingshan, 大足石刻-宝顶山摩崖造像, Chongqing, 2023 (53563778808).jpg","been":false,"go":""},{"id":"cq-wulong-bridges","zh":"武隆天生三桥","en":"Wulong Three Natural Bridges","cat":"周边一日","area":"武隆区（主城约2–3小时）","addr":"重庆市武隆区仙女山街道天生三桥景区","transit":"重庆东站坐渝厦高铁到「武隆南」站（约40–50分钟），再打车或坐接驳车上仙女山；也可从解放碑坐景区直通车，约3小时，单程约¥70（以官方为准）","hours":"9/1–4/30 08:30–16:30；5月08:30–17:00；6–8月08:00–17:00（以官方为准）","price":"成人¥125（含中转车和出口电梯）（以官方为准）","dur":"3–4小时（含武隆其他景点1–2天）","desc":"世界自然遗产「中国南方喀斯特」的一部分，天龙桥、青龙桥、黑龙桥三座天然石拱桥架在深谷上，谷底有天坑。电影《满城尽带黄金甲》的「天福官驿」就在谷底。","tips":"全程基本下坡走台阶，最后坐电梯出景区，对膝盖不太友好。冬天游客少、雾多，可以和仙女山排同一天；第二天再去地缝或龙水峡。","q":"武隆天生三桥","src":"https://www.dahepiao.com/lvyounews1/20251206539140.html","warn":"","rate":3,"photo":"天生三桥景区 - Three Nature Bridges Scenic Area - 2015.04 - panoramio.jpg","been":false,"go":""},{"id":"cq-chaotianmen","zh":"朝天门广场","en":"Chaotianmen Square","cat":"地标","area":"渝中 · 朝天门","addr":"重庆市渝中区朝东路（重庆来福士东侧）","transit":"轨道 1 号线朝天门站，走约 5 分钟","hours":"全天开放","price":"免费","dur":"30–60 分钟","desc":"位于渝中半岛最东端，是长江与嘉陵江的交汇处，可看到“两江交汇、清浊分明”的景象。古时为重庆十七座城门之首，如今背靠来福士“水晶连廊”，也是两江游船的码头所在。","tips":"白天看两江交汇颜色差最明显；夜游两江游船多在朝天门码头上船，可一并安排。","q":"朝天门广场","src":"https://zh.wikipedia.org/wiki/朝天门","warn":"","rate":2,"photo":"2023-06-23 重慶朝天門 01.jpg","been":false,"go":"cq"},{"id":"cq-liangjiang-cruise","zh":"两江游夜景游船","en":"Two Rivers Night Cruise","cat":"地标","area":"渝中 · 朝天门","addr":"重庆市渝中区朝天门码头（金碧系列在9码头）","transit":"解放碑乘轨道1号线1站（或步行约15分钟）到「小什字」站，步行约10分钟到朝天门码头（以官方为准）","hours":"夜游约19:00–21:00发船，航程约50分钟；遇管制、天气或水位变化可能停航（以官方为准）","price":"金碧系列单船票成人约¥112起，VIP约¥216；平台团购低至约¥55（以官方为准）","dur":"约1小时","desc":"从朝天门出发，绕两江交汇处来回，能从江上看洪崖洞、千厮门大桥、来福士和南滨路的灯光夜景。这是体验山城立体夜景最省力的方式。","tips":"上船前问清楚码头和船型，选能上露天甲板的船；冬天江风很冷，要穿厚外套。洪崖洞码头也有更便宜的短线船。","q":"朝天门两江游","src":"https://www.dahepiao.com/lvyounews1/20250114501921.html","warn":"","rate":2,"photo":"Chaotianmen nightview 20240721.jpg","been":false,"go":""},{"id":"cq-baixiangjie","zh":"白象街","en":"Baixiang Street","cat":"街区","area":"渝中 · 下半城","addr":"重庆市渝中区白象街（望龙门与太平门之间，近解放东路）","transit":"轨道 1/6 号线小什字站，走约 10 分钟","hours":"街区全天开放","price":"免费","dur":"45–60 分钟","desc":"白象街是重庆开埠时期的金融与商贸中心，重庆海关等机构曾设于此，被称为“一条白象街，半部重庆史”。修复后保留了中西合璧的老洋房，可近看长江索道和东水门大桥，人比洪崖洞少很多。","tips":"可与长江索道北站、湖广会馆、东水门大桥串成一条下半城步行线；晚上灯光下拍老建筑很出片。","q":"白象街","src":"https://m.thepaper.cn/baijiahao_13921200","warn":"","rate":2,"photo":"白象街.jpg","been":false,"go":"cq"},{"id":"cq-erchang","zh":"鹅岭二厂文创公园","en":"Eling Erchang Creative Park","cat":"街区","area":"渝中 · 鹅岭","addr":"重庆市渝中区鹅岭正街 1 号","transit":"轨道 1 号线鹅岭站 1 号口，走约 10–15 分钟；或 2 号线佛图关站走约 15 分钟","hours":"园区全天开放，店铺约 10:00–22:00","price":"免费（部分展览另收费）","dur":"1–1.5 小时","desc":"由民国时期中央银行印钞厂旧址（后为重庆印制二厂）改造的文创园，老厂房里是咖啡馆、设计店、小剧场和艺术展。电影《从你的全世界路过》在此取景，天台可俯瞰嘉陵江与李子坝一带。","tips":"和鹅岭公园、李子坝轻轨穿楼相邻，可串成半日游；周末拍照人多，平日下午更清静。","q":"鹅岭二厂文创公园","src":"https://gs.ctrip.com/html5/you/sight/158/2491576.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"cq-longmenhao","zh":"龙门浩老街","en":"Longmenhao Old Street","cat":"街区","area":"南岸 · 南滨路","addr":"重庆市南岸区南滨路龙门浩（上新街、长江索道南站附近）","transit":"轨道 6 号线上新街站，走约 10 分钟（以导航为准）","hours":"街区全天开放；商铺约 10:00–22:00","price":"免费","dur":"1 小时","desc":"重庆开埠时期洋行、领事馆与老码头聚集的老街，修复后保留了美国大使馆旧址、老洋房和传统吊脚楼。站在老街可近距离看对岸渝中半岛天际线，也是南岸咖啡馆和民宿集中地。","tips":"可坐长江索道到南岸后步行过来，再沿南滨路去下浩里；傍晚到可顺便等对岸亮灯。","q":"龙门浩老街","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/1833442.html","warn":"","rate":2,"photo":"","been":false,"go":"cq"},{"id":"cq-xiahaoli","zh":"下浩里","en":"Xiahaoli Old Street","cat":"街区","area":"南岸 · 南滨路","addr":"重庆市南岸区南滨路下浩正街（东水门长江大桥南桥头）","transit":"轨道 6 号线上新街站，走约 10–15 分钟（以导航为准）","hours":"街区全天开放；商铺约 10:00–22:00","price":"免费","dur":"1 小时","desc":"紧挨东水门大桥南桥头的老街区，保留着觉林寺报恩塔、董家桥等旧迹和大量老民居，近年改造后开了咖啡馆、餐吧和文创小店。抬头就是东水门大桥，是拍“老街+大桥”的好地方。","tips":"可从渝中步行东水门大桥过来，正好落在下浩里；与龙门浩老街相连，一起逛约 1.5–2 小时。","q":"下浩里","src":"https://touch.travel.qunar.com/poi/9554788","warn":"","rate":2,"photo":"","been":false,"go":"cq"},{"id":"cq-danzishi","zh":"弹子石老街","en":"Danzishi Old Street","cat":"街区","area":"南岸 · 弹子石","addr":"重庆市南岸区泰昌路 68 号","transit":"轨道环线弹子石站，走约 15 分钟（以导航为准）","hours":"街区全天开放；商铺约 10:00–22:00","price":"免费","dur":"1–1.5 小时","desc":"位于南岸长江边、正对朝天门的仿古街区，吊脚楼依江而建，有法国水师兵营旧址等开埠遗迹。街区平台正对来福士与两江交汇处，是看朝天门夜景和来福士全貌的最佳位置之一。","tips":"傍晚到看日落后亮灯；晚上夜景好但店铺打烊较早，22:00 前逛完。","q":"弹子石老街","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/2046611.html","warn":"","rate":2,"photo":"Danzishi Street.jpg","been":false,"go":""},{"id":"cq-nanbinlu","zh":"南滨路","en":"Nanbin Road Riverside","cat":"街区","area":"南岸 · 南滨路","addr":"重庆市南岸区南滨路（长江南岸滨江路）","transit":"轨道 6 号线上新街站，走约 10 分钟；北段近环线弹子石站","hours":"全天开放","price":"免费","dur":"1–2 小时","desc":"沿长江南岸绵延的滨江大道，串起弹子石、龙门浩、下浩里等老街和众多江景餐厅、火锅店。隔江正对渝中半岛，是欣赏解放碑一带高楼夜景全景的最佳岸线。","tips":"晚上 19:00 后对岸灯光最盛，适合散步或找家江景火锅；沿线较长，可分段打车。","q":"南滨路","src":"https://zh.wikipedia.org/wiki/南滨路","warn":"","rate":2,"photo":"南滨路.jpg","been":false,"go":""},{"id":"cq-ciqikou","zh":"磁器口古镇","en":"Ciqikou Ancient Town","cat":"街区","area":"沙坪坝 · 磁器口","addr":"重庆市沙坪坝区磁器口正街","transit":"轨道 1 号线磁器口站 1 号口，走约 10 分钟","hours":"全天开放；店铺约 09:00–21:00","price":"免费","dur":"2–3 小时","desc":"嘉陵江边的千年古镇，明清时期因运销瓷器得名，素有“一江两溪三山四街”格局。石板主街上有陈麻花、毛血旺、千张等特色小吃，宝轮寺和后街江边码头更清静。","tips":"主街节假日极挤，建议早上 9:00 前到或走后街、支巷；晚上 20:00 后店铺陆续关门。","q":"磁器口古镇","src":"https://m.cq.bendibao.com/jingdian/ciqikouguzhen/","warn":"","rate":2,"photo":"Street scene in Ciqikou, Chongqing.JPG","been":false,"go":""},{"id":"cq-huangjueping","zh":"黄桷坪涂鸦艺术街","en":"Huangjueping Graffiti Street","cat":"街区","area":"九龙坡 · 黄桷坪","addr":"重庆市九龙坡区黄桷坪正街（四川美术学院黄桷坪校区旁）","transit":"轨道 18 号线黄桷坪站或四川美术学院站，走约 10 分钟（以导航为准）","hours":"全天开放","price":"免费","dur":"1–1.5 小时","desc":"四川美术学院师生把整条街的楼房外墙画满色彩鲜艳的涂鸦，长约 1.25 公里，曾被认为是世界最大的涂鸦艺术作品群之一。周边有川美老校区、重庆当代美术馆和 501 艺术基地。","tips":"可与交通茶馆、川美美术馆（周一闭馆，需预约）一起逛；白天光线好拍照更出彩。","q":"黄桷坪涂鸦艺术街","src":"https://gs.ctrip.com/html5/you/sight/158/1834138.html","warn":"","rate":2,"photo":"Grafitti Street, Tuyajie, Jiulongpo, Huangjueping, Chongqing, People's Republic of China.jpg","been":false,"go":""},{"id":"cq-jingangbei","zh":"北碚老街 · 金刚碑古村","en":"Beibei Old Town & Jingangbei Ancient Village","cat":"街区","area":"北碚区 · 北温泉","addr":"重庆市北碚区北温泉街道金刚碑（北泉路旁）","transit":"解放碑乘轨道6号线至「北碚」站，再换乘公交518或520路到「煤疗」站附近，步行下坡进村；全程约1.5小时（以官方为准）","hours":"全天开放（村内商户约白天到晚上）","price":"免费","dur":"2–3小时","desc":"嘉陵江边、缙云山脚下的老村落，黄葛树的老根盘着石墙和老宅，小溪穿村而过。抗战时期很多机构和文化人迁到北碚，城区至今保留着民国风的街巷和建筑。","tips":"村子在江边坡地，台阶多，路滑时小心；周末网红多，工作日更安静。附近有北温泉，冬天可以顺便泡汤。","q":"金刚碑古村","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/5719700.html","warn":"","rate":2,"photo":"金刚碑古村落.jpg","been":false,"go":""},{"id":"cq-bayi","zh":"八一好吃街","en":"Bayi Road Food Street","cat":"美食夜市","area":"渝中 · 解放碑","addr":"重庆市渝中区八一路（解放碑东南侧）","transit":"轨道 1/2 号线较场口站，走约 5 分钟；或 2 号线临江门站走约 8 分钟","hours":"约 10:00–24:00（各店不同，以现场为准）","price":"免费（人均小吃约 ¥30–60）","dur":"1 小时","desc":"解放碑旁最出名的小吃街，汇集酸辣粉、山城小汤圆、钵钵鸡、冰粉、烤脑花等重庆街头小吃，老字号与网红店挤在一起。","tips":"人多店杂，优先选排队本地人多、明码标价的店；晚饭时段最热闹，也最挤。","q":"八一好吃街","src":"https://touch.travel.qunar.com/comment/4969509","warn":"","rate":2,"photo":"","been":false,"go":"cq"},{"id":"cq-jiaochangkou-yeshi","zh":"较场口夜市","en":"Jiaochangkou Night Market","cat":"美食夜市","area":"渝中 · 较场口","addr":"重庆市渝中区较场口（得意世界一带，近十八梯）","transit":"轨道 1/2 号线较场口站，出站即到","hours":"约 17:30 至次日凌晨（以现场为准）","price":"免费（人均约 ¥30–80）","dur":"1 小时","desc":"位于十八梯口上方的露天夜市，傍晚开摊，烧烤、串串、冰粉、小龙虾、炒饭等重庆夜宵一应俱全，烟火气十足。","tips":"可先逛十八梯再来吃夜宵；摊位多为现点现做，怕辣可要“微辣”。","q":"较场口夜市","src":"https://touch.travel.qunar.com/comment/5481465","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"cq-raffles-tansuocang","zh":"重庆来福士 · 探索舱","en":"Raffles City Chongqing – The Exploration Deck","cat":"商场","area":"渝中 · 朝天门","addr":"重庆市渝中区长江滨江路 2 号重庆来福士购物中心（入口在 L1 层 7 号门旁）","transit":"轨道 1 号线朝天门站，走约 3 分钟；1/6 号线小什字站走约 10 分钟","hours":"每日 10:00–22:00（节假日可能调整，以官方为准）","price":"观光成人票约 ¥120；含“云中漫步”套票约 ¥198（以官方为准）","dur":"1–1.5 小时","desc":"来福士是八座塔楼组成的“扬帆”造型综合体，顶部横卧着约 300 米长的空中水晶连廊“探索舱”。在约 250 米高空可 270 度俯瞰两江交汇、朝天门和江北、南岸的城市全景，楼下商场美食店也很多。","tips":"傍晚 17:30 左右上去可同时看日落和夜景；天气阴雾时视野差，购票前先看天气。","q":"来福士探索舱","src":"https://www.dahepiao.com/lvyounews1/20250412509407.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"cq-luohansi","zh":"罗汉寺","en":"Luohan Temple","cat":"宗教建筑","area":"渝中 · 解放碑","addr":"重庆市渝中区罗汉寺街 7 号（民族路旁）","transit":"轨道 1/6 号线小什字站 6 号口，走约 3 分钟","hours":"约 07:30–17:00（以官方为准）","price":"约 ¥20（含香，以官方为准）","dur":"45–60 分钟","desc":"始建于北宋的古寺，藏身在解放碑高楼之间，闹中取静。寺内有五百罗汉堂和古佛岩摩崖石刻长廊，罗汉像形态各异，是重庆主城最著名的佛教寺院之一。","tips":"寺内请按指引拍照、勿对佛像使用闪光，衣着得体；可与解放碑、长江索道一起安排在上午。","q":"罗汉寺","src":"https://you.ctrip.com/asks/78171","warn":"","rate":2,"photo":"Luohan Temple 31600-Chongqing (43682020725).jpg","been":false,"go":"cq"},{"id":"cq-huguang","zh":"湖广会馆","en":"Huguang Guild Hall","cat":"博物馆","area":"渝中 · 东水门","addr":"重庆市渝中区长滨路芭蕉园 1 号","transit":"轨道 1/6 号线小什字站，走约 10–15 分钟","hours":"09:00–18:00（17:00 停止售票入园，以官方为准）","price":"成人约 ¥30–32（以官方为准）","dur":"1–1.5 小时","desc":"清代“湖广填四川”移民修建的会馆建筑群，包括禹王宫、广东公所、齐安公所等，是国内现存规模较大的古会馆群。戏楼、木雕和移民文化展值得细看，紧邻东水门古城门。","tips":"出来后可直接上东水门长江大桥步行过江到南岸下浩里；65 岁以上老人等可免票，带好身份证。","q":"湖广会馆","src":"https://www.dahepiao.com/lvyounews1/20250724522563.html","warn":"","rate":2,"photo":"2023-06-23 重慶湖廣會館 02.jpg","been":false,"go":"cq"},{"id":"cq-hongyancun","zh":"红岩村 · 红岩革命纪念馆","en":"Hongyan Village & Hongyan Revolutionary Memorial","cat":"博物馆","area":"渝中 · 化龙桥","addr":"重庆市渝中区红岩村 52 号","transit":"轨道 9 号线红岩村站 2 号口，走约 10 分钟","hours":"周二至周日 09:00–17:00（16:30 停止入馆）；周一闭馆（以官方为准）","price":"免费，需在“红岩博物馆”公众号预约","dur":"1.5–2 小时","desc":"抗战时期中共中央南方局和八路军驻重庆办事处旧址所在地，现为红岩革命纪念馆。可参观南方局旧址、陈列馆及周恩来等人工作生活的场所，是了解“红岩精神”的核心地点。","tips":"红岩村站埋深很大，从站台到出口需乘多段扶梯，预留时间；节假日提前预约。","q":"红岩革命纪念馆","src":"https://c.m.163.com/news/a/L2TSK5GA0530KB7U.html","warn":"","rate":2,"photo":"八路军驻重庆办事处.jpg","been":false,"go":""},{"id":"cq-zengjiayan50","zh":"曾家岩 50 号（周公馆）","en":"Zengjiayan No. 50 (Zhou Gongguan)","cat":"博物馆","area":"渝中 · 上清寺","addr":"重庆市渝中区中山四路曾家岩 50 号","transit":"轨道 2 号线曾家岩站，走约 5 分钟","hours":"09:00–17:00（16:30 停止入馆），周一闭馆（以官方为准）","price":"免费（可能需预约，以官方为准）","dur":"30–45 分钟","desc":"抗战时期中共中央南方局在城内的办公地，周恩来以私人名义租用，故称“周公馆”。小楼保留当年办公室与居室陈设，所在中山四路两侧梧桐成荫，还有桂园、戴公馆等民国建筑。","tips":"可与三峡博物馆、人民大礼堂步行串联；中山四路秋季梧桐金黄，适合散步拍照。","q":"曾家岩50号周公馆","src":"https://govt.chinadaily.com.cn/s/201812/17/WS5ceb9f71498e079e68021bf6/chongqing-hongyan-revolution-history-museum.html","warn":"","rate":2,"photo":"周公館全景.jpg","been":false,"go":""},{"id":"cq-zhazidong-baigongguan","zh":"渣滓洞 · 白公馆","en":"Zhazidong & Baigongguan Prisons (Gele Mountain)","cat":"博物馆","area":"沙坪坝 · 歌乐山","addr":"重庆市沙坪坝区歌乐山（烈士墓一带，壮志路）","transit":"轨道 1 号线烈士墓站，走约 15 分钟到白公馆；白公馆到渣滓洞约 2.5 公里，可乘景区接驳车或公交（以现场为准）","hours":"09:00–17:00（16:30 停止入内，周一是否开放以官方为准）","price":"免费，需在“红岩博物馆”公众号实名预约","dur":"2–3 小时","desc":"国民党时期关押革命者的两处旧址，小说《红岩》中江姐、小萝卜头等人物的原型就曾被关押于此。现场保留牢房、刑讯室和“11·27”大屠杀遗址，配合歌乐山革命纪念馆讲述那段历史。","tips":"馆内气氛庄重，请勿喧哗嬉闹；两地之间上坡较多，建议上午去。","q":"渣滓洞","src":"https://m.cq.bendibao.com/jingdian/gonglue/197","warn":"","rate":2,"photo":"ChongqingZhazidong.jpg","been":false,"go":""},{"id":"cq-guotai-art","zh":"国泰艺术中心 · 重庆美术馆","en":"Guotai Arts Center & Chongqing Art Museum","cat":"博物馆","area":"渝中 · 解放碑","addr":"重庆市渝中区临江路 1 号国泰艺术中心","transit":"轨道 2 号线临江门站或 1/2 号线较场口站，走约 5 分钟","hours":"美术馆周二至周日 09:00–17:00（16:30 停止入场）；周一闭馆（以官方为准）","price":"美术馆免费；国泰大戏院演出另购票","dur":"1 小时","desc":"国泰艺术中心外观由红黑色交错的“筷子”构件堆叠而成，灵感来自传统斗拱，是解放碑最醒目的现代建筑之一。楼内有重庆美术馆和国泰大戏院，美术馆常年免费举办书画与当代艺术展。","tips":"晚上外立面亮灯好看；就在解放碑步行街旁，可顺路看展避暑避雨。","q":"国泰艺术中心","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/2030428.html","warn":"","rate":2,"photo":"Chongqing Art Museum Night.jpg","been":false,"go":""},{"id":"cq-baiheliang","zh":"白鹤梁水下博物馆","en":"Baiheliang Underwater Museum","cat":"博物馆","area":"涪陵区（动车约40分钟）","addr":"重庆市涪陵区白鹤梁水下博物馆（长江边）（以官方为准）","transit":"重庆北站坐动车到「涪陵北」站，约38分钟，二等座约¥29；再打车约20分钟进城（以官方为准）","hours":"09:00–17:00（16:30停止入馆），周一闭馆（法定节假日除外）（以官方为准）","price":"成人¥50；1.2米以下儿童、65岁以上免票（以官方为准）","dur":"1.5–2小时","desc":"世界首座水下遗址博物馆。白鹤梁石梁上刻着1200多年来的长江枯水题刻和石鱼，三峡蓄水后沉在水下约40米，游客要通过耐压廊道隔着观察窗看原址。","tips":"展品不多但非常独特，可以和涪陵城区（吃涪陵榨菜、乌江鱼）排成一日游；周一别去。","q":"白鹤梁水下博物馆","src":"https://www.dahepiao.com/lvyounews1/20250424510854.html","warn":"","rate":2,"photo":"Baiheliang Underwater Museum.JPG","been":false,"go":""},{"id":"cq-jiaotong-chaguan","zh":"交通茶馆","en":"Jiaotong Teahouse","cat":"室内","area":"九龙坡 · 黄桷坪","addr":"重庆市九龙坡区黄桷坪正街 4 号附 5 号","transit":"轨道 18 号线黄桷坪站，走约 10 分钟（以导航为准）","hours":"约 07:00–19:00（以现场为准）","price":"盖碗茶约 ¥10–15（以现场为准）","dur":"1 小时","desc":"开了几十年的老式茶馆，竹椅、木桌、老墙和满屋本地老茶客，被称为“重庆最后的老茶馆”之一。电影、摄影师常来取景，可点一碗盖碗茶感受老重庆的慢生活。","tips":"上午老茶客最多、氛围最好；拍照前礼貌征得茶客同意。","q":"交通茶馆","src":"https://touch.travel.qunar.com/poi/23479278","warn":"","rate":2,"photo":"Slow Life in A Tea House 01.jpg","been":false,"go":""},{"id":"cq-eling","zh":"鹅岭公园 · 瞰胜楼","en":"Eling Park & Kansheng Tower","cat":"公园自然","area":"渝中 · 鹅岭","addr":"重庆市渝中区鹅岭正街 176 号","transit":"轨道 1 号线鹅岭站 1 号口，走约 5 分钟","hours":"约 08:00–22:30（各渠道说法不一，以官方为准）","price":"公园免费；登瞰胜楼约 ¥5（以官方为准）","dur":"1–1.5 小时","desc":"渝中半岛制高点上的老园林，前身为清末富商的“宜园”，抗战时期多国使馆曾设于此。登上园中瞰胜楼可 360 度看长江与嘉陵江两江夹一城，是看半岛全景的经典点位。","tips":"晴天傍晚登楼看日落与亮灯最佳；园内有坡道台阶，可与二厂文创园一起逛。","q":"鹅岭公园","src":"https://touch.travel.qunar.com/poi/707917","warn":"","rate":2,"photo":"Panorama of Chongqing from tower in Eling park.jpg","been":false,"go":""},{"id":"cq-zoo","zh":"重庆动物园","en":"Chongqing Zoo","cat":"动物","area":"九龙坡 · 杨家坪","addr":"重庆市九龙坡区西郊一村1号","transit":"解放碑步行到轨道2号线临江门站，乘2号线至「动物园」站下车即到，约30–40分钟","hours":"每日开放，约08:00起；闭园时间各渠道说法不一（16:30–18:30），冬季偏早（以官方为准）","price":"成人约¥25（第三方平台¥24.5）；65岁以上、1.2米以下儿童免票（以官方为准）","dur":"2–3小时","desc":"西南地区历史最久的城市动物园之一，以大熊猫和小熊猫最受欢迎，园内有二十多只大熊猫。大熊猫馆下馆2025年底完成改造，室外运动场做了丰容设计，另有华南虎、白虎等。","tips":"熊猫上午9点前后、下午3点左右最活跃，尽量早到；从东二门进园最近熊猫区。冬天熊猫精神，但阴雨天园里路滑。","q":"重庆动物园","src":"https://gs.ctrip.com/html5/you/sight/Chongqing158/10377.html","warn":"","rate":2,"photo":"Giant Panda at Chongqing Zoo image 1.jpg","been":false,"go":""},{"id":"cq-dongshuimen","zh":"东水门长江大桥（步行过江）","en":"Dongshuimen Yangtze River Bridge Walk","cat":"徒步","area":"渝中 · 东水门","addr":"重庆市渝中区长滨路（湖广会馆旁）至南岸区下浩里","transit":"轨道 1/6 号线小什字站，走约 10 分钟到桥头","hours":"人行道全天开放","price":"免费","dur":"30–45 分钟","desc":"与千厮门大桥同为“双子桥”的斜拉桥，上层车行与人行，下层走轨道 6 号线。步行约 20–30 分钟跨过长江，可俯瞰渝中半岛高楼与长江索道，桥南头就是下浩里、龙门浩老街。","tips":"傍晚从渝中往南岸走，回头看半岛亮灯最美；桥上风大，冬天注意保暖。","q":"东水门长江大桥","src":"https://zh.wikipedia.org/wiki/东水门长江大桥","warn":"","rate":2,"photo":"Dongshuimen Yangtze River Bridge 2021-07-27.jpg","been":false,"go":"cq"},{"id":"cq-daijiaxiang","zh":"戴家巷崖壁步道","en":"Daijiaxiang Cliff Walk","cat":"徒步","area":"渝中 · 解放碑","addr":"重庆市渝中区戴家巷（上接戴家巷老街，下抵嘉滨路，近洪崖洞）","transit":"轨道 2 号线临江门站，走约 10 分钟；或 1/6 号线小什字站走约 15 分钟","hours":"全天开放（以官方为准）","price":"免费","dur":"45 分钟","desc":"2021 年开放的悬崖步道，全长约 750 米、高差约 60 米，木栈道贴着嘉陵江边的崖壁蜿蜒而下。沿途可看吊脚楼、老城墙和崖边黄葛树，远眺嘉陵江与千厮门大桥，人比洪崖洞少得多。","tips":"可从洪崖洞步行过来，傍晚走看江景最好；台阶较多，下行更轻松。","q":"戴家巷崖壁步道","src":"https://english.cq.gov.cn/specials/explore/MountainCityTrails/202608/t20260812_15922239.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"cq-jinyunshan","zh":"缙云山","en":"Jinyun Mountain","cat":"徒步","area":"北碚区（主城约1–1.5小时）","addr":"重庆市北碚区缙云山","transit":"解放碑乘轨道6号线（小什字站上车）至「北碚」站约1小时，再换乘公交（如520路）上山门；全程约1.5小时（以官方为准）","hours":"约09:00–16:00（各渠道不一，另有07:00–18:00的说法）（以官方为准）","price":"门票收费（第三方平台约¥20起）；索道上行¥30、下行¥20、往返¥40（以官方为准）","dur":"半天","desc":"川东名山，九座山峰连绵，有缙云寺、狮子峰、香炉峰等，林木茂密、四季多雾。缙云寺内的汉藏教理院是近代佛教史上的重要机构。","tips":"狮子峰可以俯瞰嘉陵江和北碚城区，晴天才值得登顶。冬天山顶常有雾、气温比主城低几度，要多带一件外套；可和北碚老街、金刚碑、北温泉凑成北碚一日游。","q":"缙云山风景区","src":"https://www.dahepiao.com/lvyounews1/20240214446704.html","warn":"","rate":2,"photo":"Jinyun Mountain.JPG","been":false,"go":""},{"id":"cq-xiannvshan","zh":"武隆仙女山","en":"Fairy Mountain (Xiannüshan) National Forest Park","cat":"周边一日","area":"武隆区 · 仙女山镇","addr":"重庆市武隆区仙女山镇仙女山国家森林公园","transit":"和天生三桥一起去：高铁到武隆南站后打车上山，或坐景区直通车；仙女山镇到天生三桥约20分钟车程（以官方为准）","hours":"全天开放（以官方为准）","price":"门票约¥50（2025年攻略价）；小火车、滑雪等项目另收费（以官方为准）","dur":"2–3小时","desc":"海拔约2000米的高山草原和森林，有「东方瑞士」之称，夏天是重庆人避暑的地方，冬天下雪后有雪景和滑雪场。","tips":"11月底山上已经很冷，可能结冰，要带羽绒服；雪季通常从12月开始，具体看当年天气。草原夏天最美，冬季除非来看雪或滑雪，可以只当作去天生三桥的顺路一站。","q":"仙女山国家森林公园","src":"https://m.cq.bendibao.com/tour/156450.shtm","warn":"","rate":2,"photo":"武隆 仙女山全景 01.jpg","been":false,"go":""},{"id":"cq-longshuixia","zh":"武隆龙水峡地缝","en":"Longshuixia Fissure Gorge","cat":"周边一日","area":"武隆区 · 仙女山","addr":"重庆市武隆区仙女山街道龙水峡地缝景区","transit":"和天生三桥在同一片景区，从仙女山镇打车或坐景区车约15–20分钟（以官方为准）","hours":"约08:00–17:00（以官方为准）","price":"约¥115；平台有和天生三桥的联票（以官方为准）","dur":"约2小时","desc":"一条很深的喀斯特地缝峡谷，栈道沿着瀑布和溪流往下走，两边石壁只露一线天，和天生三桥属于同一个世界自然遗产。","tips":"栈道潮湿，要穿防滑鞋；冬天水小，瀑布不如夏天，但人少、凉爽。时间紧的话，武隆优先去天生三桥。","q":"龙水峡地缝","src":"https://gs.ctrip.com/html5/you/sight/wulongdistrict120015/112371.html","warn":"","rate":2,"photo":"龙水峡地缝 - Longshuixia Canyon - 2015.04 - panoramio.jpg","been":false,"go":""},{"id":"cq-laitan","zh":"涞滩古镇","en":"Laitan Ancient Town","cat":"周边一日","area":"合川区（主城约1.5–2小时）","addr":"重庆市合川区涞滩镇","transit":"重庆北站或重庆西站坐动车到「合川」站（约30分钟），再去合川汽车站坐往龙市方向的班车或打车，约40分钟；包车或自驾更方便（以官方为准）","hours":"古镇全天开放；二佛寺约08:30–17:30（以官方为准）","price":"古镇免费；二佛寺约¥30（以官方为准）","dur":"半天","desc":"渠江边鹫峰山上的古寨，清代瓮城保存得很完整，石板老街和寨墙都还在。二佛寺有宋代摩崖造像，大佛依岩而坐。","tips":"可以和钓鱼城排成合川一日游（先钓鱼城再涞滩，或者反过来）。冬天游客不多，老街比较安静。","q":"涞滩古镇","src":"https://gs.ctrip.com/html5/you/sight/158/43807.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"cq-diaoyucheng","zh":"合川钓鱼城","en":"Diaoyu Fortress","cat":"周边一日","area":"合川区（主城约1–1.5小时）","addr":"重庆市合川区钓鱼城大道中段","transit":"重庆北站或重庆西站坐动车到「合川」站（约30分钟），再打车约20–30分钟（以官方为准）","hours":"约08:30–17:00（以官方为准）","price":"约¥70–80（各渠道不一）（以官方为准）","dur":"2–3小时","desc":"南宋军民在这里抵抗蒙古大军长达36年，1259年蒙哥汗在攻城期间死去，所以这里被称为「上帝折鞭处」。山上有护国门、城墙遗址、摩崖造像和卧佛。","tips":"喜欢历史的话很值得，请讲解体验更好；可以和涞滩古镇排同一天。","q":"钓鱼城","src":"https://www.dahepiao.com/lvyounews1/20241205497221.html","warn":"","rate":2,"photo":"Diaoyu Fortress, 2017-09-23 10.jpg","been":false,"go":""},{"id":"cq-jinfoshan","zh":"金佛山","en":"Jinfo Mountain","cat":"周边一日","area":"南川区（主城约1.5–2小时）","addr":"重庆市南川区金佛山景区（北坡入口在三泉镇）","transit":"重庆东站坐渝厦高铁到「南川北」站（约30分钟），再打车或坐景区专线到北坡或西坡，约40–60分钟；常见玩法是西坡上、北坡下（以官方为准）","hours":"北坡约08:00–17:30；另有08:30–17:00、15:30停止入园的说法（以官方为准）","price":"门票、景区巴士、索道分开收费，合计约¥170（2022年游记价）；滑雪另收费（以官方为准）","dur":"1天","desc":"世界自然遗产「中国南方喀斯特」的一部分，主峰海拔2200多米，有喀斯特石林、古栈道和悬崖观景台，还有银杉等珍稀植物。冬天有雾凇、雪景和滑雪场，是重庆人赏雪的热门地方。","tips":"11月底山顶可能结冰，带羽绒服和防滑鞋；雪后上山常要排队、控制车流，尽早出发。山上天气变化快，晴天才看得到云海。","q":"金佛山风景区","src":"https://www.dahepiao.com/lvyounews1/20240328454514.html","warn":"","rate":2,"photo":"重庆 金佛山 云海 - panoramio.jpg","been":false,"go":""},{"id":"cq-yangtze-cruise","zh":"长江三峡游轮（重庆出发）","en":"Yangtze Three Gorges Cruise from Chongqing","cat":"周边一日","area":"渝中 · 朝天门（多日游）","addr":"重庆朝天门码头（以各游轮公司通知为准）","transit":"朝天门码头：轨道1号线或6号线至「小什字」站，步行约10分钟；登船码头以游轮公司通知为准（以官方为准）","hours":"下水（重庆→宜昌）常见4天3晚，通常晚上在重庆登船（以官方为准）","price":"价格随船只、舱位和日期浮动，需向游轮公司或旅行社询价；岸上景点有的含在船票里，有的另收费（以官方为准）","dur":"3–4晚","desc":"从重庆顺长江而下，经过丰都、瞿塘峡、巫峡、西陵峡和三峡大坝，最后到宜昌。不是一日游，适合时间充裕、想慢慢看三峡的人。","tips":"冬天船少、价格较低，但天气阴冷、雾多。部分航次在湖北秭归下船，订票时确认上下船码头和岸上行程。","q":"朝天门码头","src":"https://lxs.cncn.com/27105/n1196566","warn":"","rate":2,"photo":"Yangtze River Cruise Chongqing 20181122.jpg","been":false,"go":""},{"id":"cq-huangguan","zh":"皇冠大扶梯","en":"Huangguan Escalator","cat":"地标","area":"渝中 · 两路口","addr":"重庆市渝中区两路口（中山三路）至菜园坝","transit":"轨道 1/3 号线两路口站，按指示往 4 号口方向走即到","hours":"约 06:45–22:00（以官方为准）","price":"¥2/人","dur":"20 分钟","desc":"连接两路口和菜园坝（重庆站）的超长坡地扶梯，长约 112 米、高差约 52.5 米，坡度 30 度，单程约 2.5 分钟。向下望深不见底，是体验“山城”落差的独特交通工具。","tips":"可在两路口换乘时顺便体验；下行比上行更有视觉冲击。","q":"皇冠大扶梯","src":"https://touch.travel.qunar.com/poi/7565502","warn":"","rate":1,"photo":"Crown Escalator, Chongqing, 2017-09-21.jpg","been":false,"go":""},{"id":"cq-yunduanzhiyan","zh":"重庆云端之眼观景台","en":"Chongqing Eye of the Clouds Observation Deck","cat":"地标","area":"渝中 · 解放碑","addr":"重庆市渝中区新华路 201 号联合国际大厦 67 楼","transit":"轨道 1/6 号线小什字站，走约 5 分钟","hours":"约 09:00–22:30（夏季延长至 23:00，以官方为准）","price":"约 ¥68（常有团购及索道联票，以官方为准）","dur":"1 小时","desc":"位于解放碑核心区高楼顶层的室内观景台，可 360 度俯瞰渝中半岛、两江交汇和南山。紧邻长江索道北站，可买索道+观景台联票。","tips":"晴天傍晚到夜间视野最佳；雾天能见度低，购票前看天气。","q":"重庆云端之眼观景台","src":"https://www.dahepiao.com/lvyounews1/20250310506157.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-beicang","zh":"北仓文创街区","en":"Beicang Creative Block","cat":"街区","area":"江北 · 观音桥","addr":"重庆市江北区塔坪 55 号（建北一支路一带）","transit":"轨道 3/9 号线观音桥站 4 号口，走约 15 分钟（以导航为准）","hours":"街区全天开放；店铺约 10:00–22:00","price":"免费","dur":"1 小时","desc":"由老仓库和厂房改造的文创街区，红砖建筑里有书店、咖啡馆、小酒馆和艺术空间，氛围文艺安静，与热闹的观音桥商圈仅一街之隔。","tips":"适合下午喝咖啡、逛书店，晚上再去观音桥或九街。","q":"北仓文创街区","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/5073027.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-jiujie","zh":"九街","en":"Jiujie Nightlife Street","cat":"美食夜市","area":"江北 · 观音桥","addr":"重庆市江北区观音桥鲤鱼池路一带","transit":"轨道 9/10 号线鲤鱼池站或 3/9 号线观音桥站，走约 10–15 分钟（以导航为准）","hours":"约 18:00 至次日凌晨（各店不同）","price":"免费（消费另计）","dur":"2 小时","desc":"重庆最有名的夜生活街区之一，酒吧、清吧、Livehouse、夜宵和网红餐厅聚集，深夜依旧灯火通明。","tips":"晚上 21:00 后才真正热闹；注意饮酒安全，结束后叫车回酒店。","q":"重庆九街","src":"https://m.winshang.com/news713358.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-guanyinqiao","zh":"观音桥商圈","en":"Guanyinqiao Shopping District","cat":"商场","area":"江北 · 观音桥","addr":"重庆市江北区观音桥步行街","transit":"轨道 3/9 号线观音桥站，出站即到","hours":"全天开放（商场约 10:00–22:00）","price":"免费","dur":"1–2 小时","desc":"重庆最繁华的商圈之一，北城天街、远东百货、大融城等商场环绕音乐喷泉广场，美食和夜生活集中。周边还有九街酒吧街和北仓文创街区。","tips":"晚上来更热闹，可接着去九街；商场里有大量重庆本地连锁餐饮，比景区性价比高。","q":"观音桥步行街","src":"https://en.wikipedia.org/wiki/Guanyinqiao_station","warn":"","rate":1,"photo":"观音桥步行街.jpg","been":false,"go":""},{"id":"cq-planning-gallery","zh":"重庆规划展览馆","en":"Chongqing Planning Exhibition Gallery","cat":"博物馆","area":"南岸 · 南滨路（弹子石一带）","addr":"重庆市南岸区南滨路弹子石一带（具体地址以导航为准）","transit":"从解放碑打车过江最方便，约15–20分钟（以官方为准）","hours":"周二至周日09:30–17:30（16:30停止入馆），周一闭馆（以官方为准）","price":"免费，需在公众号预约（以官方为准）","dur":"1–1.5小时","desc":"介绍重庆城市规划和山城格局的展馆，有大型城市沙盘和多媒体展，看完对两江四岸和主城组团会更清楚。","tips":"适合对城市规划感兴趣的人，第一次来不算必去；可以和弹子石老街、南滨路夜景排成一晚。","q":"重庆市规划展览馆","src":"https://www.maigoo.com/citiao/113904.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-science-museum","zh":"重庆科技馆","en":"Chongqing Science and Technology Museum","cat":"室内","area":"江北 · 江北嘴","addr":"重庆市江北区江北城文星门街7号","transit":"解放碑步行到小什字站，乘轨道6号线1站到「江北城」站，步行约5分钟，共约20分钟（以官方为准）","hours":"周二至周日09:30–17:00（16:30停止入馆），周一闭馆（法定节假日除外）（以官方为准）","price":"免费；部分体验项目和特效影院要在小程序预约或另收费（以官方为准）","dur":"2–3小时","desc":"两江交汇处江北嘴的大型科技馆，有生活、防灾、交通、宇航等多个互动展厅。建筑外立面很有特色，门口就是江景。","tips":"雨天和带小孩的时候很合适；一个人的话可以和旁边的重庆大剧院、江北嘴江边散步排在一起。","q":"重庆科技馆","src":"https://www.maigoo.com/citiao/113912.html","warn":"","rate":1,"photo":"CQ Science Museum.JPG","been":false,"go":""},{"id":"cq-nanshan-botanic","zh":"南山植物园","en":"Chongqing Nanshan Botanical Garden","cat":"公园自然","area":"南岸 · 南山","addr":"重庆市南岸区南山植物园路101号","transit":"无轨道直达。解放碑乘公交到南坪或上新街，换乘384路到「南山植物园」；打车约30分钟（以官方为准）","hours":"09:00–17:00（部分渠道写08:00开园）（以官方为准）","price":"收费，第三方平台团购约¥6起；1.2米以下儿童、65岁以上免票（以官方为准）","dur":"2–3小时","desc":"位于南山之上的大型植物园，有梅园、兰园、山茶园、盆景园和展览温室。春天的樱花、山茶、郁金香最出名，冬季到早春有梅花展。","tips":"11月底花少，主要看温室和秋色；1–2月梅花季再去更好。可以和南山老君洞、黄桷垭老街排成半天。","q":"重庆南山植物园","src":"https://www.dahepiao.com/lvyounews1/20240218446936.html","warn":"","rate":1,"photo":"南山植物园-景色 - panoramio.jpg","been":false,"go":""},{"id":"cq-yuanboyuan","zh":"重庆园博园","en":"Chongqing Garden Expo Park","cat":"公园自然","area":"渝北 · 龙景湖","addr":"重庆市渝北区园博园路（龙景湖畔）","transit":"轨道3号线至「园博园」站，2号口步行到东门；或5号线至「园博中心」站，1号口到东门；从解放碑约1小时（以官方为准）","hours":"白天开放（以官方为准）","price":"免费","dur":"2–4小时","desc":"2011年第八届中国（重庆）国际园林博览会的会址，围着龙景湖建了一百多个国内外城市展园和景观建筑。面积很大，湖景开阔，是本地人周末散步、骑车的地方。","tips":"园区非常大，建议骑车或坐园内观光车；秋冬晴天拍湖景不错。和欢乐谷、悦来离得不远，可以排在同一天。","q":"重庆园博园","src":"https://post.smzdm.com/p/axz67924/","warn":"","rate":1,"photo":"重庆-园博园一湖景 - panoramio.jpg","been":false,"go":""},{"id":"cq-zhaomushan","zh":"照母山森林公园","en":"Zhaomushan Forest Park","cat":"公园自然","area":"渝北 · 两江新区（照母山）","addr":"重庆市渝北区照母山森林公园（金开大道附近）（以官方为准）","transit":"轨道5号线至「幸福广场」站，步行约2公里，要爬一段台阶；也可以打车到山门（以官方为准）","hours":"约08:00–18:00（以官方为准）","price":"免费（以官方为准）","dur":"1–2小时","desc":"两江新区中间的城市森林公园，面积约4300亩，是新城区的「绿肺」。山顶的看云楼可以远眺礼嘉、照母山一带的新城天际线。","tips":"适合傍晚上山看日落和城市灯光；景点不多，专程跑一趟不太值，住在北区可以顺便去。","q":"照母山森林公园","src":"https://touch.travel.qunar.com/poi/9482756","warn":"","rate":1,"photo":"照母山公园-就在眼前 - panoramio.jpg","been":false,"go":""},{"id":"cq-tongjing","zh":"统景温泉","en":"Tongjing Hot Spring","cat":"公园自然","area":"渝北 · 统景镇（主城约1–1.5小时车程）","addr":"重庆市渝北区统景镇景泉路66号","transit":"没有轨道直达，建议打车或自驾（约1–1.5小时）；也可以从主城客运站坐班车到统景镇再步行或打车（以官方为准）","hours":"约09:00–23:00（以官方为准）","price":"温泉票：成人周一至周四约¥98，周末和节假日约¥118；峡江游船另收费（以官方为准）","dur":"半天","desc":"温塘河峡谷里的老牌温泉景区，有室外露天泡池、峡江和溶洞，可以坐船游峡谷。重庆号称「温泉之都」，统景是主城附近最有名的温泉之一。","tips":"11月到次年3月是泡温泉的季节，周末人多，尽量挑工作日；自带泳衣。不想跑远的话，北碚北温泉、南温泉都可以替代。","q":"统景温泉","src":"https://www.dahepiao.com/lvyounews1/20241216498209.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-geleshan","zh":"歌乐山国家森林公园","en":"Geleshan National Forest Park","cat":"徒步","area":"沙坪坝 · 歌乐山","addr":"重庆市沙坪坝区歌乐山街道森林路","transit":"解放碑乘轨道1号线至「歌乐山」站（约45分钟），再打车或坐公交上山，约15–20分钟（以官方为准）","hours":"白天开放（以官方为准）","price":"未查到大门票收费信息，园内探险乐园等项目另收费（以官方为准）","dur":"2–3小时","desc":"主城西边的森林山地，海拔约678米，山上有云顶寺、马蹄井、龙泉洞等景点，林荫步道适合散步避暑。山脚的歌乐山一带也是辣子鸡的发源地。","tips":"可以和渣滓洞、白公馆同一天去；下山顺路吃一顿歌乐山辣子鸡。冬天山上湿冷有雾，视野一般。","q":"歌乐山国家森林公园","src":"https://touch.piao.qunar.com/touch/detail.htm?id=3193","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-tieshanping","zh":"铁山坪森林公园","en":"Tieshanping Forest Park","cat":"徒步","area":"江北 · 铁山坪","addr":"重庆市江北区铁山坪街道","transit":"乘轨道4号线至「铁山坪」站，出站即到山脚；从解放碑需换乘一次，约1小时（以官方为准）","hours":"全天开放","price":"未查到大门票收费信息（以官方为准）","dur":"2–4小时","desc":"主城东边的大片森林，林间有环山步道和骑行道，夏天比市区凉快不少。轨道4号线直达，是本地人周末徒步和露营的地方。","tips":"步道长短可以自己选，穿运动鞋；这里主要是森林，没有标志性景点，适合想在主城徒步的人。","q":"铁山坪森林公园","src":"https://gs.ctrip.com/html5/you/sight/158/145492.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-happyvalley","zh":"重庆欢乐谷","en":"Happy Valley Chongqing","cat":"乐园","area":"渝北 · 礼嘉","addr":"重庆市渝北区金渝大道29号（以官方为准）","transit":"解放碑乘轨道到「欢乐谷」站（6号线支线/国博线），出站即到，约1小时（以官方为准）","hours":"冬季平日约10:00–18:30，周末和节假日延长至22:00；闭园前1小时停止入园（以官方为准）","price":"全天成人票门市约¥200，线上平台常见¥110起（以官方为准）","dur":"半天–1天","desc":"主城北部的大型主题乐园，有过山车、跳楼机等刺激项目，还有表演和夜场灯光。地铁直达，适合年轻人或带小孩的家庭。","tips":"11月底是淡季，部分水上和高空项目可能停开或提前关，买票前先看官方公告。一个人去性价比一般，结伴更好玩。","q":"重庆欢乐谷","src":"https://www.dahepiao.com/lvyounews1/20250207503471.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-anju","zh":"安居古城","en":"Anju Ancient Town","cat":"周边一日","area":"铜梁区（主城约1–1.5小时）","addr":"重庆市铜梁区安居镇大南门街","transit":"没有轨道直达。从主城客运站坐班车到铜梁城区，再坐公交或打车约30分钟；自驾约1小时（成渝中线高铁预计2027年通车）（以官方为准）","hours":"全天开放","price":"古城免费，个别场馆可能另收费（以官方为准）","dur":"3–4小时","desc":"建于隋代、有1400多年历史的古城，位于涪江和琼江的交汇处，至今保留着城隍庙、会馆和石板街。商业化程度比磁器口低，生活气更浓。","tips":"适合想看安静古镇的人；公共交通要转车，结伴包车更省事。铜梁龙舞很有名，节庆时可能有表演。","q":"安居古城","src":"https://gs.ctrip.com/html5/you/sight/158/1482545.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-zhuoshui","zh":"濯水古镇","en":"Zhuoshui Ancient Town","cat":"周边一日","area":"黔江区（高铁约1–1.5小时）","addr":"重庆市黔江区濯水镇","transit":"重庆东站坐渝厦高铁到「黔江」站，最快约66分钟；黔江站有到濯水古镇的旅游专线，也可以打车（以官方为准）","hours":"全天开放","price":"古镇街区一般免费；含蒲花暗河等项目的景区套票第三方约¥95起（以官方为准）","dur":"半天–1天","desc":"国家5A级景区，唐末兴起、明清繁盛的土家族古镇，位于阿蓬江边。风雨廊桥很长，吊脚楼和老街夜景都很好看。","tips":"来回加游览一天比较赶，建议在黔江住一晚，顺便去小南海或十三寨。2025年1–9月游客超过500万人次，节假日很挤。","q":"濯水古镇","src":"https://www.news.cn/culture/20251031/d524e44eab5d4493a3758d628221ff75/c.html","warn":"","rate":1,"photo":"","been":false,"go":""},{"id":"cq-simianshan","zh":"四面山","en":"Simian Mountain","cat":"周边一日","area":"江津区（主城约2–2.5小时）","addr":"重庆市江津区四面山镇","transit":"坐市郊铁路江跳线到「圣泉寺」站，换乘四面山景区专线大巴；或到江津客运中心坐班车去四面山（约1.5小时）（以官方为准）","hours":"约08:00–18:00（以官方为准）","price":"门票约¥90；景区很大，观光车另收费（平台有含观光车的套票约¥99）（以官方为准）","dur":"1天（建议住1晚）","desc":"丹霞地貌和森林的大景区，望乡台瀑布落差一百五十多米，号称华夏第一高瀑。另有洪海、土地岩和爱情天梯等景点。","tips":"冬天水小，瀑布没有夏天壮观；景点之间距离远，一天来回很赶，可以在山上住一晚。","q":"四面山风景区","src":"https://gs.ctrip.com/html5/you/sight/chongqing158/10414.html","warn":"","rate":1,"photo":"The Great Red Sea in Simian Mountain,Jiangjin,Chongqing.JPG","been":false,"go":""},{"id":"cq-zhongshan","zh":"江津中山古镇","en":"Zhongshan Ancient Town (Jiangjin)","cat":"周边一日","area":"江津区（主城约2小时）","addr":"重庆市江津区中山镇三合社区月亮坝街","transit":"先坐江跳线或大巴到江津城区，再转班车去中山镇（约1–1.5小时）；自驾更方便（以官方为准）","hours":"全天开放","price":"免费（以官方为准）","dur":"2–3小时","desc":"笋溪河边的千年老场镇（三合场），木结构吊脚楼老街沿河而建，老街上还有很多本地人居住。","tips":"老街不长，20分钟能走完，适合和四面山连着玩。晚上灯光较暗、不少店早关，白天去更好。","q":"中山古镇","src":"https://touch.travel.qunar.com/poi/703891","warn":"","rate":1,"photo":"Zhongshan Ancient Town, Jiangjin, Chongqing.jpg","been":false,"go":""}];
var CATS=["地标","街区","美食夜市","商场","宗教建筑","博物馆","室内","公园自然","动物","徒步","乐园","周边一日"];
var EM={"地标":"🏙","街区":"🏮","美食夜市":"🍢","商场":"🛍","宗教建筑":"🕌","博物馆":"🏛","室内":"🎡","公园自然":"🌳","动物":"🦜","徒步":"🥾","乐园":"🎢","周边一日":"🚌"};
var FILES={"cq":"cq-transit.html"},CFG={"map":"amap","city":"重庆"};
function mapUrl(q){return CFG.map==="amap"?"https://uri.amap.com/search?keyword="+encodeURIComponent(q)+"&amp;city="+encodeURIComponent(CFG.city||"")+"&amp;callnative=1":"https://www.google.com/maps/search/?api=1&amp;query="+encodeURIComponent(q);}
var BY={};DATA.forEach(function(x){BY[x.id]=x;});
function st(x){return TRIPST.get(x.id)||{been:!!x.been,want:false};}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function img(f){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width=640";}
function page(f){return "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));}
var F={cat:"",st:"",q:"",so:"rate"},mine=false; // mine：自己点的改动只更新那一张卡片，别处（后台、别的页面）来的才整页重画
function card(x){
  var s=st(x),ph=x.photo?'<img loading="lazy" src="'+esc(img(x.photo))+'" alt="'+esc(x.zh)+'" onerror="this.outerHTML=\'<div class=no>'+(EM[x.cat]||"📍")+'</div>\'">':'<div class="no">'+(EM[x.cat]||"📍")+'</div>';
  var row=function(i,v){return v?'<dt>'+i+'</dt><dd>'+esc(v)+'</dd>':"";};
  return '<article class="card'+(s.been?" been":"")+(s.want?" want":"")+'" id="c-'+esc(x.id)+'" data-id="'+esc(x.id)+'">'+
    (x.photo?'<a class="ph" href="'+esc(page(x.photo))+'" target="_blank" rel="noopener">':'<div class="ph">')+ph+
    '<span class="rate">'+"★★★".slice(0,x.rate)+'</span><span class="ct">'+(EM[x.cat]||"")+' '+esc(x.cat)+'</span><span class="mk b">✅ 去过</span><span class="mk w">⭐ 想去</span>'+(x.photo?'</a>':'</div>')+
    '<div class="cb"><div class="nm"><b>'+esc(x.zh)+'</b><small>'+esc(x.en)+'</small></div><div class="area">📍 '+esc(x.area)+'</div>'+(x.warn?'<p class="warn">⚠️ '+esc(x.warn)+'</p>':"")+
    '<dl class="info">'+row("🚇",x.transit)+row("🕘",x.hours)+row("💵",x.price)+row("⏱",x.dur)+row("🏠",x.addr)+'</dl>'+
    (x.desc?'<p class="desc">'+esc(x.desc)+'</p>':"")+(x.tips?'<p class="tips">💡 '+esc(x.tips)+'</p>':"")+
    '<div class="acts"><button class="bt b" data-k="been">'+(s.been?"✅ 已去过":"☐ 去过")+'</button><button class="bt w" data-k="want">'+(s.want?"⭐ 想去":"☆ 想去")+'</button>'+
    (x.q?'<a class="lk" href="'+mapUrl(x.q)+'" target="_blank" rel="noopener">📍 '+(CFG.map==="amap"?"高德地图":"地图")+'</a>':"")+
    (x.go&&FILES[x.go]?'<a class="lk" href="'+FILES[x.go]+'" data-go="'+esc(x.go)+'">🧭 照着走 ›</a>':"")+
    (x.src?'<a class="lk s" href="'+esc(x.src)+'" target="_blank" rel="noopener">来源</a>':"")+'</div></div></article>';
}
function match(x){
  var s=st(x);
  if(F.cat&&x.cat!==F.cat)return false;
  if(F.st==="been"&&!s.been)return false;if(F.st==="want"&&!s.want)return false;if(F.st==="left"&&s.been)return false;
  if(F.q){var h=(x.zh+" "+x.en+" "+x.area+" "+x.transit+" "+x.cat+" "+x.addr+" "+x.desc).toLowerCase();if(h.indexOf(F.q.toLowerCase())<0)return false;}
  return true;
}
function order(a,b){
  if(F.so==="area")return (a.area||"").localeCompare(b.area||"","zh")||b.rate-a.rate;
  if(F.so==="cat")return CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||b.rate-a.rate;
  return b.rate-a.rate||CATS.indexOf(a.cat)-CATS.indexOf(b.cat);
}
function stats(){
  var b=0,w=0;DATA.forEach(function(x){var s=st(x);if(s.been)b++;else if(s.want)w++;});
  document.getElementById("n-been").textContent=b;document.getElementById("n-want").textContent=w;document.getElementById("n-left").textContent=DATA.length-b;
  document.getElementById("bar").style.width=(DATA.length?Math.round(b*100/DATA.length):0)+"%";
  var cnt={};DATA.forEach(function(x){cnt[x.cat]=(cnt[x.cat]||0)+1;});
  document.getElementById("cats").innerHTML='<span class="lbl">类型</span><button class="chip'+(F.cat?"":" on")+'" data-cat="">全部<small>'+DATA.length+'</small></button>'+CATS.filter(function(c){return cnt[c];}).map(function(c){return '<button class="chip'+(F.cat===c?" on":"")+'" data-cat="'+c+'">'+EM[c]+" "+c+'<small>'+cnt[c]+'</small></button>';}).join("");
  var SS=[["","全部"],["left","还没去 "+(DATA.length-b)],["want","⭐ 想去 "+w],["been","✅ 去过 "+b]];
  document.getElementById("st").innerHTML='<span class="lbl">状态</span>'+SS.map(function(z){return '<button class="chip'+(F.st===z[0]?" on":"")+'" data-st="'+z[0]+'">'+z[1]+'</button>';}).join("");
}
function render(){
  var L=DATA.filter(match).sort(order);
  document.getElementById("grid").innerHTML=L.map(card).join("");
  document.getElementById("empty").style.display=L.length?"none":"";
  stats();
}
function toggle(id,k){
  var x=BY[id];if(!x)return;var v=Object.assign({},st(x));v[k]=!v[k];if(k==="been"&&v.been)v.want=false;
  mine=true;TRIPST.set(id,v);mine=false;
  var el=document.getElementById("c-"+id);if(el&&match(x)){el.outerHTML=card(x);}else render();
  stats();
}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("button,a[data-go]");if(!t)return;
  if(t.dataset.k){var c=t.closest(".card");if(c)toggle(c.dataset.id,t.dataset.k);return;}
  if(t.hasAttribute("data-cat")){F.cat=t.dataset.cat;render();return;}
  if(t.hasAttribute("data-st")){F.st=t.dataset.st;render();return;}
  if(t.dataset.go&&window.parent&&window.parent!==window){e.preventDefault();try{parent.postMessage({tripGo:t.dataset.go},"*");}catch(er){}}
});
var qT=0;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){F.q=e.target.value.trim();render();},150);});
document.getElementById("so").addEventListener("change",function(e){F.so=e.target.value;render();});
var sy=document.getElementById("sync");
render();
TRIPST.on(function(){if(!mine)render();});
if(!TRIPST.cloud){sy.textContent="📱 单独打开：勾的只存在这台设备（在网站「旅游」里打开会同步）";}
else{sy.textContent="☁️ 同步中…";TRIPST.sync().then(function(r){sy.textContent=r==="ok"?"☁️ 已同步（换设备也在）":"⚠️ 现在连不上后台，勾的先存在这台设备，下次打开再同步";});}
})();
</script>
