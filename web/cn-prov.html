<!doctype html><html lang="zh-CN"><head>
<link rel="icon" href="/icon.svg?v=c523a8a0" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=c615e9d4" sizes="48x48"><link rel="apple-touch-icon" href="/icon-192.png?v=aa949b6f">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中国 · 省份</title>
<meta name="theme-color" content="#1d1e21">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 🇨🇳 省份页（所有省共用这一个页面）：网址 cn-prov.html?p=<拼音>，数据在 cn/<拼音>.json（34 个省级行政区，每个省下面所有地级市 / 直辖市的区县 / 港澳的区 / 台湾的县市）。
     数据来源：维基数据（城市列表、坐标、照片 P18）+ 中文维基百科（开头两句简介、首图补照片），2026-11 用 scratchpad 的 cn/build_data.py、make_files.py 生成，每张卡片有维基百科链接。
     每个城市：照片、简介、离省会多远、📍 高德地图定位（wgs84 坐标交给高德换算）、🔍 高德搜这个城市的景点、✅ 去过 / ⭐ 想去（trip-state.js，id = cn-<维基数据编号>，换设备也在）。
     已经做好的攻略（杭州 / 重庆景点大全、重庆中转、东北自驾）在省页顶上和对应城市卡片上挂链接。以后做城市页：卡片上加「🏙 城市页」，同样数据驱动。
     在网站里从旅游中心「🇨🇳 中国」的省份卡片打开（tabs.js 认 prov:<拼音>） -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#1E2733;--soft:#7C8794;--line:#E5EAE8;--bg:#EFF2F1;--paper:#FFFFFF;--paper-2:#F1F4F3;
    --display:"Fraunces",Georgia,"Songti SC",serif;--font:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px 70px}
  .hero{position:relative;color:#fff;padding:46px 22px 30px;text-align:center;overflow:hidden;background:#1e2a33 center/cover no-repeat}
  .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,18,.55),rgba(10,12,18,.85))}
  .hin{position:relative}.hero .k{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}
  .hero h1{font-family:var(--display);font-size:32px;margin:8px 0 6px;font-weight:900}.hero .sub{font-size:14px;opacity:.95;max-width:760px;margin:0 auto 14px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 15px;min-width:88px}
  .stat b{display:block;font-family:var(--display);font-size:20px;font-weight:900}.stat span{font-size:12px;opacity:.92}
  .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.14);max-width:420px;margin:14px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ce3b8,#c59bef);transition:width .3s}
  .links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .lk{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--jade-deep,#c59bef);background:var(--ui-pur-soft,rgba(197,155,239,.12));border:1px solid rgba(197,155,239,.3);border-radius:999px;padding:5px 12px;text-decoration:none;line-height:1.5;cursor:pointer}
  .lk.s{color:var(--soft);background:transparent;border-color:var(--line)}.hero .lk{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
  .lk.go{color:#fff;background:var(--ui-pur,#8b5cf6);border-color:var(--ui-pur,#8b5cf6)}
  .tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}.row:first-child{margin-top:0}
  .q{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;outline:none}
  select.so{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
  .chip{font:inherit;font-size:12.5px;font-weight:700;color:var(--soft);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
  .chip.on{color:#fff;background:var(--ui-pur,#8b5cf6);border-color:var(--ui-pur,#8b5cf6)}
  .lbl{font-size:12px;color:var(--soft);margin-right:2px;white-space:nowrap;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--ui-radius,16px);overflow:hidden;display:flex;flex-direction:column}
  .card.been{border-color:rgba(124,227,184,.55)}.card.want{border-color:rgba(255,196,84,.6)}
  .ph{position:relative;display:block;line-height:0;background:var(--paper-2)}
  .ph img{width:100%;height:170px;object-fit:cover;display:block}.ph .no{display:flex;align-items:center;justify-content:center;height:170px;font-size:50px;line-height:1}
  .tag{position:absolute;left:8px;top:8px;font-size:11.5px;line-height:1.5;color:#fff;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:999px}
  .tag.cap{background:#b98410}
  .mk{position:absolute;right:8px;top:8px;font-size:12px;font-weight:800;line-height:1.5;padding:2px 10px;border-radius:999px;display:none}
  .card.been .mk.b{display:inline-block;background:#1f7a55;color:#fff}.card.want:not(.been) .mk.w{display:inline-block;background:#b98410;color:#fff}
  .cb{padding:11px 14px 13px;display:flex;flex-direction:column;flex:1}
  .nm b{font-size:16px;font-weight:900;display:block;line-height:1.4}.nm small{display:block;color:var(--soft);font-size:12px;line-height:1.45}
  .meta{font-size:12.5px;color:var(--soft);margin-top:3px}
  .desc{font-size:13.2px;margin-top:7px;color:var(--ui-ink-2,var(--ink))}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:11px}
  .bt{font:inherit;font-size:12.5px;font-weight:800;border-radius:999px;padding:4px 12px;cursor:pointer;border:1px solid var(--line);background:var(--paper-2);color:var(--ink)}
  .card.been .bt.b{background:#1f7a55;border-color:#1f7a55;color:#fff}.card.want .bt.w{background:#b98410;border-color:#b98410;color:#fff}
  .empty,.err{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
  footer{text-align:center;color:var(--soft);font-size:12px;margin-top:26px;line-height:1.8}
  @media (max-width:520px){.hero h1{font-size:25px}.grid{grid-template-columns:1fr}#st{flex-wrap:nowrap;overflow-x:auto}}
</style><link rel="stylesheet" href="theme.css">
<script src="trip-state.js"></script>
</head><body>
<div class="hero" id="hero"><div class="hin">
  <div class="k" id="hk">China</div>
  <h1 id="h1">加载中…</h1>
  <div class="sub" id="hs"></div>
  <div class="stats">
    <div class="stat"><b id="n-all">0</b><span id="n-lbl">个城市</span></div>
    <div class="stat"><b id="n-been">0</b><span>✅ 去过</span></div>
    <div class="stat"><b id="n-want">0</b><span>⭐ 想去</span></div>
    <div class="stat"><b id="n-cap">—</b><span>省会</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="links" id="hl"></div>
</div></div>
<div class="wrap">
  <div class="tools">
    <div class="row"><input class="q" id="q" type="search" placeholder="🔍 搜城市名……" autocomplete="off">
      <select class="so" id="so"><option value="km">离省会由近到远</option><option value="name">按名字</option></select></div>
    <div class="row" id="st"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有符合的城市</div>
  <footer>城市列表、坐标、照片来自维基数据 / 维基共享资源，简介来自中文维基百科（每张卡片有链接）· 点照片看原图和作者<br>📍 高德地图：看位置 · 🔍 搜景点：用高德搜这个城市的景点 · 之后会给每个城市出单独的页面</footer>
</div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function img(f,w){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width="+(w||560);}
function page(f){return "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));}
function wiki(t){return "https://zh.wikipedia.org/zh-cn/"+encodeURIComponent(t.replace(/ /g,"_"));}
function amapAt(x){return "https://uri.amap.com/marker?position="+x.lng+","+x.lat+"&name="+encodeURIComponent(x.zh)+"&coordinate=wgs84&callnative=1&src=banlife.trip";}
function amapSights(x){return "https://uri.amap.com/search?keyword="+encodeURIComponent("景点")+"&city="+encodeURIComponent(x.zh)+"&callnative=1&src=banlife.trip";}
function go(g){if(window.parent&&window.parent!==window){try{parent.postMessage({tripGo:g},"*");}catch(e){}}}
var slug=(new URLSearchParams(location.search).get("p")||"").replace(/[^a-z]/g,"");
var D=null,BY={},F={st:"",q:"",so:"km"},mine=false;
function st(x){return TRIPST.get(x.id)||{been:false,want:false};}
function card(x){
  var s=st(x),ph=x.img?'<img loading="lazy" src="'+esc(img(x.img))+'" alt="'+esc(x.zh)+'" onerror="this.outerHTML=\'<div class=no>🏙</div>\'">':'<div class="no">🏙</div>';
  return '<article class="card'+(s.been?" been":"")+(s.want?" want":"")+'" id="c-'+esc(x.id)+'" data-id="'+esc(x.id)+'">'+
    (x.img?'<a class="ph" href="'+esc(page(x.img))+'" target="_blank" rel="noopener">':'<div class="ph">')+ph+
    (x.cap?'<span class="tag cap">⭐ 省会</span>':(x.km!=null?'<span class="tag">离'+esc(D.capShort)+' '+x.km+' km</span>':""))+'<span class="mk b">✅ 去过</span><span class="mk w">⭐ 想去</span>'+(x.img?'</a>':'</div>')+
    '<div class="cb"><div class="nm"><b>'+esc(x.zh)+'</b><small>'+esc(x.en)+'</small></div>'+
    '<div class="meta">📍 '+x.lat.toFixed(2)+'°N, '+x.lng.toFixed(2)+'°E'+(x.km!=null&&!x.cap?' · 离'+esc(D.capShort)+'约 '+x.km+' 公里（直线）':"")+'</div>'+
    (x.desc?'<p class="desc">'+esc(x.desc)+'</p>':"")+
    '<div class="acts"><button class="bt b" data-k="been">'+(s.been?"✅ 已去过":"☐ 去过")+'</button><button class="bt w" data-k="want">'+(s.want?"⭐ 想去":"☆ 想去")+'</button>'+
    (x.go?'<a class="lk go" data-go="'+esc(x.go)+'">'+esc(x.goT)+' ›</a>':"")+
    '<a class="lk" href="'+esc(amapAt(x))+'" target="_blank" rel="noopener">📍 高德地图</a><a class="lk" href="'+esc(amapSights(x))+'" target="_blank" rel="noopener">🔍 搜景点</a>'+
    (x.wiki?'<a class="lk s" href="'+esc(wiki(x.wiki))+'" target="_blank" rel="noopener">维基百科</a>':"")+'</div></div></article>';
}
function match(x){var s=st(x);if(F.st==="been"&&!s.been)return false;if(F.st==="want"&&!s.want)return false;if(F.st==="left"&&s.been)return false;
  if(F.q){var h=(x.zh+" "+x.en+" "+x.desc).toLowerCase();if(h.indexOf(F.q.toLowerCase())<0)return false;}return true;}
function order(a,b){if(F.so==="name")return a.zh.localeCompare(b.zh,"zh");return (b.cap-a.cap)||((a.km==null?9e9:a.km)-(b.km==null?9e9:b.km));}
function stats(){var b=0,w=0,C=D.cities;C.forEach(function(x){var s=st(x);if(s.been)b++;else if(s.want)w++;});
  $("n-been").textContent=b;$("n-want").textContent=w;$("bar").style.width=(C.length?Math.round(b*100/C.length):0)+"%";
  var SS=[["","全部 "+C.length],["left","还没去 "+(C.length-b)],["want","⭐ 想去 "+w],["been","✅ 去过 "+b]];
  $("st").innerHTML='<span class="lbl">状态</span>'+SS.map(function(z){return '<button class="chip'+(F.st===z[0]?" on":"")+'" data-st="'+z[0]+'">'+z[1]+'</button>';}).join("");}
function render(){var L=D.cities.filter(match).sort(order);$("grid").innerHTML=L.map(card).join("");$("empty").style.display=L.length?"none":"";stats();}
function toggle(id,k){var x=BY[id];if(!x)return;var v=Object.assign({},st(x));v[k]=!v[k];if(k==="been"&&v.been)v.want=false;mine=true;TRIPST.set(id,v);mine=false;
  var el=$("c-"+id);if(el&&match(x))el.outerHTML=card(x);else render();stats();}
document.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("button,a[data-go]");if(!t)return;
  if(t.dataset.k){var c=t.closest(".card");if(c)toggle(c.dataset.id,t.dataset.k);return;}
  if(t.hasAttribute("data-st")){F.st=t.dataset.st;render();return;}
  if(t.dataset.go){e.preventDefault();go(t.dataset.go);}});
var qT=0;$("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){F.q=e.target.value.trim();render();},150);});
$("so").addEventListener("change",function(e){F.so=e.target.value;render();});
TRIPST.on(function(){if(!mine&&D)render();});
if(!slug){$("h1").textContent="没有指定省份";return;}
fetch("cn/"+slug+".json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  D=d;d.cities.forEach(function(x){BY[x.id]=x;});D.capShort=(d.cap||"市中心").replace(/(市|区)$/,"");
  var muni=/^(北京|上海|天津|重庆|香港|澳门|台湾)/.test(d.zh);if(muni)D.capShort=d.zh==="台湾"?"台北":"市中心";
  document.title=d.zh+" · 中国省份";$("hk").textContent=d.region+" · "+d.en;$("h1").textContent="🇨🇳 "+d.zh+"（"+d.short+"）";$("hs").textContent=d.desc;
  if(d.img)$("hero").style.backgroundImage='url("'+img(d.img,1200)+'")';
  $("n-all").textContent=d.cities.length;$("n-lbl").textContent=/^(北京|上海|天津|重庆)/.test(d.zh)?"个区县":/^(香港)/.test(d.zh)?"个区":"个城市 / 地区";
  $("n-cap").textContent=d.cap?d.cap.replace(/市$/,""):(d.zh==="台湾"?"台北":"—");
  $("hl").innerHTML='<a class="lk" data-go="cn">‹ 全国省份</a>'+(d.go||[]).map(function(g){return '<a class="lk go" data-go="'+esc(g[0])+'">'+esc(g[1])+' ›</a>';}).join("")+
    '<a class="lk" href="'+esc(amapAt({lng:d.lng,lat:d.lat,zh:d.zh}))+'" target="_blank" rel="noopener">📍 高德地图</a>'+(d.wiki?'<a class="lk" href="'+esc(wiki(d.wiki))+'" target="_blank" rel="noopener">维基百科</a>':"");
  render();TRIPST.sync();
}).catch(function(e){$("h1").textContent="读不到这个省的数据";$("hs").textContent=String(e);});
})();
</script>
</body></html>
