<!doctype html><html lang="zh-CN"><head>
<link rel="icon" href="/icon.svg?v=c523a8a0" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=c615e9d4" sizes="48x48"><link rel="apple-touch-icon" href="/icon-192.png?v=aa949b6f">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全国 5A 景区汇总 · 去过的打勾</title>
<meta name="theme-color" content="#1d1e21">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 🏅 全国 5A 级旅游景区汇总：按地区 → 省分组，每个景区一张小卡片（照片、所在市县、评定年份、去过 / 想去按钮、城市页、高德地图）。
     从旅游中心「🇨🇳 中国」那一栏的卡片打开。数据 cn/5a.json 由 tools/cn-data/5a/make_5a.py 生成：
     名单 = 中文维基「国家5A级旅游景区」总表（parse_5a.py 解析，截至 2024-12）+ 文旅部最新公示（new-2026.txt）。
     对上城市页里同名景点的，id 用那个景点的 id —— 在这里打勾和在城市页打勾是同一条记录（trip-state.js / TRIPST）。 -->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#1E2733;--soft:#7C8794;--line:#E5EAE8;--bg:#EFF2F1;--paper:#FFFFFF;--paper-2:#F1F4F3;
    --display:"Fraunces",Georgia,"Songti SC",serif;--font:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 70px}
  .hero{position:relative;color:#fff;padding:40px 22px 30px;text-align:center;overflow:hidden;background:linear-gradient(150deg,#6b2a12 0%,#3b2368 55%,#222128 100%)}
  .hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,rgba(255,201,77,.22),transparent 45%),radial-gradient(circle at 85% 85%,rgba(197,155,239,.18),transparent 50%)}
  .hin{position:relative}.hero .k{font-family:var(--display);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700}
  .hero h1{font-family:var(--display);font-size:30px;margin:8px 0 6px;font-weight:900}.hero .sub{font-size:14px;opacity:.95;margin-bottom:16px}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 16px;min-width:92px}
  .stat b{display:block;font-family:var(--display);font-size:21px;font-weight:900}.stat span{font-size:12px;opacity:.92}
  .hbar{max-width:460px;margin:14px auto 0}.sync{font-size:12px;opacity:.8;margin-top:8px}
  .tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:7px}.row:first-child{margin-top:0}
  .q{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:7px 14px;outline:none}
  select.so{font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 10px;max-width:46vw}
  .chip{font:inherit;font-size:12.5px;font-weight:700;color:var(--soft);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
  .chip.on{color:#fff;background:var(--ui-pur,#8b5cf6);border-color:var(--ui-pur,#8b5cf6)}
  .rh{display:flex;align-items:baseline;gap:8px;margin:24px 2px 4px;font-family:var(--display);font-weight:900;font-size:15px}.rh:before{content:"";width:4px;height:16px;border-radius:2px;background:#ffc94d;align-self:center}
  .ph2{display:flex;align-items:center;gap:10px;margin:14px 2px 8px;font-weight:900;font-size:15px}
  .ph2 a{color:var(--ink);text-decoration:none}.ph2 a:hover{color:#c59bef}.ph2 small{font-weight:700;font-size:12px;color:var(--soft)}
  .ph2 .pb{flex:1;max-width:220px;height:5px;border-radius:99px;background:rgba(127,127,127,.22);overflow:hidden}.ph2 .pb i{display:block;height:100%;background:#2fbf71}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .card{position:relative;display:flex;gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px;min-width:0}
  .card.been{border-color:rgba(124,227,184,.55)}.card.want{border-color:rgba(255,196,84,.6)}
  .tb{position:relative;flex:none;width:92px;height:92px;border-radius:10px;overflow:hidden;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:32px}
  .tb img{width:100%;height:100%;object-fit:cover;display:block}
  .tb .ts-mk{left:4px;bottom:4px;font-size:10.5px;padding:1px 7px}
  .cb{flex:1;min-width:0;display:flex;flex-direction:column}
  .nm{font-size:14.5px;font-weight:900;line-height:1.35}.nm .nw{display:inline-block;font-size:10.5px;font-weight:800;color:#2a2000;background:#ffc94d;border-radius:999px;padding:0 7px;margin-left:5px;vertical-align:2px}
  .mt{font-size:12px;color:var(--soft);margin-top:2px}
  .acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:7px}
  .bt{font:inherit;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;cursor:pointer;border:1px solid var(--line);background:var(--paper-2);color:var(--ink)}
  .lk{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:#c59bef;background:rgba(197,155,239,.12);border:1px solid rgba(197,155,239,.3);border-radius:999px;padding:3px 9px;text-decoration:none;line-height:1.5}
  .lk.s{color:var(--soft);background:transparent;border-color:var(--line)}
  .empty{text-align:center;color:var(--soft);padding:40px 0;font-size:14px}
  footer{text-align:center;color:var(--soft);font-size:12px;margin-top:26px;line-height:1.8}footer a{color:var(--soft)}
  @media (max-width:520px){.hero h1{font-size:24px}.grid{grid-template-columns:1fr}.tb{width:84px;height:84px}
    #st{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}#st::-webkit-scrollbar{display:none}}
</style><link rel="stylesheet" href="theme.css">
<script src="trip-state.js"></script>
</head><body>
<div class="hero"><div class="hin">
  <div class="k">China · AAAAA Scenic Areas</div>
  <h1>🏅 全国 5A 级景区汇总</h1>
  <div class="sub" id="sub">按省列出全国所有国家 5A 级旅游景区 · 去过的打勾，想去的标星（和城市页里同一个景点是同一条记录）</div>
  <div class="stats">
    <div class="stat"><b id="n-all">…</b><span>处 5A 景区</span></div>
    <div class="stat"><b id="n-been">0</b><span>✅ 去过</span></div>
    <div class="stat"><b id="n-want">0</b><span>⭐ 想去</span></div>
    <div class="stat"><b id="n-prov">0</b><span>个省去过 5A</span></div>
  </div>
  <div class="hbar" id="bar"></div>
  <div class="sync" id="sync">…</div>
  <div style="margin-top:10px"><a class="lk" href="trip-nav.html?r=cn" data-go="cn" style="color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)">🗺 在中国地图上看（金色星星，可以切换 / 隐藏）›</a></div>
</div></div>
<div class="wrap">
  <div class="tools">
    <div class="row"><div class="ts-sticky" id="pbar"></div></div>
    <div class="row"><input class="q" id="q" type="search" placeholder="🔍 搜景区、城市、省……" autocomplete="off">
      <select class="so" id="pv"><option value="">全部省份</option></select>
      <select class="so" id="so"><option value="prov">按省份</option><option value="new">按评定时间（新→旧）</option></select></div>
    <div class="row" id="st"></div>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">没有符合的景区，换个筛选试试</div>
  <footer>名单来自中文维基百科「<a href="https://zh.wikipedia.org/zh-cn/%E5%9B%BD%E5%AE%B65A%E7%BA%A7%E6%97%85%E6%B8%B8%E6%99%AF%E5%8C%BA" target="_blank" rel="noopener">国家5A级旅游景区</a>」总表（截至 2024-12）+ 文化和旅游部 2026-11-05 公示的 17 家（标 🆕，公示期满正式公告后为准）<br>
    照片来自 Wikimedia Commons · 点「城市页」看这个城市的详细景点、交通和门票</footer>
</div>
<script>
(function(){
"use strict";
TRIPST.S.css();
var DATA=[],BY={},F={st:"",q:"",pv:"",so:"prov"},mine=false;
function st(x){return TRIPST.get(x.id)||{};}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function thumb(x){return x.th?"https://upload.wikimedia.org/wikipedia/commons/thumb/"+x.th+"/250px-"+x.th.split("/").pop():"";}
function amap(x){return "https://uri.amap.com/search?keyword="+encodeURIComponent(x.n)+"&city="+encodeURIComponent(x.cz||x.c||x.p)+"&callnative=1";}
function href(g){return /^city:/.test(g)?"cn-city.html?c="+g.slice(5):/^prov:/.test(g)?"cn-prov.html?p="+g.slice(5):g==="hzsights"?"hz-sights.html":g==="cqsights"?"cq-sights.html":"#";}
function card(x){
  var s=st(x),where=[x.c,x.k].filter(Boolean).join(" · ");
  return '<article class="card '+TRIPST.S.cls(s)+'" id="c-'+esc(x.id)+'" data-id="'+esc(x.id)+'"><div class="tb">'+
    (x.th?'<img loading="lazy" alt="" src="'+esc(thumb(x))+'" onerror="this.remove()">':"🏞")+TRIPST.S.mark(s)+'</div>'+
    '<div class="cb"><div class="nm">'+esc(x.n)+(x.new?'<span class="nw">🆕 2026 公示</span>':"")+'</div>'+
    '<div class="mt">📍 '+esc(x.p.replace(/(壮族|回族|维吾尔)?(自治区|特别行政区|省|市)$/,""))+(where?" · "+esc(where):"")+' · '+esc(x.y.slice(0,4))+' 年'+(x.new?"公示":"评定")+'</div>'+
    (x.sz&&x.sz!==x.n?'<div class="mt">城市页里叫「'+esc(x.sz)+'」</div>':"")+
    '<div class="acts">'+TRIPST.S.btns(s)+
    '<a class="lk" href="'+esc(href(x.go))+'" data-go="'+esc(x.go)+'">'+(/^prov:/.test(x.go)?"省页 ›":"城市页 ›")+'</a>'+
    '<a class="lk s" href="'+esc(amap(x))+'" target="_blank" rel="noopener">高德</a></div></div></article>';
}
function match(x){
  if(F.pv&&x.p!==F.pv)return false;
  if(!TRIPST.S.match(st(x),F.st,""))return false;
  if(F.q){var h=(x.n+" "+x.p+" "+x.c+" "+x.k+" "+(x.sz||"")+" "+(x.cz||"")+" "+(x.w||"")).toLowerCase();if(h.indexOf(F.q.toLowerCase())<0)return false;}
  return true;
}
function stats(){
  var b=0,w=0,pv={};DATA.forEach(function(x){var s=TRIPST.S.norm(st(x));if(s.been){b++;pv[x.p]=1;}else if(s.want||s.plan)w++;});
  document.getElementById("n-been").textContent=b;document.getElementById("n-want").textContent=w;document.getElementById("n-prov").textContent=Object.keys(pv).length;
  document.getElementById("bar").innerHTML=document.getElementById("pbar").innerHTML=TRIPST.S.bar(DATA.filter(function(x){return !x.dup;}),st); // 跨省重复的壶口瀑布只算一处
  document.getElementById("st").innerHTML='<span style="font-size:12px;color:var(--soft)">状态</span>'+TRIPST.S.chips(DATA,st,null,F.st);
}
function render(){
  var L=DATA.filter(match),h="";
  if(F.so==="new"){L=L.slice().sort(function(a,b){return a.y<b.y?1:a.y>b.y?-1:0;});var yr="";
    L.forEach(function(x,i){var y=x.y.slice(0,4);if(y!==yr){if(yr)h+="</div>";yr=y;h+='<div class="rh">'+y+' 年'+(x.new?"公示":"评定")+'<small style="font-size:12px;color:var(--soft)">'+L.filter(function(z){return z.y.slice(0,4)===y;}).length+' 处</small></div><div class="grid">';}h+=card(x);});
    if(yr)h+="</div>";
  }else{var reg="",pv="";
    L.forEach(function(x){
      if(x.r!==reg){if(pv)h+="</div>";pv="";reg=x.r;h+='<div class="rh">'+esc(reg)+'</div>';}
      if(x.p!==pv){if(pv)h+="</div>";pv=x.p;var all=DATA.filter(function(z){return z.p===pv;}),b=all.filter(function(z){return TRIPST.S.norm(st(z)).been;}).length;
        h+='<div class="ph2"><a href="'+esc(href("prov:"+x.ps))+'" data-go="prov:'+esc(x.ps)+'">'+esc(pv)+' ›</a><small>'+all.length+' 处'+(b?" · 去过 "+b:"")+'</small><span class="pb"><i style="width:'+(b*100/all.length)+'%"></i></span></div><div class="grid">';}
      h+=card(x);});
    if(pv)h+="</div>";
  }
  document.getElementById("list").innerHTML=h;
  document.getElementById("empty").style.display=L.length?"none":"";
  stats();
}
function toggle(id,k){var x=BY[id];if(!x)return;mine=true;TRIPST.set(id,TRIPST.S.toggle(st(x),k));mine=false;render();}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("button,a[data-go]");if(!t)return;
  if(t.dataset.k){var c=t.closest(".card");if(c)toggle(c.dataset.id,t.dataset.k);return;}
  if(t.hasAttribute("data-st")){F.st=t.dataset.st;render();return;}
  if(t.dataset.go&&window.parent&&window.parent!==window){e.preventDefault();try{parent.postMessage({tripGo:t.dataset.go},"*");}catch(er){}}
});
var qT=0;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){F.q=e.target.value.trim();render();},150);});
document.getElementById("so").addEventListener("change",function(e){F.so=e.target.value;render();});
document.getElementById("pv").addEventListener("change",function(e){F.pv=e.target.value;render();});
fetch("cn/5a.json").then(function(r){return r.json();}).then(function(d){
  DATA=d;var n=0,nw=0,pvs=[];
  d.forEach(function(x){BY[x.id]=x;if(!x.dup)n++;if(x.new)nw++;if(pvs.indexOf(x.p)<0)pvs.push(x.p);}); // 跨省的（如壶口瀑布，dup=1）只算一处
  document.getElementById("n-all").textContent=n;
  document.getElementById("sub").textContent="全国 "+pvs.length+" 个省级行政区的国家 5A 级旅游景区（含 "+nw+" 家 2026-11 新公示）· 去过的打勾，想去的标星，和城市页里同一个景点是同一条记录";
  document.getElementById("pv").innerHTML='<option value="">全部省份</option>'+pvs.map(function(p){return '<option>'+esc(p)+'</option>';}).join("");
  render();
});
TRIPST.on(function(){if(!mine&&DATA.length)render();});
var sy=document.getElementById("sync");
if(!TRIPST.cloud){sy.textContent="📱 单独打开：勾的只存在这台设备（在网站「旅游」里打开会同步）";}
else{sy.textContent="☁️ 同步中…";TRIPST.sync().then(function(r){sy.textContent=r==="ok"?"☁️ 已同步（换设备也在）":"⚠️ 现在连不上后台，勾的先存在这台设备，下次打开再同步";});}
})();
</script>
</body></html>
