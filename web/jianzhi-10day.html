<!doctype html><html lang="zh-CN"><head>
<link rel="icon" href="/icon.svg?v=c523a8a0" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=c615e9d4" sizes="48x48"><link rel="apple-touch-icon" href="/icon-192.png?v=aa949b6f">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10天减脂食谱 · 吉隆坡食材随机搭</title>
<meta name="theme-color" content="#1d1e21">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1E2733;--soft:#7C8794;--line:#E5EAE8;--bg:#EFF2F1;--paper:#FFFFFF;--paper-2:#F1F4F3;--accent:#0FA37A;--jade:#0C9370;--jade-deep:#0A6E54;--gold:#E8A23C;--gold-deep:#C0812B;
  --high:#C2564A;--high-bg:#FAEBE7;--mid:#D8912E;--mid-bg:#FAF1E0;--low:#0C9370;--low-bg:#E3F0EA;
  --p:var(--ui-red);--c:#D8912E;--f:#2C8FA3;
  --display:"Fraunces",Georgia,"Songti SC",serif;--font:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:50px}
.wrap{max-width:760px;margin:0 auto;padding:0 15px}
.hero{position:relative;color:#fff;padding:40px 20px 30px;text-align:center;overflow:hidden;background:linear-gradient(150deg,#4b2370 0%,#33204a 48%,#222128 100%);border-bottom:1px solid var(--ui-line)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 12%,rgba(197,155,239,.22),transparent 46%),radial-gradient(circle at 88% 82%,rgba(255,184,107,.12),transparent 50%)}
.hin{position:relative;max-width:760px;margin:0 auto}
.hero .k{font-family:var(--display);font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.95;font-weight:700}
.hero h1{font-family:var(--display);font-size:30px;margin:9px 0 6px;font-weight:900;letter-spacing:-.01em}
.hero .sub{font-size:13.5px;opacity:.95;margin-bottom:16px}
.reroll{appearance:none;border:1px solid var(--ui-pur);background:var(--ui-pur);color:#fff;font-family:var(--font);font-weight:800;font-size:14px;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 6px 18px rgba(156,63,208,.4);transition:.15s}
.reroll:hover{background:var(--ui-pur-hi)}
.reroll:hover{transform:translateY(-1px)}
.reroll:active{transform:scale(.97)}
.bar{position:sticky;top:0;z-index:20;background:rgba(24,25,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -15px;padding:10px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .note{font-size:12px;color:var(--soft);flex:1;min-width:150px;line-height:1.5}
.bar .note b{color:var(--ink)}
.bar button{appearance:none;border:1px solid var(--ui-pur);background:var(--ui-pur);color:#fff;font-family:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:7px 15px;cursor:pointer;white-space:nowrap}
.bar button:active{transform:scale(.97)}

.day{background:var(--paper);border:1px solid var(--line);border-radius:var(--ui-radius);padding:15px 16px 12px;margin:13px 0;box-shadow:var(--ui-shadow)}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.dbadge{flex:none;font-family:var(--display);font-weight:800;font-size:15px;border:1px solid transparent;border-radius:10px;padding:6px 11px;line-height:1}
.dbadge.h{background:var(--high-bg);border-color:rgba(255,138,122,.35);color:var(--high)}.dbadge.m{background:var(--mid-bg);border-color:rgba(255,184,107,.35);color:var(--mid)}.dbadge.l{background:var(--low-bg);border-color:rgba(142,229,161,.32);color:var(--low)}
.dh .wd{font-family:var(--display);font-weight:900;font-size:16px}
.ctag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 9px}
.ctag.h{background:var(--high-bg);color:var(--high)}.ctag.m{background:var(--mid-bg);color:var(--ui-orange)}.ctag.l{background:var(--low-bg);color:var(--low)}
.win{font-size:11px;color:var(--soft);font-weight:600;margin-left:auto}
.dtot{font-size:11px;color:var(--soft);margin:2px 0 10px}
.dtot b{font-variant-numeric:tabular-nums;font-weight:800}
.dtot .tp{color:var(--p)}.dtot .tc{color:var(--c)}.dtot .tf{color:var(--f)}
.meal{border-top:1px dashed var(--line);padding:9px 0}
.meal:first-of-type{border-top:0}
.mhd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.mt{font-family:var(--display);font-weight:800;font-size:12.5px;color:var(--ui-pur-text);flex:none;width:52px}
.mnm{font-size:12px;font-weight:700;color:var(--ink)}
.mitem{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0 2px 52px;line-height:1.5}
.mitem .fn b{font-weight:700}
.mitem .fn .veg{color:var(--ui-green)}
.mitem .amt{flex:none;color:var(--soft);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mtip{font-size:11px;color:var(--soft);padding:3px 0 0 52px;line-height:1.5}
.legend{font-size:11.5px;color:var(--soft);text-align:center;margin:14px 0 0;line-height:1.7}
footer{text-align:center;color:var(--soft);font-size:11.5px;margin-top:22px;padding:14px;line-height:1.8}
footer b{color:var(--ink)}
@media(max-width:560px){.hero h1{font-size:26px}.mitem{padding-left:0}.mtip{padding-left:0}}
/* ==== 电脑端布局（≥1024px，手机端不受影响）==== */
@media (min-width:1024px){
  .wrap{max-width:1560px;padding-left:44px;padding-right:44px}
  .hin{max-width:1100px}
  .hero h1{font-size:40px}
  .bar{margin:0 -44px;padding:12px 44px}
  #days{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px;margin-top:16px}
  #days>.day{margin:0}
}
/* ==== /电脑端布局 ==== */
</style><link rel="stylesheet" href="theme.css">
</head><body>

<div class="hero"><div class="hin">
  <div class="k">生活化减脂 · 吉隆坡食材</div>
  <h1>10天减脂食谱</h1>
  <div class="sub">16:8 断食 · 高低碳循环 · 每顿随机搭，都能在吉隆坡超市买到</div>
  <button class="reroll" id="reroll">🎲 换一批搭配</button>
</div></div>

<div class="wrap">
  <div class="bar">
    <div class="note">份量按 <b>70kg 男 · 中等运动</b> 估算；女生 / 更轻按 <b>×0.8</b>，蔬菜管饱不用算。碳水日跟着「2周计划」走。</div>
    <button id="reroll2">🎲 再换一批</button>
  </div>
  <div id="days"></div>
  <p class="legend">每天数字为该日 <b style="color:var(--p)">蛋白</b> / <b style="color:var(--c)">碳水</b> / <b style="color:var(--f)">脂肪</b> 合计（克，近似）。<br>窗口外只喝 水/黑咖啡/无糖茶；正餐炒菜用橄榄油 1 勺。</p>
  <footer>10天减脂食谱 · 随机组合仅供参考，按「减脂计算」的目标微调份量。<br><b>非个性化医学/营养建议</b>，特殊健康状况请咨询专业人士。</footer>
</div>

<script>
/* 食材池（吉隆坡超市可买）· m=[蛋白,碳水,脂肪] 每份克 */
var CARB_BF=[
  {n:'燕麦片(热水/无糖豆浆冲)',a:{l:'40g',m:'55g',h:'70g'},p:{l:[5,24,3],m:[7,33,4],h:[9,42,5]}},
  {n:'全麦吐司',a:{l:'2片',m:'2片',h:'3片'},p:{l:[8,26,3],m:[8,26,3],h:[12,39,4]}},
  {n:'香蕉+燕麦',a:{l:'1根+30g',m:'1根+40g',h:'1根+55g'},p:{l:[5,35,2],m:[6,42,3],h:[8,52,4]}}
];
var PROT_BF=[
  {n:'全蛋(水煮/少油煎)',a:'2个',m:[13,1,10]},
  {n:'希腊式优格',a:'150g',m:[14,6,6]},
  {n:'低脂优格+蛋白粉',a:'150g+1勺',m:[27,10,3]},
  {n:'1全蛋+3蛋白',a:'',m:[14,1,6]}
];
var ADD_BF=[{n:'蓝莓',a:'80g',m:[0,10,0]},{n:'一小把混合坚果',a:'15g',m:[3,3,8]},{n:'圣女果',a:'100g',m:[1,4,0]}];
var CARB_MAIN=[
  {n:'糙米饭',a:{l:'半碗',m:'1碗',h:'1.5碗'},p:{l:[2,18,0.5],m:[3,35,1],h:[5,53,1]}},
  {n:'红薯',a:{l:'100g',m:'180g',h:'250g'},p:{l:[1,20,0.1],m:[3,36,0.2],h:[4,50,0.3]}},
  {n:'紫薯',a:{l:'100g',m:'180g',h:'250g'},p:{l:[1,20,0.1],m:[3,36,0.2],h:[4,50,0.3]}},
  {n:'藜麦饭',a:{l:'半碗',m:'1碗',h:'1.4碗'},p:{l:[3,16,1.5],m:[6,30,3],h:[9,42,4]}},
  {n:'全麦意面',a:{l:'40g干',m:'70g干',h:'95g干'},p:{l:[5,30,1],m:[9,52,2],h:[12,71,2]}}
];
var PROT=[
  {n:'烤/煎鸡胸',a:'150g',m:[34,0,4]},
  {n:'吞拿鱼罐头(水浸)',a:'1罐 80g',m:[21,0,1]},
  {n:'沙丁鱼罐头(茄汁)',a:'1罐',m:[20,0,11]},
  {n:'白灼虾',a:'120g',m:[24,0,2]},
  {n:'瘦牛肉',a:'130g',m:[33,0,7]},
  {n:'天贝 tempeh(煎)',a:'100g',m:[19,9,11]},
  {n:'水煮蛋+鸡胸',a:'2蛋+100g',m:[35,1,14]}
];
var BEAN=[
  {n:'鹰嘴豆(沥干)',a:'半罐 120g',m:[11,26,4]},
  {n:'红腰豆(沥干)',a:'半罐 120g',m:[10,24,1]},
  {n:'低脂茄汁豆',a:'半罐 160g',m:[8,32,1]}
];
var VEG=['西兰花','生菜+番茄','炒菠菜','彩椒+口蘑','空心菜 kangkung','清炒芥兰','黄瓜+番茄沙拉','杂菜沙拉'];
var FAT=[{n:'牛油果',a:'1/4个',m:[1,3,7]},{n:'混合坚果',a:'20g',m:[3,4,11]},{n:'南瓜子',a:'15g',m:[4,2,7]}];

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pick2(a){var i=Math.floor(Math.random()*a.length),j;do{j=Math.floor(Math.random()*a.length);}while(j===i&&a.length>1);return [a[i],a[j]];}
function add(t,m){t[0]+=m[0];t[1]+=m[1];t[2]+=m[2];}

/* 碳水日序列（配合2周计划 D1–D10） */
var CARB_DAYS=['l','m','l','l','h','m','l','l','m','l'];
var WD=['周一','周二','周三','周四','周五','周六','周日','周一','周二','周三'];
var CN={l:'低碳',m:'中碳',h:'高碳'};

function genDay(di){
  var cd=CARB_DAYS[di];
  var tot=[0,0,0]; var meals=[];
  if(cd==='l'){
    // 低碳 2顿
    var pb=pick(PROT_BF), bn=pick(BEAN), ft=pick(FAT), v1=pick(VEG);
    add(tot,pb.m);add(tot,bn.m);add(tot,ft.m);
    meals.push({t:'13:00',nm:'开窗第一顿',items:[[pb.n,pb.a],[bn.n,bn.a],[ft.n,ft.a],['蔬菜：'+v1,'管饱',1]],tip:'碳水主要来自豆，蛋白+好脂肪扛饿。'});
    var pr=pick(PROT), cm=pick(CARB_MAIN), vs=pick2(VEG);
    add(tot,pr.m);add(tot,cm.p.l);add(tot,[0,0,10]);
    meals.push({t:'19:00',nm:'晚餐',items:[[pr.n,pr.a],[cm.n+'(少量)',cm.a.l],['蔬菜：'+vs[0]+' + '+vs[1],'两大把',1],['橄榄油','1勺']],tip:'碳水收尾少放，蛋白管够、蔬菜堆满。'});
  }else{
    var lvl=cd; // 'm' or 'h'
    var cb=pick(CARB_BF), pb=pick(PROT_BF), ab=pick(ADD_BF);
    add(tot,cb.p[lvl]);add(tot,pb.m);add(tot,ab.m);
    meals.push({t:'12:00',nm:'开窗第一顿',items:[[cb.n,cb.a[lvl]],[pb.n,pb.a],[ab.n,ab.a]],tip:'开窗先补碳水+蛋白，把训练能量垫上。'});
    var cm1=pick(CARB_MAIN), pr1=pick(PROT), vs1=pick2(VEG);
    add(tot,cm1.p[lvl]);add(tot,pr1.m);add(tot,[0,0,10]);
    meals.push({t:'15:30',nm:(lvl==='h'?'练前/练后':'午后正餐'),items:[[cm1.n,cm1.a[lvl]],[pr1.n,pr1.a],['蔬菜：'+vs1[0]+' + '+vs1[1],'两大把',1],['橄榄油','1勺']],tip:'训练前后这一顿碳水给足，蛋白补肌。'});
    var cm2=pick(CARB_MAIN), pr2, vs2=pick2(VEG);
    do{pr2=pick(PROT);}while(pr2.n===pr1.n);
    var d2=(lvl==='h'?'m':'l');
    add(tot,cm2.p[d2]);add(tot,pr2.m);
    var ex=(lvl==='h'?pick(FAT):null); if(ex)add(tot,ex.m);
    var it3=[[cm2.n,cm2.a[d2]],[pr2.n,pr2.a],['蔬菜：'+vs2[0]+' + '+vs2[1],'两大把',1]]; if(ex)it3.push([ex.n,ex.a]);
    meals.push({t:'19:30',nm:'晚餐(收尾)',items:it3,tip:'晚上碳水比中午略降，蛋白蔬菜照旧。'});
  }
  return {cd:cd,tot:tot,meals:meals};
}

function fmt(n){return (Math.round(n*10)/10).toString();}
function render(){
  var html='';
  for(var i=0;i<10;i++){
    var d=genDay(i), cd=d.cd;
    var win=(cd==='l'?'13:00–20:00 · 2顿':'12:00–20:00 · 3顿');
    html+='<div class="day"><div class="dh"><span class="dbadge '+cd+'">D'+(i+1)+'</span><span class="wd">'+WD[i]+'</span><span class="ctag '+cd+'">'+CN[cd]+'</span><span class="win">'+win+'</span></div>';
    html+='<div class="dtot">全天约 <b class="tp">蛋白 '+fmt(d.tot[0])+'</b> · <b class="tc">碳水 '+fmt(d.tot[1])+'</b> · <b class="tf">脂肪 '+fmt(d.tot[2])+'</b> g</div>';
    d.meals.forEach(function(m){
      html+='<div class="meal"><div class="mhd"><span class="mt">'+m.t+'</span><span class="mnm">'+m.nm+'</span></div>';
      m.items.forEach(function(it){
        html+='<div class="mitem"><span class="fn'+(it[2]?' ':'')+'">'+(it[2]?'<span class="veg">'+it[0]+'</span>':'<b>'+it[0]+'</b>')+'</span><span class="amt">'+it[1]+'</span></div>';
      });
      html+='<div class="mtip">'+m.tip+'</div></div>';
    });
    html+='</div>';
  }
  document.getElementById('days').innerHTML=html;
}
document.getElementById('reroll').onclick=render;
document.getElementById('reroll2').onclick=render;
render();
</script></body></html>
