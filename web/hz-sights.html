var DATA=[{"id":"hz-duanqiao","zh":"断桥残雪 · 白堤","en":"Broken Bridge & Bai Causeway","cat":"地标","area":"西湖 · 北山街","addr":"杭州市西湖区北山街断桥（白堤东端）","transit":"地铁 1 号线龙翔桥站，沿湖步行约 20 分钟；或公交 7 路 / 西湖环线到断桥站","hours":"全天开放","price":"免费","dur":"1 小时（白堤走到孤山）","desc":"断桥是西湖十景\"断桥残雪\"所在，也是《白蛇传》许仙白娘子相会的地方。从断桥往西就是白堤，一路桃柳夹岸通到孤山，是看西湖最经典的一段。","tips":"白天人非常多，清晨 7 点前或傍晚去人少、光线也好；从断桥 → 白堤 → 平湖秋月 → 孤山可以连成一条散步线。11 月下旬北山街梧桐变黄，很出片。","q":"断桥残雪","src":"https://touch.travel.qunar.com/poi/711444","warn":"","rate":3,"photo":"Huanglong & Broken Bridge - Hangzhou City & West Lake near Broken Bridge.jpg","been":false,"go":""},{"id":"hz-santan","zh":"三潭印月（小瀛洲）","en":"Three Pools Mirroring the Moon","cat":"地标","area":"西湖 · 湖心","addr":"杭州市西湖区西湖湖心（小瀛洲岛）","transit":"只能坐西湖游船上岛：湖滨、中山公园、岳庙、花港等码头都有船","hours":"约 8:00–17:00（随游船班次，以官方为准）","price":"休闲船往返 + 登岛 ¥55（含登岛门票 ¥20），新能源船 / 画舫 ¥70（以官方为准）","dur":"1.5–2 小时（含坐船）","desc":"西湖最大的湖心岛，\"湖中有岛、岛中有湖\"，九曲桥、亭阁和水面层层相套。岛南湖中三座石塔就是一元人民币背面的图案，西湖十景之一。","tips":"上岛后在岛南\"我心相印亭\"一带看三座石塔，拿出一元纸币对照拍照；凭票可以从任意上岛码头离开，适合顺路换去另一侧湖岸。","q":"三潭印月","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-01/27/content_8850502.htm","warn":"","rate":3,"photo":"Three Pools Mirroring the Moon 01 2020-04.jpg","been":false,"go":""},{"id":"hz-leifeng","zh":"雷峰塔","en":"Leifeng Pagoda","cat":"地标","area":"西湖 · 南山路","addr":"杭州市西湖区南山路 15 号","transit":"公交 4 路 / 西湖环线到苏堤南口（雷峰塔）站，步行 3 分钟；周末可坐太子湾接驳线","hours":"11/1–次年 3/15：8:00–17:30（17:00 停止售票）；夏季延长到约 20:00（以官方为准）","price":"¥40（以官方为准）","dur":"1–1.5 小时","desc":"《白蛇传》中镇压白娘子的那座塔，2002 年在遗址上重建，塔底保留了原塔砖石遗迹和地宫出土文物展。登顶可 360° 俯瞰西湖。","tips":"11 月下旬杭州约 17:00 日落，16:00 左右上塔能赶上夕照（\"雷峰夕照\"是西湖十景）；冬季 17:30 就关门，别去太晚。对面就是净慈寺。","q":"雷峰塔","src":"https://you.ctrip.com/sight/hangzhou14/2033.html","warn":"","rate":3,"photo":"Leifeng Pagoda (20240729).jpg","been":false,"go":""},{"id":"hz-liangzhu-park","zh":"良渚古城遗址公园","en":"Archaeological Ruins of Liangzhu City","cat":"地标","area":"余杭 · 良渚","addr":"杭州市余杭区瓶窑镇（良渚古城遗址公园游客中心）","transit":"地铁2号线良渚站，换乘公交或打车约20分钟（以导航为准）","hours":"9:00–17:00（16:00停止入园）（以官方为准）","price":"成人约 ¥60，观光车另计；需在官方公众号/小程序预约（以官方为准）","dur":"2–3 小时","desc":"2019年列入世界遗产的五千年前良渚古城遗址，是实证中华五千年文明的重要遗址。园区以草坪、水田和标识展示宫殿台基、城墙与水利系统，开阔适合骑行或乘观光车。","tips":"建议先看良渚博物院再进园，理解会深很多；园区大且少遮阴，带水防晒，可租自行车。","q":"良渚古城遗址公园","src":"https://hznews.hangzhou.com.cn/chengshi/content/2019-07/07/content_7223192_0.htm","warn":"","rate":3,"photo":"Liangzhu Archaeological Site, 2021-10-07 05.jpg","been":false,"go":""},{"id":"hz-cbd-lightshow","zh":"钱江新城灯光秀 · 城市阳台","en":"Qianjiang New Town Light Show & City Balcony","cat":"地标","area":"上城 · 钱江新城","addr":"杭州市上城区钱江新城城市阳台（钱塘江北岸）","transit":"地铁4号线市民中心站K/L口，步行约5–10分钟（以导航为准）","hours":"2026年11月–2027年2月「冬」主题灯光秀：周五、周六 18:30、19:30 各一场；周日至周四 19:30 一场（恶劣天气可能暂停）","price":"免费","dur":"1 小时","desc":"钱塘江畔沿岸数十栋高楼外立面组成巨幕，上演主题灯光秀，与“日月同辉”的杭州大剧院、国际会议中心同框。城市阳台是正面最佳观赏点，也是杭州最现代的一面。","tips":"周五、周六人最多，提前20分钟占江边位置；江风大，冬季注意保暖。","q":"城市阳台","src":"https://hznews.hangzhou.com.cn/chengshi/content/2026-11/10/content_9369212.htm","warn":"","rate":3,"photo":"Hangzhou Urban Balcony, Zhejiang.jpg","been":false,"go":""},{"id":"hz-gongchen","zh":"拱宸桥 · 桥西历史街区","en":"Gongchen Bridge & Qiaoxi Historic Block","cat":"街区","area":"拱墅 · 运河","addr":"杭州市拱墅区桥弄街 / 桥西直街（拱宸桥两侧）","transit":"地铁5号线拱宸桥东站，步行约10分钟（以导航为准）；也可坐运河水上巴士到拱宸桥码头","hours":"街区全天开放；沿街店铺约白天至晚间营业（以官方为准）","price":"免费","dur":"1.5–2 小时","desc":"拱宸桥是京杭大运河杭州段最高最长的三孔石拱桥，被视为大运河南端终点的标志。桥西直街保留了清末民初的沿河民居、老字号和茶馆，周边集中了刀剪剑、扇、伞等工艺博物馆。","tips":"傍晚到桥上看运河落日，再沿桥西直街慢逛；可与大运河博物馆、手工艺活态馆、小河直街串成半日运河线。","q":"拱宸桥","src":"https://hznews.hangzhou.com.cn/chengshi/content/2018-10/29/content_7088433_0.htm","warn":"","rate":3,"photo":"Gongchen Bridge 02 2013-07.JPG","been":false,"go":""},{"id":"hz-lingyin","zh":"灵隐寺 · 飞来峰","en":"Lingyin Temple & Feilai Peak","cat":"宗教建筑","area":"西湖 · 灵隐","addr":"杭州市西湖区灵隐路法云弄 1 号","transit":"公交 7 路 / 游 2 路到灵隐站；或地铁 1/2 号线凤起路站、3 号线黄龙洞站换乘景区接驳公交","hours":"7:30–17:30（17:00 停止入园）","price":"免费（自 2025-12-01 起取消 ¥45 门票和 ¥30 香花券），需实名预约","dur":"2–3 小时","desc":"杭州最有名的千年古刹，东晋时印度僧人慧理开山。寺前的飞来峰石壁上有 300 多尊五代至元代的摩崖石刻造像，景区内还有永福寺、韬光寺等，可一路往北高峰爬。","tips":"须在支付宝 / 微信「杭州灵隐飞来峰」小程序提前 1–7 天实名预约（分上午、下午场，不接受当日预约），入园带预约用的身份证原件；周末名额紧，尽量工作日早上去。","q":"灵隐寺","src":"https://tidenews.com.cn/news.html?id=3303249","warn":"","rate":3,"photo":"Lingyin Temple, Hangzhou 20161003.jpg","been":false,"go":""},{"id":"hz-liangzhu-museum","zh":"良渚博物院","en":"Liangzhu Museum","cat":"博物馆","area":"余杭 · 良渚","addr":"杭州市余杭区美丽洲路1号","transit":"地铁2号线良渚站，换乘公交或打车约10分钟（以导航为准）","hours":"周二至周日 9:00–17:00（16:30停止入馆），周一闭馆（法定节假日除外）（以官方为准）","price":"免费，需提前在「良渚博物院」公众号预约（以官方为准）","dur":"1.5–2 小时","desc":"英国建筑师戴卫·奇普菲尔德设计的极简石材建筑，收藏大量良渚玉琮、玉钺等精美玉器。展陈清晰地讲述良渚文明的社会、信仰与水利工程。","tips":"镇馆之宝“玉琮王”前人多，可先看再逛其他展厅；与遗址公园同一天游览最顺。","q":"良渚博物院","src":"https://www.chinaservicesinfo.com/s/202502/07/WS67a5dd10498eec7e1f72ea93/liangzhu-museum.html","warn":"","rate":3,"photo":"Hangzhou Liangzhu Museum 2015.08.02 15-38-25.jpg","been":false,"go":""},{"id":"hz-sudi","zh":"苏堤春晓","en":"Su Causeway","cat":"公园自然","area":"西湖 · 苏堤","addr":"杭州市西湖区苏堤（南起南山路苏堤南口，北至北山街）","transit":"南口：公交 4 路 / 西湖环线到苏堤南口（雷峰塔）站；北口：公交 7 路到岳庙站，步行 5 分钟","hours":"全天开放","price":"免费","dur":"1–1.5 小时（全程约 2.8 公里）","desc":"苏东坡任杭州知州时疏浚西湖、用淤泥筑成的长堤，南北贯穿西湖，堤上有六座拱桥。两边是外西湖和西里湖，走在堤上能同时看到雷峰塔、保俶塔和群山。","tips":"全程步行约 40–60 分钟，可从南口（雷峰塔、花港观鱼）走到北口（曲院风荷、岳庙），顺路串景点；春天桃柳最美，11 月下旬秋叶也不错。","q":"苏堤","src":"https://hznews.hangzhou.com.cn/chengshi/content/2023-03/10/content_8488620_0.htm","warn":"","rate":3,"photo":"Su Causeway.JPG","been":false,"go":""},{"id":"hz-gushan","zh":"孤山 · 中山公园","en":"Solitary Hill & Zhongshan Park","cat":"公园自然","area":"西湖 · 孤山","addr":"杭州市西湖区孤山路 27 号（中山公园）","transit":"公交 7 路到岳庙站或断桥站，步行 10–15 分钟；也可坐游船到中山公园码头","hours":"全天开放","price":"免费","dur":"1.5–2 小时","desc":"孤山是西湖中唯一的天然岛屿，山上山下集中了中山公园（清代行宫遗址）、西泠印社、浙江省博物馆孤山馆区、文澜阁、放鹤亭等。是一个可以慢慢逛半天的人文小岛。","tips":"从白堤进、西泠桥出（或反过来），顺路看西泠印社、浙博和秋瑾墓；孤山北麓的放鹤亭一带人少，适合坐着看北里湖。","q":"孤山","src":"https://gs.ctrip.com/html5/you/sight/14/4337.html","warn":"","rate":3,"photo":"Gushan Park.jpg","been":false,"go":""},{"id":"hz-xixi","zh":"西溪国家湿地公园","en":"Xixi National Wetland Park","cat":"公园自然","area":"西湖 / 余杭 · 西溪","addr":"杭州市西湖区天目山路518号（周家村主入口）（以官方为准）","transit":"地铁5号线蒋村站（近北门）、浙大紫金港站（近西门）；周家村主入口可乘公交至「西溪湿地周家村」站（以导航为准）","hours":"夏令时（4/1–10/31）8:00–18:30；冬令时（11/1–3/31）8:00–18:00（以官方为准）","price":"门票 ¥80（常见网购价 ¥70）；电瓶船、摇橹船另计（以官方为准）","dur":"半天","desc":"城市中的国家湿地公园，河港、池塘、芦苇和柿树交织，是电影《非诚勿扰》取景地。秋冬可看芦花和柿子，坐摇橹船穿行水道最有江南水乡味道。","tips":"园区很大，建议买门票+电瓶船套票再步行深处；初冬（11–12月）芦花和红柿正当时。","q":"西溪国家湿地公园","src":"https://gs.ctrip.com/html5/you/sight/Hangzhou14/1410601.html","warn":"","rate":3,"photo":"Xixi Wetland Park, Hangzhou, China.jpg","been":false,"go":""},{"id":"hz-baoshi","zh":"宝石山 · 保俶塔","en":"Baoshi Hill & Baochu Pagoda","cat":"徒步","area":"西湖 · 北山街","addr":"杭州市西湖区北山街（保俶路口 / 断桥对面登山口）","transit":"公交 7 路 / 西湖环线到断桥站或少年宫站，步行 5 分钟到登山口；或地铁 3 号线黄龙洞站从北侧上山","hours":"全天开放","price":"免费","dur":"1–1.5 小时","desc":"西湖北岸的小山，山脊上细长的保俶塔是西湖天际线的标志。半小时就能爬到山顶的蛤蟆峰、初阳台，从高处看断桥、白堤和整个西湖。","tips":"日出、日落都适合上山，初阳台是杭州看日出的老地方；下山可沿山脊走到葛岭抱朴道院，再从北山街下来。山顶岩石光滑，穿防滑鞋。","q":"宝石山","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-08/02/content_9052255_2.htm","warn":"","rate":3,"photo":"Baochu Pagoda with Hangzhou Skyline.jpg","been":false,"go":""},{"id":"hz-jiuxi","zh":"九溪烟树 · 九溪十八涧","en":"Nine Creeks in Misty Forest","cat":"徒步","area":"西湖 · 九溪","addr":"杭州市西湖区九溪路（之江路九溪口 至 龙井路杨梅岭）","transit":"地铁 4 号线水澄桥站换乘公交 4 路 / 504 / 游 5 路到九溪站（以实时公交为准）","hours":"全天开放","price":"免费","dur":"2–3 小时","desc":"一条沿溪流的林间步道，九条小溪在山谷里汇流，路上要多次踩着石墩过溪，两旁是茶园和古树。\"九溪烟树\"是新西湖十景之一。","tips":"11 月下旬是九溪红枫、枫杨变色的季节，是西湖秋色最好的地方之一；周末人多，尽量工作日早上去。从九溪口往上走到龙井村，或倒过来往下走都可以。","q":"九溪烟树","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-06/30/content_9028096_0.htm","warn":"","rate":3,"photo":"China Hangzhou Nine Greeks Meandering Through a Misty Forest.JPG","been":false,"go":""},{"id":"hz-wuzhen","zh":"乌镇（西栅 / 东栅）","en":"Wuzhen Water Town (Xizha / Dongzha)","cat":"周边一日","area":"桐乡 · 乌镇（杭州约1–1.5小时）","addr":"嘉兴市桐乡市乌镇镇","transit":"杭州东站乘高铁至桐乡站约20–30分钟，换乘K282公交至乌镇（约1小时）；也可从杭州乘直达乌镇的长途大巴（以导航为准）","hours":"西栅可夜游至晚间；东栅以白天游览为主（以官方为准）","price":"西栅 ¥150；东栅 ¥110（以官方为准）","dur":"1 天（西栅建议住一晚）","desc":"江南六大古镇之一，东栅保留原住民生活气息，西栅经整体保护开发，夜景灯光倒映水巷尤其迷人。木心美术馆、昭明书院、蓝印花布作坊都值得一看。","tips":"只能选一个就去西栅并留到天黑看夜景；住在西栅内的民宿可多次进出景区。","q":"乌镇西栅","src":"https://gs.ctrip.com/html5/you/sight/tongxiang220/16170.html","warn":"","rate":3,"photo":"Wuzhen Xizha 2009-04.jpg","been":false,"go":""},{"id":"hz-pinghu","zh":"平湖秋月","en":"Autumn Moon over the Calm Lake","cat":"地标","area":"西湖 · 孤山","addr":"杭州市西湖区孤山路（白堤西端）","transit":"公交 7 路 / 西湖环线到断桥站，沿白堤步行约 15 分钟","hours":"全天开放","price":"免费","dur":"20–30 分钟","desc":"西湖十景之一，位于白堤西端、孤山东南角，临水平台视野开阔，可远眺湖面和城市天际线。以秋夜赏月著称，御碑亭里有康熙题字。","tips":"通常和断桥、白堤、孤山一起走，不必专程；傍晚看湖上落日和对岸亮灯很美。","q":"平湖秋月","src":"https://touch.travel.qunar.com/poi/711444","warn":"","rate":2,"photo":"Autumn Moon Over the Calm Lake.jpg","been":false,"go":""},{"id":"hz-boat","zh":"西湖游船","en":"West Lake Boat Cruise","cat":"地标","area":"西湖 · 全湖","addr":"杭州市西湖区湖滨路（湖滨码头），另有中山公园、岳庙、花港、钱王祠等码头","transit":"地铁 1 号线龙翔桥站，步行约 10 分钟到湖滨码头","hours":"白天运营，约 8:00–17:00（以码头公示为准）","price":"休闲船登三潭印月 ¥55，新能源船 / 画舫 ¥70；手划船按船按时计价（以码头公示为准）","dur":"1–2 小时","desc":"坐船是看西湖全景最省力的方式，大船通常都会停靠三潭印月让游客上岛。也可以在岸边码头包一条手划船，慢慢摇过苏堤和湖心。","tips":"官方游船只认正规码头，别跟岸边拉客的\"私船\"走；手划船价格上船前问清楚按船还是按人、多长时间。","q":"西湖游船湖滨码头","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-01/27/content_8850502.htm","warn":"","rate":2,"photo":"West Lake Boat Hangzhou City.jpg","been":false,"go":""},{"id":"hz-liuhe","zh":"六和塔","en":"Liuhe Pagoda","cat":"地标","area":"西湖 · 钱塘江边","addr":"杭州市西湖区之江路 16 号","transit":"地铁 4 号线水澄桥站换乘公交 4 路 / 504 路到六和塔站（以实时公交为准）","hours":"约 7:00–17:30（冬季提前关门，以官方为准）","price":"入园 ¥20，登塔另收费（以官方为准）","dur":"1 小时","desc":"建于北宋的砖木古塔，矗立在钱塘江北岸月轮山上，原为镇压江潮而建，高约 60 米。登塔可俯瞰钱塘江和钱塘江大桥。","tips":"登塔需单独购票并安检；塔下的中华古塔博览苑展示各地名塔模型，顺便看看。","q":"六和塔","src":"https://gs.ctrip.com/html5/you/sight/hangzhou14/2039.html","warn":"","rate":2,"photo":"Hangzhou Liuhe Pagoda 20161004.jpg","been":false,"go":""},{"id":"hz-fountain","zh":"西湖音乐喷泉","en":"West Lake Musical Fountain","cat":"地标","area":"西湖 · 湖滨","addr":"杭州市上城区湖滨路湖滨三公园一带湖面","transit":"地铁 1 号线龙翔桥站，步行约 5 分钟","hours":"每晚 19:30 一场（秋冬季安排至 2027-04-14；大风暴雨等天气取消）","price":"免费","dur":"30 分钟","desc":"湖滨三公园前湖面上的大型音乐喷泉，配合灯光随音乐起舞，是西湖夜景的保留节目。","tips":"19:00 左右到湖滨三公园岸边占位，前排视野最好；看完可在湖滨步行街吃饭。","q":"西湖音乐喷泉","src":"https://hznews.hangzhou.com.cn/chengshi/content/2026-10/11/content_9333325.htm","warn":"","rate":2,"photo":"2014.11.21.193209 Musical Fountain Show Xihu Hangzhou.jpg","been":false,"go":""},{"id":"hz-chenghuangge","zh":"吴山天风 · 城隍阁","en":"Chenghuang Pavilion, Wushan Hill","cat":"地标","area":"西湖 · 吴山","addr":"杭州市上城区吴山 3 号（城隍阁）","transit":"地铁 7 号线吴山广场站，步行上山约 15 分钟","hours":"8:00–20:00（18:30 停止售票）（以官方为准）","price":"吴山免费；城隍阁 ¥30（以官方为准）","dur":"1–1.5 小时","desc":"吴山是伸入城区的西湖群山余脉，\"吴山天风\"为新西湖十景之一。山顶城隍阁高 7 层，可一边看西湖、一边看杭州城区和钱塘江。","tips":"傍晚上城隍阁看西湖日落和城市亮灯最美；下山就是河坊街、南宋御街，可以连着逛。","q":"城隍阁","src":"https://gs.ctrip.com/html5/you/sight/hangzhou14/2027.html","warn":"","rate":2,"photo":"Chenghuangmiao (City God Pavilion), Hangzhou(2568).jpg","been":false,"go":""},{"id":"hz-canal-waterbus","zh":"运河水上巴士","en":"Grand Canal Water Bus","cat":"地标","area":"拱墅 · 运河","addr":"武林门码头（杭州市拱墅区环城北路一带）— 拱宸桥码头","transit":"地铁1/2号线武林门站附近的武林门码头上船（以导航为准）","hours":"每日约38班，部分为武林门—拱宸桥区间班次；时刻以「水上巴士」小程序为准","price":"¥3 / 人次","dur":"单程约 40–60 分钟（以官方为准）","desc":"杭州独有的运河公交船，沿京杭大运河连接武林门、信义坊（小河直街）与拱宸桥，3元就能体验运河两岸风光。周末节假日会加派旅游船。","tips":"周末高峰武林门、拱宸桥码头排队较长，建议工作日乘坐；单程坐船、回程地铁最省时间。","q":"武林门码头","src":"https://hznews.hangzhou.com.cn/chengshi/content/2026-10/09/content_9330471.htm","warn":"","rate":2,"photo":"杭州. 运河水上巴士 （小河直街） - panoramio.jpg","been":false,"go":""},{"id":"hz-huxueyan","zh":"胡雪岩故居","en":"Former Residence of Hu Xueyan","cat":"地标","area":"上城 · 河坊街","addr":"杭州市上城区元宝街18号","transit":"地铁1号线定安路站或7号线吴山广场站，步行约10分钟（以导航为准）","hours":"约 8:00–17:00（各平台说法不一，约16:45停止入场）（以官方为准）","price":"成人 ¥20；需网上预约购票（以官方为准）","dur":"1 小时","desc":"晚清“红顶商人”胡雪岩的豪宅，被称为“清末中国巨商第一豪宅”。亭台楼阁、假山回廊精巧繁复，中西合璧的建筑细节和园林布局都很值得细看。","tips":"上午开门时人少，拍园林更清净；离胡庆余堂和河坊街步行几分钟，可串联游览。","q":"胡雪岩故居","src":"https://www.dahepiao.com/lvyounews1/20250925531774.html","warn":"","rate":2,"photo":"Former Residence of Hu Xueyan 20240729 134636.jpg","been":false,"go":""},{"id":"hz-caa-xiangshan","zh":"中国美术学院象山校区","en":"China Academy of Art, Xiangshan Campus","cat":"地标","area":"西湖 · 转塘","addr":"杭州市西湖区转塘街道象山路（中国美术学院象山校区）（以导航为准）","transit":"地铁6号线中国美院象山校区站（站名及出口以导航为准）","hours":"校园：双休日、节假日 8:00–20:00，需提前一天通过「微国美」预约，寒暑假暂停申请；校内博物馆周二至周日 9:30–16:30（以官方为准）","price":"入校免费；中国国际设计博物馆 ¥20（2023年资料）（以官方为准）","dur":"2 小时","desc":"普利兹克奖得主王澍设计的校园，用回收旧砖瓦砌出的建筑与山水、田地相融，是建筑迷的朝圣地。校内还有隈研吾设计的民艺博物馆和西扎设计的中国国际设计博物馆。","tips":"务必提前预约入校；每年6月毕业展期间通常免费开放，人多但很热闹。","q":"中国美术学院象山校区","src":"https://hznews.hangzhou.com.cn/chengshi/content/2023-10/23/content_8632868.htm","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"hz-hubin","zh":"湖滨步行街","en":"Hubin Pedestrian Street","cat":"街区","area":"西湖 · 湖滨","addr":"杭州市上城区湖滨路 / 东坡路一带（湖滨银泰 in77 周边）","transit":"地铁 1 号线龙翔桥站，出站即到","hours":"全天开放（商铺约 10:00–22:00）","price":"免费","dur":"1–2 小时","desc":"紧挨西湖东岸的商业步行区，湖滨路沿湖一侧是步行道和音乐喷泉，背后是湖滨银泰 in77 等商场和各种品牌店、餐厅。是逛完西湖吃饭购物最方便的地方。","tips":"晚上 19:30 看完湖滨音乐喷泉可以就近吃饭；周末和节假日晚上人流极大，注意看管随身物品。","q":"湖滨步行街","src":"https://hznews.hangzhou.com.cn/chengshi/content/2026-10/11/content_9333325.htm","warn":"","rate":2,"photo":"201810 Hubin Intime Mall Section A&D.jpg","been":false,"go":""},{"id":"hz-xiaohe","zh":"小河直街","en":"Xiaohe Street Historic Block","cat":"街区","area":"拱墅 · 运河","addr":"杭州市拱墅区小河直街（大运河、小河、余杭塘河三河交汇处）","transit":"运河水上巴士信义坊码头下船步行约10分钟；或公交至长征桥站（以导航为准）","hours":"街区全天开放","price":"免费","dur":"1 小时","desc":"清末民国风貌的运河老街，白墙黛瓦的两层木屋沿河排开，至今仍有居民生活。比河坊街安静，咖啡馆、小店和河边长廊很适合拍照散步。","tips":"早上或傍晚人少、光线好；可从这里坐水上巴士北上拱宸桥。","q":"小河直街历史文化街区","src":"https://hznews.hangzhou.com.cn/chengshi/content/2020-05/17/content_7735918_0.htm","warn":"","rate":2,"photo":"20250211 Xiaohe Zhijie.jpg","been":false,"go":""},{"id":"hz-hefang","zh":"河坊街 · 清河坊","en":"Hefang Street (Qinghefang)","cat":"街区","area":"上城 · 吴山","addr":"杭州市上城区河坊街","transit":"地铁7号线吴山广场站或1号线定安路站，步行约10分钟（以导航为准）","hours":"街区全天开放；店铺多营业至晚间","price":"免费","dur":"1–2 小时","desc":"吴山脚下的仿古商业步行街，汇集胡庆余堂、方回春堂、王星记扇子等老字号和各类杭州小吃。商业化较重，但仍是游客体验老杭州市井气息的热门一站。","tips":"小吃价格偏游客化，伴手礼可货比三家；北侧高银街是吃杭帮菜的好去处，南侧可上吴山城隍阁。","q":"河坊街","src":"https://gs.ctrip.com/html5/you/sight/hangzhou14/4079.html","warn":"","rate":2,"photo":"Hefang Street, Hangzhou.jpg","been":false,"go":""},{"id":"hz-yujie","zh":"南宋御街","en":"Southern Song Imperial Street","cat":"街区","area":"上城 · 中山中路","addr":"杭州市上城区中山中路（鼓楼至西湖大道段）","transit":"地铁1号线定安路站，步行约5分钟（以导航为准）","hours":"街区全天开放","price":"免费","dur":"1 小时","desc":"南宋临安城的皇城御道所在，如今是中山中路历史街区，沿街有老建筑、玻璃罩下的御街遗址和不少老字号。与河坊街十字相交，可一并游览。","tips":"留意路面玻璃展示的南宋路基遗迹；晚上灯笼亮起后更有氛围。","q":"南宋御街","src":"https://gs.ctrip.com/html5/you/sight/hangzhou14/4079.html","warn":"","rate":2,"photo":"Southern Song Imperial Street, Hangzhou.jpg","been":false,"go":""},{"id":"hz-shenglihe","zh":"胜利河美食街","en":"Shengli River Food Street","cat":"美食夜市","area":"拱墅 · 运河","addr":"杭州市拱墅区霞湾巷（胜利河北岸，又称古水街）","transit":"地铁3号线香积寺站D口，步行约500米（以导航为准）","hours":"各店营业时间不一，晚餐和夜宵时段最热闹（以官方为准）","price":"免费进入（人均约 ¥60–120 视店而定）（以官方为准）","dur":"1–2 小时","desc":"沿胜利河而建的古风美食街，400多米长的河岸集中了杭帮菜、小龙虾、烧烤、本地小吃等餐馆。夜晚灯笼倒映河面，是本地人吃夜宵的常去地。","tips":"与大兜路、香积寺相邻，可吃饭前先逛运河边；周末晚上热门店要排队。","q":"胜利河美食街","src":"https://m.bendibao.com/show680395.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"hz-dadoulu","zh":"大兜路历史街区","en":"Dadou Road Historic Block","cat":"美食夜市","area":"拱墅 · 运河","addr":"杭州市拱墅区大兜路（香积寺至富义仓一带）","transit":"地铁3号线香积寺站，步行约5–10分钟（以导航为准）","hours":"街区全天开放；餐厅多为午市和晚市（以官方为准）","price":"免费进入","dur":"1–1.5 小时","desc":"运河边的历史街区，北接古税关北新关、南靠“天下粮仓”富义仓，东侧是“运河第一香”香积寺。沿河分布着餐馆、咖啡馆和酒吧，夜景很有味道。","tips":"傍晚先拜访香积寺、看富义仓，再在河边找家餐厅吃晚饭。","q":"大兜路历史街区","src":"https://hznews.hangzhou.com.cn/chengshi/content/2026-08/30/content_9293545_0.htm","warn":"","rate":2,"photo":"杭州. 大兜路历史街区 - panoramio.jpg","been":false,"go":""},{"id":"hz-gaoyin","zh":"高银街美食街","en":"Gaoyin Street Food Street","cat":"美食夜市","area":"上城 · 吴山","addr":"杭州市上城区高银街（河坊街北侧，吴山脚下）","transit":"地铁7号线吴山广场站或1号线定安路站，步行约5–10分钟（以导航为准）","hours":"各店营业时间不一（以官方为准）","price":"免费进入（人均约 ¥80–150 视店而定）（以官方为准）","dur":"1–1.5 小时","desc":"与河坊街相通的东西向美食街，两侧杭帮菜馆和小吃店林立，知味观、皇饭儿等老字号都在附近。适合逛完河坊街后来吃西湖醋鱼、东坡肉、片儿川。","tips":"热门老字号饭点排队长，可提前在点评App取号；生煎、小笼等小吃适合边走边吃。","q":"高银街美食街","src":"https://m.bendibao.com/show680395.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"hz-in77","zh":"湖滨银泰in77","en":"Hubin Intime in77","cat":"商场","area":"上城 · 湖滨","addr":"杭州市上城区东坡路7号","transit":"地铁1号线龙翔桥站，步行约3分钟","hours":"约 10:00–22:00（以官方为准）","price":"免费进入","dur":"1–2 小时","desc":"紧挨西湖湖滨的开放式街区商场，由多个区块组成，品牌、餐饮和网红店密集。2026年11月新A3区开业后体量进一步扩大，逛完走几步就是西湖边。","tips":"可与湖滨步行街、音乐喷泉（湖滨三公园）安排在同一晚；餐厅饭点普遍排队，提前取号。","q":"湖滨银泰in77","src":"https://news.qq.com/rain/a/20251101A02PCM00","warn":"","rate":2,"photo":"Hubin INTIME in 77.jpg","been":false,"go":""},{"id":"hz-yuemiao","zh":"岳王庙","en":"Yue Fei Temple","cat":"宗教建筑","area":"西湖 · 北山街","addr":"杭州市西湖区北山街 80 号","transit":"公交 7 路 / 西湖环线到岳庙站即到","hours":"约 7:30–17:30（以官方为准）","price":"¥25（以官方为准）","dur":"45 分钟","desc":"纪念南宋抗金名将岳飞的祠庙和墓园，正殿有岳飞像和\"还我河山\"匾。墓前跪着秦桧夫妇等四人的铁像，是杭州最有名的历史纪念地之一。","tips":"出门就是曲院风荷和苏堤北口，可以连着逛；常和雷峰塔一起出联票，买票前比一比。","q":"岳王庙","src":"https://you.ctrip.com/sight/hangzhou14/2033.html","warn":"","rate":2,"photo":"Entrance gate of the Yue Fei Temple, Hangzhou 2006 18-11.jpg","been":false,"go":""},{"id":"hz-jingci","zh":"净慈寺（南屏晚钟）","en":"Jingci Temple","cat":"宗教建筑","area":"西湖 · 南山路","addr":"杭州市西湖区南山路 56 号","transit":"公交 4 路 / 西湖环线到净寺站或苏堤南口（雷峰塔）站，步行 3 分钟","hours":"约 6:30–17:00（以官方为准）","price":"¥10（含 3 支清香）（以官方为准）","dur":"45 分钟","desc":"与灵隐寺齐名的西湖古刹，就在雷峰塔正对面，是济公出家修行的地方。钟楼里的大钟就是西湖十景\"南屏晚钟\"，现为重铸。","tips":"和雷峰塔隔一条马路，适合连着逛；跨年夜这里有敲钟祈福活动，人会特别多。","q":"净慈寺","src":"https://touch.travel.qunar.com/poi/20957694","warn":"","rate":2,"photo":"Jingci Temple 62963-Hangzhou (49154675903).jpg","been":false,"go":""},{"id":"hz-yongfu","zh":"永福寺 · 韬光寺","en":"Yongfu & Taoguang Temples","cat":"宗教建筑","area":"西湖 · 灵隐","addr":"杭州市西湖区灵隐飞来峰景区内（灵隐寺西侧山坡）","transit":"同灵隐寺：公交 7 路 / 游 2 路到灵隐站，进景区后步行 15–30 分钟","hours":"随灵隐飞来峰景区，7:30–17:30（以官方为准）","price":"免费（含在灵隐飞来峰景区免票范围内），需景区实名预约","dur":"1–1.5 小时","desc":"永福寺依山而建、层层叠叠藏在茶园竹林里，比灵隐寺清静得多；再往上就是唐代古刹韬光寺，\"韬光观海\"可远眺钱塘江。两寺位于灵隐去北高峰的登山路上。","tips":"逛完灵隐寺往西走，永福寺 → 韬光寺 → 北高峰是一条很舒服的半日徒步线；永福寺里的福泉茶院可以坐下喝杯茶。","q":"永福寺","src":"https://www.news.cn/local/20251119/6cc1e4a98a6448249f60cb9727d721bb/c.html","warn":"","rate":2,"photo":"HZ 杭州 Hangzhou 永福寺 Yongfu Temple China Tourism 2012 grand hall facade 08.jpg","been":false,"go":""},{"id":"hz-faxi","zh":"法喜寺（上天竺）","en":"Faxi Temple (Upper Tianzhu)","cat":"宗教建筑","area":"西湖 · 天竺","addr":"杭州市西湖区天竺路上天竺（天竺路尽头）","transit":"从灵隐沿天竺路步行约 30–40 分钟；或公交到上天竺站","hours":"约 6:30–18:00（以官方为准）","price":"¥10（含 3 炷香）（以官方为准）","dur":"45 分钟–1 小时","desc":"天竺三寺中最上方的一座，黄墙黛瓦依山而建，因\"求姻缘灵验\"在年轻人中很火。春天寺内百年玉兰盛开时是最出片的时候。","tips":"法喜寺不在灵隐飞来峰景区免票范围内，需另外购票；11 月没有玉兰，但人比春季少。从法喜寺后山也能上北高峰。","q":"法喜寺","src":"https://touch.travel.qunar.com/poi/8458242","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"hz-xiling","zh":"西泠印社","en":"Xiling Seal Art Society","cat":"博物馆","area":"西湖 · 孤山","addr":"杭州市西湖区孤山路 31 号","transit":"公交 7 路到岳庙站，过西泠桥步行约 10 分钟","hours":"园区白天开放，约 8:30–17:00（以官方为准）","price":"园区免费（以官方为准）","dur":"45 分钟–1 小时","desc":"创立于 1904 年的金石篆刻学术团体，社址依孤山南坡而建，亭台、石刻、印泉层层叠叠，山顶有华严经塔。被称为\"天下第一名社\"，园林本身也很精致。","tips":"爬到山顶题襟馆一带能俯瞰西湖；喜欢篆刻书法的可以逛社内的中国印学博物馆和售卖印石、印泥的门市。","q":"西泠印社","src":"https://touch.travel.qunar.com/poi/7524332","warn":"","rate":2,"photo":"Xiling Seal Art Society 20250505.jpg","been":false,"go":""},{"id":"hz-zjm-gushan","zh":"浙江省博物馆（孤山馆区）","en":"Zhejiang Provincial Museum (Gushan)","cat":"博物馆","area":"西湖 · 孤山","addr":"杭州市西湖区孤山路 25 号","transit":"公交 7 路到断桥站或岳庙站，步行约 15 分钟","hours":"9:00–17:00（16:30 停止入馆），周一闭馆（节假日除外）（以官方为准）","price":"免费，建议提前在「云上浙博」小程序预约（以官方为准）","dur":"1–1.5 小时","desc":"浙博最老的馆区，依孤山而建的园林式展馆，与清代皇家藏书楼文澜阁相邻。藏品以越窑青瓷、漆器、书画等浙江地方文物为特色。","tips":"大型特展多放在之江馆区，孤山馆区规模较小、人少安静，可和孤山散步一起安排；进馆需安检、带身份证。","q":"浙江省博物馆孤山馆区","src":"https://hznews.hangzhou.com.cn/wenti/content/2026-08/05/content_9272763.htm","warn":"","rate":2,"photo":"Zhejiang Provincial Museum, Gushan Branch (17047464005).jpg","been":false,"go":""},{"id":"hz-teamuseum","zh":"中国茶叶博物馆","en":"China National Tea Museum","cat":"博物馆","area":"西湖 · 龙井","addr":"双峰馆区：杭州市西湖区龙井路 88 号；龙井馆区：西湖区翁家山 268 号","transit":"公交 27 路等到双峰站，步行约 5 分钟（以实时公交为准）","hours":"9:00–16:30，周一闭馆（节假日除外）（以官方为准）","price":"免费（以官方为准）","dur":"1–1.5 小时","desc":"全国唯一的茶专题国家级博物馆，分双峰和龙井两个馆区，介绍茶的历史、种类、茶具和饮茶习俗。馆舍散落在茶园里，环境很好。","tips":"推荐双峰馆区，逛完可以沿龙井路往上去龙井村；馆内茶室可以体验泡茶。","q":"中国茶叶博物馆","src":"https://hznews.hangzhou.com.cn/jingji/content/2020-08/26/content_7799859_2.htm","warn":"","rate":2,"photo":"China National Tea Museum 1.jpg","been":false,"go":""},{"id":"hz-silkmuseum","zh":"中国丝绸博物馆","en":"China National Silk Museum","cat":"博物馆","area":"西湖 · 玉皇山","addr":"杭州市西湖区玉皇山路 73-1 号","transit":"公交到丝绸博物馆站或玉皇山站（以实时公交为准）；从雷峰塔打车约 5 分钟","hours":"周二至周日 9:00–17:00；周一半天开放（以官方为准）","price":"免费","dur":"1–1.5 小时","desc":"全国最大的纺织服装类专题博物馆，展出从古代丝织品到历代服饰、时装的大量藏品，还能看到织机和染缬工艺演示。","tips":"服饰馆的历代服装展最好看；周一开放时间各方说法不一，周一去最好先打电话确认（0571-87035150）。","q":"中国丝绸博物馆","src":"https://ct.zj.gov.cn/art/2019/8/5/art_1671969_36385240.html","warn":"","rate":2,"photo":"China Silk Museum, 2017-11-12 01.jpg","been":false,"go":""},{"id":"hz-canal-museum","zh":"中国京杭大运河博物馆","en":"China Grand Canal Museum (Hangzhou)","cat":"博物馆","area":"拱墅 · 运河","addr":"杭州市拱墅区运河文化广场（拱宸桥东侧）","transit":"地铁5号线拱宸桥东站，步行约5–10分钟（以导航为准）","hours":"周二至周日开放，周一闭馆（以官方为准）","price":"免费，需通过官方微信公众号预约（每日限额）（以官方为准）","dur":"1–2 小时","desc":"国内首座以大运河为主题的博物馆，2023年改造提升后重新开放。展陈讲述运河的开凿、漕运、沿岸城市与申遗历程，适合在逛拱宸桥前先了解背景。","tips":"旁边就是运河文化广场和拱宸桥，可连着逛；出发前在公众号确认开放时间与预约名额。","q":"中国京杭大运河博物馆","src":"https://hznews.hangzhou.com.cn/chengshi/content/2023-09/05/content_8612855.htm","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"hz-craft-museums","zh":"手工艺活态馆 · 杭州工艺美术博物馆群","en":"Hangzhou Arts & Crafts Museums (Living Crafts Hall)","cat":"博物馆","area":"拱墅 · 运河","addr":"杭州市拱墅区桥西直街一带（拱宸桥西）","transit":"地铁5号线拱宸桥东站，过拱宸桥步行约10–15分钟（以导航为准）","hours":"约 9:00–17:00，闭馆前30分钟停止入场（以官方为准）","price":"免费（以官方为准）","dur":"1–1.5 小时","desc":"由旧厂房改造的工艺美术博物馆群，包括中国刀剪剑、扇业、伞业博物馆和手工艺活态馆。活态馆里有非遗手艺人现场制作，能看到竹编、刺绣、剪纸等传统工艺。","tips":"活态馆常有体验课（如做扇、拓印），亲子游很合适；周一开放情况不一，出发前确认。","q":"手工艺活态馆","src":"https://www.sohu.com/a/381860662_737778","warn":"","rate":2,"photo":"Hangzhou Arts and Crafts Museum 01 2013-07.JPG","been":false,"go":""},{"id":"hz-huqingyu","zh":"胡庆余堂中药博物馆","en":"Huqingyutang Museum of Traditional Chinese Medicine","cat":"博物馆","area":"上城 · 河坊街","addr":"杭州市上城区大井巷95号","transit":"地铁7号线吴山广场站或1号线定安路站，步行约10分钟（以导航为准）","hours":"8:30–17:00（16:30停止入场）（以官方为准）","price":"约 ¥10–15（第三方平台价）（以官方为准）","dur":"45 分钟–1 小时","desc":"胡雪岩1874年创办的百年药号，与北京同仁堂并称“北有同仁堂，南有庆余堂”。徽派古建筑营业大厅依旧开门售药，“戒欺”匾和中药制作展示很有看头。","tips":"营业大厅可免费进入看抓药，博物馆部分才收费；可在国药号现场体验把脉问诊、买膏方。","q":"胡庆余堂中药博物馆","src":"https://touch.travel.qunar.com/poi/705402","warn":"","rate":2,"photo":"Huqingyutang 7246.jpg","been":false,"go":""},{"id":"hz-hzmuseum","zh":"杭州博物馆","en":"Hangzhou Museum","cat":"博物馆","area":"上城 · 吴山","addr":"杭州市上城区粮道山18号","transit":"地铁7号线吴山广场站，步行约10分钟（以导航为准）","hours":"周二至周日 9:00–16:30（16:00停止入馆），周一闭馆（法定节假日除外）（以官方为准）","price":"免费；周末/节假日可能需小程序预约（以官方为准）","dur":"1–1.5 小时","desc":"位于吴山脚下的市级综合博物馆，系统讲述杭州从史前到近代的城市史。馆藏战国水晶杯是镇馆之宝之一，南宋临安城的展示也很有特色。","tips":"可与河坊街、吴山城隍阁安排在同一天；入馆需带身份证。","q":"杭州博物馆","src":"https://www.dahepiao.com/lvyounews1/20230731406147.html","warn":"","rate":2,"photo":"Hangzhou Museum 01 2018-07.jpg","been":false,"go":""},{"id":"hz-zjmuseum-zhijiang","zh":"浙江省博物馆之江馆区","en":"Zhejiang Provincial Museum (Zhijiang Branch)","cat":"博物馆","area":"西湖 · 之江","addr":"杭州市西湖区之江文化中心（碧波路与文景路交叉口一带）","transit":"地铁6号线枫桦西路站，步行约10分钟（以导航为准）","hours":"周二至周日 9:00–17:00（16:30停止入馆），周一闭馆（逢法定节假日照常开放）","price":"常设展免费；热门特展需在「云上浙博」小程序预约（以官方为准）","dur":"2–3 小时","desc":"2023年开放的浙博新馆，体量宏大，与浙江图书馆、浙江美术馆新馆等组成之江文化中心。河姆渡、良渚文物到越窑青瓷、书画珍品一应俱全，是了解浙江历史文化的首选。","tips":"距离市区较远，建议留出半天；遇大型特展先在小程序查看是否限流预约。","q":"浙江省博物馆之江馆区","src":"https://gs.ctrip.com/html5/you/sight/Hangzhou14/141029950.html","warn":"","rate":2,"photo":"Zhijiang branch, Zhejiang Provincial Museum 20231206114251.jpg","been":false,"go":""},{"id":"hz-huagang","zh":"花港观鱼","en":"Viewing Fish at Flower Pond","cat":"公园自然","area":"西湖 · 苏堤南","addr":"杭州市西湖区西山路（苏堤南端西侧）","transit":"公交 4 路 / 西湖环线到苏堤南口（雷峰塔）站或花港观鱼站，步行 5 分钟","hours":"全天开放","price":"免费","dur":"1 小时","desc":"西湖十景之一，园内红鱼池挤满锦鲤，牡丹园、大草坪和湖边红枫都很出名。和苏堤南口、雷峰塔挨着，交通方便。","tips":"11 月下旬到 12 月初是园内红枫最好的时候，湖边红叶倒影很漂亮；可以从这里上苏堤一路北走。","q":"花港观鱼","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-11/14/content_9123571.htm","warn":"","rate":2,"photo":"Huagang Guanyu.jpg","been":false,"go":""},{"id":"hz-liulang","zh":"柳浪闻莺","en":"Orioles Singing in the Willows","cat":"公园自然","area":"西湖 · 南山路","addr":"杭州市上城区南山路（钱王祠附近）","transit":"地铁 1 号线定安路站，步行约 15 分钟；或公交西湖环线到柳浪闻莺站","hours":"全天开放","price":"免费","dur":"30–45 分钟","desc":"西湖东南岸的大公园，沿湖大片垂柳和草坪，西湖十景之一。旁边是祭祀吴越国王的钱王祠，往南可走到雷峰塔。","tips":"是湖滨走到雷峰塔路上的歇脚点，不必专程；草坪适合野餐，傍晚可看雷峰塔方向的落日。","q":"柳浪闻莺","src":"https://touch.travel.qunar.com/poi/711444","warn":"","rate":2,"photo":"Orioles Singing in the Willows 2025.06.jpg","been":false,"go":""},{"id":"hz-yanggongdi","zh":"杨公堤","en":"Yanggong Causeway","cat":"公园自然","area":"西湖 · 西岸","addr":"杭州市西湖区杨公堤（北起曲院风荷，南至花港）","transit":"公交 Y9 / 西湖环线沿杨公堤行驶（以实时公交为准）；或从苏堤北口步行进入","hours":"全天开放","price":"免费","dur":"1–2 小时","desc":"明代知府杨孟瑛主持修筑的长堤，位于西湖西侧，堤上同样有六座桥。周边的茅家埠、乌龟潭、浴鹄湾是西湖西进后恢复的湿地，芦苇水面比外湖安静很多。","tips":"想避开苏堤白堤的人流就来这里；茅家埠一带 11 月芦苇泛黄、水杉转红，很适合散步拍照。","q":"杨公堤","src":"https://touch.travel.qunar.com/poi/7560585","warn":"","rate":2,"photo":"杨公堤.jpg","been":false,"go":""},{"id":"hz-taiziwan","zh":"太子湾公园","en":"Taiziwan Park","cat":"公园自然","area":"西湖 · 南山路","addr":"杭州市西湖区南山路（苏堤南口、净慈寺西侧）","transit":"公交 4 路 / 西湖环线到苏堤南口（雷峰塔）站，步行约 10 分钟；周末节假日有太子湾接驳线","hours":"全天开放","price":"免费","dur":"1 小时","desc":"依山傍水的自然风景园林，以大草坪、溪流和春季郁金香花展闻名，园中还有一座荷兰风车。秋冬季水杉、银杏和红枫层次丰富，人比春天少很多。","tips":"11 月下旬园内水杉红、银杏黄，是秋色好去处；可以和雷峰塔、净慈寺、花港观鱼一起排成南线半日游。","q":"太子湾公园","src":"https://hznews.hangzhou.com.cn/chengshi/content/2023-03/11/content_8489555.htm","warn":"","rate":2,"photo":"Taiziwan Park 10.jpg","been":false,"go":""},{"id":"hz-guozhuang","zh":"郭庄","en":"Guo's Villa","cat":"公园自然","area":"西湖 · 杨公堤","addr":"杭州市西湖区杨公堤卧龙桥北侧","transit":"公交 Y9 等到郭庄站（以实时公交为准）；或从曲院风荷步行约 15 分钟","hours":"约 8:00–17:00（以官方为准）","price":"¥10（以官方为准）","dur":"45 分钟–1 小时","desc":"西湖边保存最完好的江南私家园林，临湖而建，借景苏堤和西湖。园子不大但精巧，被称为\"西湖古典园林之冠\"。","tips":"人少安静，适合在临湖的景苏阁坐一会儿；园内有茶室可以喝茶看湖。","q":"郭庄","src":"https://touch.travel.qunar.com/poi/7560585","warn":"","rate":2,"photo":"杭州. 西湖. 郭庄 - panoramio.jpg","been":false,"go":""},{"id":"hz-longjing","zh":"龙井村","en":"Longjing Village","cat":"公园自然","area":"西湖 · 龙井","addr":"杭州市西湖区龙井路龙井村","transit":"公交 27 路 / 508 路到龙井村站（以实时公交为准）","hours":"全天开放","price":"免费","dur":"1.5–2 小时","desc":"西湖龙井茶的核心产区之一，村子被层层茶园包围，村口有龙井泉和乾隆\"十八棵御茶\"。可以在农家喝杯现泡的龙井、吃顿农家菜。","tips":"11 月不是采茶季（明前茶在 3 月底到 4 月初），但茶园四季常绿、人少清净；买茶尽量去正规店，别被路边\"自家炒茶\"带去高价点。","q":"龙井村","src":"https://hznews.hangzhou.com.cn/chengshi/content/2019-04/28/content_7184653_0.htm","warn":"","rate":2,"photo":"20260424 Longjing Village.jpg","been":false,"go":""},{"id":"hz-meijiawu","zh":"梅家坞茶文化村","en":"Meijiawu Tea Village","cat":"公园自然","area":"西湖 · 梅家坞","addr":"杭州市西湖区梅灵北路梅家坞村","transit":"公交 103 / 121 / 122 / 324 路到梅家坞站（线路可能调整，以实时公交为准）；或打车","hours":"全天开放","price":"免费","dur":"1.5–2 小时","desc":"西湖龙井最大的产茶村，一条长长的村道两边全是茶楼农家，背后是连绵茶山。比龙井村大、更有生活气，周恩来曾多次到访。","tips":"可以沿茶园小路往山里走一段；十里琅珰徒步线的终点就在这里，走完下山正好喝茶吃饭。","q":"梅家坞","src":"https://hznews.hangzhou.com.cn/chengshi/content/2019-04/28/content_7184653_2.htm","warn":"","rate":2,"photo":"Longjing Tea field, Dragon Well area, Meijiawu China.jpg","been":false,"go":""},{"id":"hz-hupao","zh":"虎跑公园","en":"Hupao Park (Running Tiger Spring)","cat":"公园自然","area":"西湖 · 虎跑","addr":"杭州市西湖区虎跑路 47 号","transit":"地铁 4 号线水澄桥站换乘公交 4 路 / 504 路到虎跑站（以实时公交为准）","hours":"7:00–17:30","price":"¥15（以官方为准）","dur":"1–1.5 小时","desc":"以\"龙井茶叶虎跑水\"闻名的山间园林，虎跑泉水清冽，常有市民来排队打泉水。园内还有弘一法师（李叔同）纪念馆和济公塔院。","tips":"可以在园内茶室用虎跑泉水泡一杯龙井；和六和塔、九溪顺路，可排成钱塘江边的半日线。","q":"虎跑公园","src":"https://www.dahepiao.com/lvyounews1/20250721522127.html","warn":"","rate":2,"photo":"Hupao.jpg","been":false,"go":""},{"id":"hz-tidal-bore","zh":"钱塘江观潮","en":"Qiantang River Tidal Bore","cat":"公园自然","area":"上城/萧山 · 钱塘江；海宁盐官（杭州约1小时）","addr":"城区：上城区七堡、九堡江堤一带；经典观潮点：嘉兴海宁市盐官镇观潮胜地公园","transit":"城区江堤可地铁/打车至七堡、九堡一带；盐官可从杭州自驾或乘大巴约1小时（以导航为准）","hours":"按潮汐时间：每月农历初一至初五、十五至二十有大潮；全年最大在农历八月十八前后（2026年为9月28日）","price":"城区江堤免费；盐官观潮胜地公园收费（以官方为准）","dur":"1–2 小时（含候潮）","desc":"钱塘江涌潮是世界三大涌潮之一，潮头如“一线横江”，来势汹涌。传统观潮季在农历八月中下旬（每年9–10月），其他月份的大潮日也能看到规模较小的潮水。","tips":"出发前查当天潮汐时刻表，提前半小时到；涌潮危险，务必站在警戒线以内，不要下堤。11月下旬并非观潮季，潮水较小。","q":"盐官观潮胜地公园","src":"https://m.gmw.cn/2026-09/11/content_1304562795.htm","warn":"","rate":2,"photo":"Tidal bore at the Qiantang river, Hangzhou.jpg","been":false,"go":""},{"id":"hz-safari","zh":"杭州野生动物世界","en":"Hangzhou Safari Park","cat":"动物","area":"富阳 · 九龙大道","addr":"杭州市富阳区九龙大道1号","transit":"地铁6号线野生动物园东站，换乘景区免费接驳巴士（以导航为准）","hours":"约 9:30–17:00（以官方为准）","price":"成人约 ¥210（以官方为准）","dur":"半天–1 天","desc":"杭州最大的野生动物园，分为步行区和车行猛兽区，可近距离看狮子、老虎、长颈鹿等。还有动物表演和亲子互动项目，适合带孩子。","tips":"车行区可以自驾或坐园内观光车，早到早排；网购常有比门市价更低的票。","q":"杭州野生动物世界","src":"https://touch.piao.qunar.com/touch/detail_532.html","warn":"","rate":2,"photo":"","been":false,"go":""},{"id":"hz-beigaofeng","zh":"北高峰","en":"North Peak","cat":"徒步","area":"西湖 · 灵隐","addr":"杭州市西湖区灵隐路白乐桥 7 号（北高峰索道）","transit":"公交 7 路 / 游 2 路到灵隐站；索道下站在白乐桥附近，或从灵隐景区内韬光寺步行上山","hours":"索道约 7:30–16:00（以官方为准）","price":"登山免费；索道单程约 ¥30（以官方为准）","dur":"2–3 小时（步行上下）","desc":"海拔 314 米，西湖群山中可俯瞰西湖和灵隐的高点，山顶有香火很旺的灵顺寺（财神庙）。从灵隐经永福寺、韬光寺石阶上山约 1 小时。","tips":"体力一般可以坐索道上山、步行下山；从灵隐景区内上山需要先做灵隐飞来峰预约。山顶往东还能接\"西湖群山\"线走到龙井方向。","q":"北高峰索道","src":"https://www.dahepiao.com/lvyounews1/20241211497693.html","warn":"","rate":2,"photo":"杭州. 登北高峰 - panoramio.jpg","been":false,"go":""},{"id":"hz-yunqi","zh":"云栖竹径","en":"Bamboo-lined Path at Yunqi","cat":"徒步","area":"西湖 · 云栖","addr":"杭州市西湖区梅灵南路云栖竹径","transit":"公交到云栖站或梅灵南路一带（以实时公交为准）；从梅家坞打车约 5 分钟","hours":"7:00–17:00（17:00 停止入园）","price":"¥8（以官方为准）","dur":"1–1.5 小时","desc":"一条在万竿翠竹中蜿蜒的石板古道，竹林遮天、溪水潺潺，夏天格外凉爽。是新西湖十景之一，也是十里琅珰徒步线的起点。","tips":"想走十里琅珰的从这里进去，经真迹寺上山脊，再下到梅家坞或龙井；只逛竹径来回 1 小时就够。","q":"云栖竹径","src":"https://www.dahepiao.com/lvyounews1/20251011533212.html","warn":"","rate":2,"photo":"China Hangzhou Bamboo Lined Path at Yunqi.JPG","been":false,"go":""},{"id":"hz-shililangdang","zh":"十里琅珰","en":"Shili Langdang Ridge Trail","cat":"徒步","area":"西湖 · 云栖 / 梅家坞","addr":"杭州市西湖区云栖竹径 — 真迹寺 — 梅家坞 / 龙井村之间的山脊","transit":"起点云栖竹径：公交或打车到云栖竹径；终点梅家坞有公交返回市区","hours":"白天开放（山中无路灯，务必天黑前下山）","price":"免费（从云栖竹径进需买竹径门票 ¥8）","dur":"3–4 小时","desc":"连接云栖竹径、梅家坞和龙井村的山脊古道，因古时茶农挑担时茶具碰撞的声音得名。一路是竹林、茶园和开阔的山景，是杭州最受欢迎的入门徒步线。","tips":"经典走法：云栖竹径 → 真迹寺 → 十里琅珰 → 梅家坞（或接郎当岭去龙井村）；山里信号差，出发前下好离线地图，下雨后石阶湿滑别去。","q":"十里琅珰","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-05/24/content_9001764_0.htm","warn":"","rate":2,"photo":"杭州.登十里啷当 - panoramio (4).jpg","been":false,"go":""},{"id":"hz-songcheng","zh":"杭州宋城 · 宋城千古情","en":"Songcheng Park & 'The Romance of Song Dynasty' Show","cat":"乐园","area":"西湖 · 之江","addr":"杭州市西湖区之江路148号","transit":"公交308、318、354、504路等至宋城站（以导航为准）","hours":"白天至晚间开放，《宋城千古情》每天多场，场次随季节调整（以官方为准）","price":"含《宋城千古情》成人约 ¥290–320（提前网购常有优惠）（以官方为准）","dur":"半天（含演出）","desc":"以宋代市井为主题的大型主题公园，有街头表演、宋河东街和各类互动项目。重头戏是大型歌舞《宋城千古情》，以杭州历史传说为主线，场面与舞美都很震撼。","tips":"提前在官方渠道确认当天千古情场次并早点入场选座；夜场票可能不含主秀，购票时看清。","q":"杭州宋城","src":"https://travel.sina.cn/2026-09-08/detail-iniqzxcn9927055.d.html","warn":"","rate":2,"photo":"Song Dynasty City (2971043540).jpg","been":false,"go":""},{"id":"hz-qiandaohu","zh":"千岛湖","en":"Qiandao Lake (Thousand Island Lake)","cat":"周边一日","area":"淳安 · 千岛湖（高铁约40分钟–1小时）","addr":"杭州市淳安县千岛湖镇（中心湖区码头）","transit":"杭州西站/杭州东站乘高铁至千岛湖站（杭州西出发最快约40分钟），再乘高铁接驳专线巴士约40分钟至码头（以导航为准）","hours":"游船班次白天运营，以码头公告为准（以官方为准）","price":"2026/11/1–2027/3/31 景区（中心湖区、东南湖区）大门票全免，游船艇费用7折（以官方为准）","dur":"1 天","desc":"新安江水库形成的人工湖，1000多座岛屿星罗棋布，湖水清澈。乘游船登梅峰岛俯瞰群岛是经典玩法，还能吃到千岛湖有机鱼头。","tips":"冬季免门票是难得的好时机，但游船仍需购票；高铁站离湖区较远，回程预留足够接驳时间。","q":"千岛湖中心湖区","src":"https://hznews.hangzhou.com.cn/chengshi/content/2026-10/27/content_9356490.htm","warn":"","rate":2,"photo":"Qiandao Lake (near Hangzhou).jpg","been":false,"go":""},{"id":"hz-xitang","zh":"西塘古镇","en":"Xitang Ancient Town","cat":"周边一日","area":"嘉善 · 西塘（杭州约1.5小时）","addr":"嘉兴市嘉善县西塘镇南苑路258号","transit":"杭州东站乘高铁至嘉善南站，换乘K222公交约40分钟–1小时至西塘（以导航为准）","hours":"古镇全天开放，收费景点白天开放（以官方为准）","price":"¥95（含古镇内景点，48小时有效）（以官方为准）","dur":"1 天","desc":"以千米烟雨长廊和密集的石桥、弄堂闻名的江南水乡，居民生活气息浓厚。夜晚红灯笼沿河亮起，酒吧和小吃把河岸点得很热闹。","tips":"傍晚到夜间最好看，可在镇上住一晚第二天清晨再逛；末班K222约20:30，注意返程时间。","q":"西塘古镇","src":"https://gs.ctrip.com/html5/you/sight/Jiashan1019/17884.html","warn":"","rate":2,"photo":"Xitang Ancient Town canal at night, October 2026.jpg","been":false,"go":""},{"id":"hz-moganshan","zh":"莫干山","en":"Moganshan","cat":"周边一日","area":"德清 · 莫干山（杭州约1小时）","addr":"湖州市德清县莫干山镇莫干山风景名胜区","transit":"杭州东站/杭州西站乘高铁至德清站（约15–20分钟），换乘Y1莫干山专线公交或打车至莫干山旅游集散中心，再乘景区交通车上山（以导航为准）","hours":"白天开放（以官方为准）","price":"门票约 ¥80–85；门票+景区交通车套票约 ¥150（以官方为准）","dur":"1 天（或住一晚民宿）","desc":"以竹、云、泉闻名的避暑胜地，山上保留了民国时期的上百栋别墅，蒋介石、毛泽东都曾在此留下足迹。山下的“洋家乐”精品民宿闻名全国。","tips":"山上比杭州冷几度，冬季注意保暖；旺季周末集散中心排队长，可打车直达或尽早出发。","q":"莫干山风景名胜区","src":"https://gs.ctrip.com/html5/you/sight/68/135799.html","warn":"","rate":2,"photo":"Mount Mogan 2016.jpg","been":false,"go":""},{"id":"hz-shaoxing-luxun","zh":"绍兴 · 鲁迅故里","en":"Shaoxing: Lu Xun Native Place","cat":"周边一日","area":"绍兴 · 越城（高铁约20分钟）","addr":"绍兴市越城区鲁迅中路（鲁迅故里景区）","transit":"杭州东站乘高铁至绍兴北站约20分钟，换乘绍兴地铁1号线至鲁迅故里站；也可从杭州地铁换乘杭绍城际（绍兴地铁1号线）直达（以导航为准）","hours":"约 8:30–20:30（各平台说法不一）（以官方为准）","price":"免费，需在「绍兴鲁迅纪念馆」或「绍兴市文旅集团」公众号预约（以官方为准）","dur":"1 天","desc":"鲁迅故居、百草园、三味书屋、咸亨酒店都集中在一条街上，课本里的场景一一对上。还可顺路坐乌篷船、去沈园和仓桥直街，吃茴香豆、喝黄酒。","tips":"预约名额每天8:30起分批放出，节假日要早抢；午饭可在咸亨酒店尝臭豆腐和绍兴黄酒。","q":"鲁迅故里","src":"https://www.dahepiao.com/lvyounews1/20240429460948.html","warn":"","rate":2,"photo":"Former Residence of Lu Xun in Shaoxing 01 2018-09.jpg","been":false,"go":""},{"id":"hz-qiantang-bridge","zh":"钱塘江大桥","en":"Qiantang River Bridge","cat":"地标","area":"西湖 · 之江","addr":"杭州市西湖区之江路（六和塔东侧）","transit":"公交至六和塔 / 钱江一桥一带（以导航为准）","hours":"人行道全天可通行；北岸引桥处的钱塘江大桥纪念馆开放时间（以官方为准）","price":"免费","dur":"45 分钟–1 小时","desc":"1937年由茅以升主持建成的中国第一座自主设计建造的公路铁路两用双层大桥。上层人行道全长约1453米，步行约半小时可走过钱塘江。","tips":"可与六和塔连游：先登塔看桥，再走上桥体验；桥上车流大、风大，注意安全。","q":"钱塘江大桥","src":"https://hk.trip.com/travel-guide/hangzhou/qiantang-river-bridge-10521365/","warn":"","rate":1,"photo":"Qiantang River Bridge 2016 January.jpg","been":false,"go":""},{"id":"hz-xihutiandi","zh":"西湖天地","en":"Xihu Tiandi","cat":"街区","area":"西湖 · 南山路","addr":"杭州市上城区南山路 147 号","transit":"地铁 1 号线龙翔桥站，步行约 10 分钟","hours":"全天开放（餐厅酒吧营业时间各异）","price":"免费","dur":"30–45 分钟","desc":"湖滨南侧临湖的小型休闲街区，白墙黛瓦的低层建筑里是咖啡馆、餐厅和酒吧。坐在湖边露台上喝东西，可以看到西湖和远处的雷峰塔。","tips":"适合散步途中歇脚喝咖啡；晚上酒吧比较热闹，靠湖的座位要早点去。","q":"西湖天地","src":"https://touch.travel.qunar.com/poi/711444","warn":"","rate":1,"photo":"Xihu Tiandi View1.jpg","been":false,"go":""},{"id":"hz-tianmuli","zh":"天目里","en":"OōEli Tianmuli","cat":"街区","area":"西湖 · 天目山路","addr":"杭州市西湖区天目山路398号","transit":"地铁3号线古墩路站，步行约10分钟（以导航为准）","hours":"园区约 10:00–22:00；美术馆、店铺各自营业时间（以官方为准）","price":"免费进入（展览另计）","dur":"1–2 小时","desc":"伦佐·皮亚诺事务所设计的艺术商业综合体，灰白极简建筑围合出水池庭院。聚集买手店、书店、咖啡馆和天目里美术馆，是杭州文艺青年的打卡地。","tips":"周末常有市集和展览；傍晚灯光亮起时拍照最好看。","q":"天目里","src":"https://citiesinsider.com/country/china/hangzhou/art-galleries/zh","warn":"","rate":1,"photo":"Tianmuli.jpg","been":false,"go":""},{"id":"hz-wulin","zh":"武林商圈（杭州大厦 · 杭州中心）","en":"Wulin Shopping District (Hangzhou Tower & Hangzhou Center)","cat":"商场","area":"拱墅 · 武林广场","addr":"杭州市拱墅区武林广场一带","transit":"地铁1号线/3号线武林广场站，站内直通商场","hours":"商场一般约 10:00–22:00（以官方为准）","price":"免费进入","dur":"1–2 小时","desc":"杭州传统核心商圈，杭州大厦是老牌高端百货，杭州中心与地铁站连通。周边还有武林路时尚女装街和延安路商业街。","tips":"下雨天的好去处；附近浙江展览馆、武林广场夜景也可顺路看看。","q":"杭州大厦","src":"https://gs.ctrip.com/html5/you/sight/hangzhou14/4079.html","warn":"","rate":1,"photo":"201607 Hangzhou Tower.jpg","been":false,"go":""},{"id":"hz-baopu","zh":"葛岭 · 抱朴道院","en":"Baopu Taoist Temple, Geling Hill","cat":"宗教建筑","area":"西湖 · 北山街","addr":"杭州市西湖区葛岭山（北山街葛岭路上山）","transit":"公交 7 路到岳庙站或断桥站，沿北山街步行到葛岭路，上山约 10 分钟","hours":"约 8:00–17:00（以官方为准）","price":"¥5（以官方为准）","dur":"30–45 分钟","desc":"相传东晋葛洪在此炼丹修道，是西湖边规模最大的道观。黄色波浪形院墙在山林里很醒目，院内清幽。","tips":"可和宝石山连走：北山街 → 抱朴道院 → 初阳台 → 保俶塔 → 断桥，约 1.5 小时；黄墙一段很适合拍照。","q":"抱朴道院","src":"https://hznews.hangzhou.com.cn/chengshi/content/2025-08/02/content_9052255_2.htm","warn":"","rate":1,"photo":"Bao Pu temple 抱朴道院 - panoramio.jpg","been":false,"go":""},{"id":"hz-jingshan","zh":"径山寺","en":"Jingshan Temple","cat":"宗教建筑","area":"余杭 · 径山（市区约1–1.5小时）","addr":"杭州市余杭区径山镇径山村","transit":"自驾或打车最方便（约1–1.5小时）；山下游客服务中心乘接驳车上山（以导航为准）","hours":"约 7:30–17:00（以官方为准）","price":"约 ¥30（第三方平台信息）（以官方为准）","dur":"半天","desc":"始建于唐代的禅宗名刹，南宋时位列“五山十刹”之首，也是日本茶道和径山茶宴的源头。寺院隐于竹海古木之中，山上空气清新，适合清修式的一日游。","tips":"山上较冷，冬季多带一件外套；节假日自驾停车紧张，尽量早到。","q":"径山寺","src":"https://gs.ctrip.com/html5/you/sight/hangzhou14/1414691.html","warn":"","rate":1,"photo":"Hall of Dragon Kings in Jingshan Temple 2023.jpg","been":false,"go":""},{"id":"hz-zjartmuseum","zh":"浙江美术馆","en":"Zhejiang Art Museum","cat":"博物馆","area":"西湖 · 南山路","addr":"杭州市上城区南山路 138 号","transit":"地铁 1 号线定安路站，步行约 15 分钟；或公交西湖环线到柳浪闻莺站","hours":"9:00–17:00，周一闭馆（以官方为准）","price":"免费（以官方为准）","dur":"1 小时","desc":"依玉皇山、临西湖的现代美术馆，黑白灰坡屋顶建筑本身就很好看。常年有书画、版画和当代艺术展，展览轮换较快。","tips":"去之前看一下官方公众号当期展览；从柳浪闻莺往南走顺路就到。","q":"浙江美术馆","src":"https://citiesinsider.com/country/china/hangzhou/art-galleries/zh","warn":"","rate":1,"photo":"Zhejiang Art Museum 01.jpg","been":false,"go":""},{"id":"hz-guanyao","zh":"南宋官窑博物馆","en":"Southern Song Guan Kiln Museum","cat":"博物馆","area":"西湖 · 玉皇山南","addr":"杭州市上城区施家山 42 号（南复路旁）","transit":"公交到南宋官窑博物馆站（以实时公交为准）；从丝绸博物馆打车约 5 分钟","hours":"8:30–16:30，周一闭馆（以官方为准）","price":"免费","dur":"1 小时","desc":"建在南宋郊坛下官窑遗址上的陶瓷专题博物馆，可以看到保存下来的龙窑和作坊遗址，以及南宋官窑青瓷。","tips":"喜欢瓷器的值得专程，园内还有手工制瓷体验；位置偏，可和丝绸博物馆、八卦田一起安排。","q":"南宋官窑博物馆","src":"https://ct.zj.gov.cn/art/2019/8/5/art_1671969_36385253.html","warn":"","rate":1,"photo":"Hangzhou Nansong Guanyao Bowuguan 20120518-02.jpg","been":false,"go":""},{"id":"hz-quyuan","zh":"曲院风荷","en":"Lotus in the Breeze at Quyuan Garden","cat":"公园自然","area":"西湖 · 北山街西","addr":"杭州市西湖区北山街（岳庙西侧、苏堤北口）","transit":"公交 7 路到岳庙站，步行约 5 分钟","hours":"全天开放","price":"免费","dur":"45 分钟–1 小时","desc":"西湖十景之一，以大片荷花池闻名，园内水面、曲桥和水杉林交错。夏天是西湖看荷花最好的地方。","tips":"11 月荷花早已凋谢，以园林散步为主；可和岳王庙、苏堤北段一起逛。","q":"曲院风荷","src":"https://touch.travel.qunar.com/poi/711444","warn":"","rate":1,"photo":"Lotus in the Breeze at the Winding Courtyard 0.jpg","been":false,"go":""},{"id":"hz-manjuelong","zh":"满觉陇","en":"Manjuelong Village","cat":"公园自然","area":"西湖 · 满觉陇","addr":"杭州市西湖区满觉陇路","transit":"公交到满觉陇站（以实时公交为准）；从虎跑或龙井打车约 5–10 分钟","hours":"全天开放","price":"免费","dur":"1 小时","desc":"藏在南高峰下的山坳小村，满山桂花树，\"满陇桂雨\"是新西湖十景之一。村里有石屋洞、水乐洞等岩洞和许多茶室农家。","tips":"桂花季在 9 月下旬到 10 月中旬，11 月下旬桂花早已谢了，此时来以喝茶散步为主；可以顺路去龙井或虎跑。","q":"满觉陇","src":"https://touch.travel.qunar.com/poi/711444","warn":"","rate":1,"photo":"杭州 满陇桂雨（儿童公园：满陇古井） - panoramio.jpg","been":false,"go":""},{"id":"hz-botanical","zh":"杭州植物园","en":"Hangzhou Botanical Garden","cat":"公园自然","area":"西湖 · 桃源岭","addr":"杭州市西湖区桃源岭1号","transit":"公交至「植物园」站，南门或北门入园（以导航为准）","hours":"常见标注 8:30–16:30（各平台说法不一）（以官方为准）","price":"成人 ¥10（优待票 ¥5）（以官方为准）","dur":"2 小时","desc":"西湖边的大型植物园，林木葱郁、游人比西湖少很多。园内灵峰探梅是杭州赏梅名所，还有竹类、木兰等专类园。","tips":"梅花季在1–3月，初冬可看红枫和银杏；可从青芝坞一侧进出，顺便吃饭喝咖啡。","q":"杭州植物园","src":"https://www.dahepiao.com/lvyounews1/20251010533129.html","warn":"","rate":1,"photo":"Plum blossoms near the entrance of the Hangzhou botanical Garden.jpg","been":false,"go":""},{"id":"hz-chaoshan","zh":"超山风景区","en":"Chaoshan Scenic Area","cat":"公园自然","area":"临平 · 塘栖（市区约1小时）","addr":"杭州市临平区塘栖镇超山风景区","transit":"地铁9号线龙安站附近转公交或打车；或1号线临平站转公交至超山风景名胜区（以导航为准）","hours":"8:00–17:00（16:30停止入园）（以官方为准）","price":"约 ¥50–60（梅花季浮动）（以官方为准）","dur":"半天","desc":"与苏州邓尉、余杭西溪并称“江南三大探梅胜地”，有唐梅、宋梅古树，吴昌硕墓也在此。梅花季漫山十里香雪，非花季则以登山和古迹为主。","tips":"最佳时间是1–3月梅花季，11月来性价比一般；可顺路去塘栖古镇吃枇杷、糕点。","q":"超山风景区","src":"https://gs.ctrip.com/html5/you/sight/2044870/135666.html","warn":"","rate":1,"photo":"North Gate of Chaoshan Scenic Area.jpg","been":false,"go":""},{"id":"hz-xianghu","zh":"湘湖","en":"Xianghu Lake","cat":"公园自然","area":"萧山 · 湘湖","addr":"杭州市萧山区湘湖路（湘湖景区）","transit":"地铁1号线湘湖站C口出，步行可进入景区（以导航为准）","hours":"景区开放式；游船、观光车约 9:00–16:00；跨湖桥遗址博物馆周二至周日开放（以官方为准）","price":"景区免费；游船约 ¥55 起；跨湖桥遗址博物馆免费需预约（以官方为准）","dur":"半天","desc":"被称为西湖“姐妹湖”的萧山湘湖，湖面开阔、游人较少，环湖绿道适合骑行散步。湖边的跨湖桥遗址博物馆展出八千年前的独木舟。","tips":"想避开西湖人潮可选湘湖；环湖骑行一圈大约需要2–3小时。","q":"湘湖景区","src":"https://hznews.hangzhou.com.cn/chengshi/content/2020-10/05/content_7825862.htm","warn":"","rate":1,"photo":"Xiang Hu.jpg","been":false,"go":""},{"id":"hz-zoo","zh":"杭州动物园","en":"Hangzhou Zoo","cat":"动物","area":"西湖 · 虎跑","addr":"杭州市西湖区虎跑路40号","transit":"公交至「动物园」站（以导航为准）","hours":"10/9–4/3 7:00–17:00；4/4–10/8 7:00–17:30（以官方为准）","price":"成人 ¥20（优待票 ¥10）（以官方为准）","dur":"2–3 小时","desc":"依山而建的城市动物园，大熊猫、金丝猴、华南虎等明星动物都有。票价便宜、林木茂密，离虎跑、六和塔很近。","tips":"山地起伏大，穿舒适的鞋；可安排早上先逛动物园，再去虎跑和六和塔。","q":"杭州动物园","src":"https://www.dahepiao.com/lvyounews1/20250409508908.html","warn":"","rate":1,"photo":"Hangzhou Zoo 01.jpg","been":false,"go":""},{"id":"hz-fuyang-longmen","zh":"富阳 · 龙门古镇 / 富春江","en":"Fuyang: Longmen Ancient Town & Fuchun River","cat":"周边一日","area":"富阳 · 龙门（杭州约1–1.5小时）","addr":"杭州市富阳区龙门镇（龙门古镇）","transit":"地铁6号线至富阳城区，再换乘公交或打车约40分钟至龙门古镇（以导航为准）","hours":"古镇街巷全天开放，收费景点白天开放（以官方为准）","price":"古镇游览项目通票约 ¥30 起（以官方为准）","dur":"1 天","desc":"三国孙权后裔聚居的千年古村，保存大量明清宗祠、厅堂和卵石小巷，孙氏宗祠、义门等很有看头。返程可在富阳城区登鹳山看富春江，感受《富春山居图》的山水意境。","tips":"古镇不大，2–3小时足够，可与富春江边或杭州野生动物世界组合成富阳一日游。","q":"龙门古镇","src":"https://touch.piao.qunar.com/touch/detail.htm?id=877","warn":"","rate":1,"photo":"Yi Gate in Longmen Town 03 2021-05.jpg","been":false,"go":""},{"id":"hz-yaolin","zh":"桐庐 · 瑶琳仙境","en":"Tonglu: Yaolin Wonderland Cave","cat":"周边一日","area":"桐庐 · 瑶琳（杭州约1.5小时）","addr":"杭州市桐庐县瑶琳镇瑶琳仙境景区","transit":"杭州东站/杭州西站乘高铁至桐庐站（约30分钟，以12306为准），再打车约30分钟至景区（以导航为准）","hours":"1/1–6/29、9/1–12/31 8:30–16:00；6/30–8/31 延长至 20:00（2025年资料）（以官方为准）","price":"成人约 ¥110（以官方为准）","dur":"1 天（洞内约1.5小时）","desc":"浙江著名的大型石灰岩溶洞，洞内钟乳石、石笋和石幔规模宏大，配合灯光如入仙境。洞内恒温，冬暖夏凉，可与富春江、严子陵钓台组合成桐庐一日游。","tips":"洞内地面湿滑、台阶多，穿防滑鞋；冬季闭园较早，下午两点前进洞比较稳妥。","q":"瑶琳仙境","src":"https://www.dahepiao.com/lvyounews1/20250801523932.html","warn":"","rate":1,"photo":"20250720 Yaolin Xianjing (100423).jpg","been":false,"go":""}];
var CATS=["地标","街区","美食夜市","商场","宗教建筑","博物馆","室内","公园自然","动物","徒步","乐园","周边一日"];
var EM={"地标":"🏙","街区":"🏮","美食夜市":"🍢","商场":"🛍","宗教建筑":"🕌","博物馆":"🏛","室内":"🎡","公园自然":"🌳","动物":"🦜","徒步":"🥾","乐园":"🎢","周边一日":"🚌"};
var FILES={},CFG={"map":"amap","city":"杭州"};
function mapUrl(q){return CFG.map==="amap"?"https://uri.amap.com/search?keyword="+encodeURIComponent(q)+"&amp;city="+encodeURIComponent(CFG.city||"")+"&amp;callnative=1":"https://www.google.com/maps/search/?api=1&amp;query="+encodeURIComponent(q);}
var BY={};DATA.forEach(function(x){BY[x.id]=x;});
function st(x){return TRIPST.get(x.id)||{been:!!x.been,want:false};}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function img(f){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f)+"?width=640";}
function page(f){return "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(f.replace(/ /g,"_"));}
var F={cat:"",st:"",q:"",so:"rate"},mine=false; // mine：自己点的改动只更新那一张卡片，别处（后台、别的页面）来的才整页重画
function card(x){
  var s=st(x),ph=x.photo?'<img loading="lazy" src="'+esc(img(x.photo))+'" alt="'+esc(x.zh)+'" onerror="this.outerHTML=\'<div class=no>'+(EM[x.cat]||"📍")+'</div>\'">':'<div class="no">'+(EM[x.cat]||"📍")+'</div>';
  var row=function(i,v){return v?'<dt>'+i+'</dt><dd>'+esc(v)+'</dd>':"";};
  return '<article class="card'+(s.been?" been":"")+(s.want?" want":"")+'" id="c-'+esc(x.id)+'" data-id="'+esc(x.id)+'">'+
    (x.photo?'<a class="ph" href="'+esc(page(x.photo))+'" target="_blank" rel="noopener">':'<div class="ph">')+ph+
    '<span class="rate">'+"★★★".slice(0,x.rate)+'</span><span class="ct">'+(EM[x.cat]||"")+' '+esc(x.cat)+'</span><span class="mk b">✅ 去过</span><span class="mk w">⭐ 想去</span>'+(x.photo?'</a>':'</div>')+
    '<div class="cb"><div class="nm"><b>'+esc(x.zh)+'</b><small>'+esc(x.en)+'</small></div><div class="area">📍 '+esc(x.area)+'</div>'+(x.warn?'<p class="warn">⚠️ '+esc(x.warn)+'</p>':"")+
    '<dl class="info">'+row("🚇",x.transit)+row("🕘",x.hours)+row("💵",x.price)+row("⏱",x.dur)+row("🏠",x.addr)+'</dl>'+
    (x.desc?'<p class="desc">'+esc(x.desc)+'</p>':"")+(x.tips?'<p class="tips">💡 '+esc(x.tips)+'</p>':"")+
    '<div class="acts"><button class="bt b" data-k="been">'+(s.been?"✅ 已去过":"☐ 去过")+'</button><button class="bt w" data-k="want">'+(s.want?"⭐ 想去":"☆ 想去")+'</button>'+
    (x.q?'<a class="lk" href="'+mapUrl(x.q)+'" target="_blank" rel="noopener">📍 '+(CFG.map==="amap"?"高德地图":"地图")+'</a>':"")+
    (x.go&&FILES[x.go]?'<a class="lk" href="'+FILES[x.go]+'" data-go="'+esc(x.go)+'">🧭 照着走 ›</a>':"")+
    (x.src?'<a class="lk s" href="'+esc(x.src)+'" target="_blank" rel="noopener">来源</a>':"")+'</div></div></article>';
}
function match(x){
  var s=st(x);
  if(F.cat&&x.cat!==F.cat)return false;
  if(F.st==="been"&&!s.been)return false;if(F.st==="want"&&!s.want)return false;if(F.st==="left"&&s.been)return false;
  if(F.q){var h=(x.zh+" "+x.en+" "+x.area+" "+x.transit+" "+x.cat+" "+x.addr+" "+x.desc).toLowerCase();if(h.indexOf(F.q.toLowerCase())<0)return false;}
  return true;
}
function order(a,b){
  if(F.so==="area")return (a.area||"").localeCompare(b.area||"","zh")||b.rate-a.rate;
  if(F.so==="cat")return CATS.indexOf(a.cat)-CATS.indexOf(b.cat)||b.rate-a.rate;
  return b.rate-a.rate||CATS.indexOf(a.cat)-CATS.indexOf(b.cat);
}
function stats(){
  var b=0,w=0;DATA.forEach(function(x){var s=st(x);if(s.been)b++;else if(s.want)w++;});
  document.getElementById("n-been").textContent=b;document.getElementById("n-want").textContent=w;document.getElementById("n-left").textContent=DATA.length-b;
  document.getElementById("bar").style.width=(DATA.length?Math.round(b*100/DATA.length):0)+"%";
  var cnt={};DATA.forEach(function(x){cnt[x.cat]=(cnt[x.cat]||0)+1;});
  document.getElementById("cats").innerHTML='<span class="lbl">类型</span><button class="chip'+(F.cat?"":" on")+'" data-cat="">全部<small>'+DATA.length+'</small></button>'+CATS.filter(function(c){return cnt[c];}).map(function(c){return '<button class="chip'+(F.cat===c?" on":"")+'" data-cat="'+c+'">'+EM[c]+" "+c+'<small>'+cnt[c]+'</small></button>';}).join("");
  var SS=[["","全部"],["left","还没去 "+(DATA.length-b)],["want","⭐ 想去 "+w],["been","✅ 去过 "+b]];
  document.getElementById("st").innerHTML='<span class="lbl">状态</span>'+SS.map(function(z){return '<button class="chip'+(F.st===z[0]?" on":"")+'" data-st="'+z[0]+'">'+z[1]+'</button>';}).join("");
}
function render(){
  var L=DATA.filter(match).sort(order);
  document.getElementById("grid").innerHTML=L.map(card).join("");
  document.getElementById("empty").style.display=L.length?"none":"";
  stats();
}
function toggle(id,k){
  var x=BY[id];if(!x)return;var v=Object.assign({},st(x));v[k]=!v[k];if(k==="been"&&v.been)v.want=false;
  mine=true;TRIPST.set(id,v);mine=false;
  var el=document.getElementById("c-"+id);if(el&&match(x)){el.outerHTML=card(x);}else render();
  stats();
}
document.addEventListener("click",function(e){
  var t=e.target.closest&&e.target.closest("button,a[data-go]");if(!t)return;
  if(t.dataset.k){var c=t.closest(".card");if(c)toggle(c.dataset.id,t.dataset.k);return;}
  if(t.hasAttribute("data-cat")){F.cat=t.dataset.cat;render();return;}
  if(t.hasAttribute("data-st")){F.st=t.dataset.st;render();return;}
  if(t.dataset.go&&window.parent&&window.parent!==window){e.preventDefault();try{parent.postMessage({tripGo:t.dataset.go},"*");}catch(er){}}
});
var qT=0;document.getElementById("q").addEventListener("input",function(e){clearTimeout(qT);qT=setTimeout(function(){F.q=e.target.value.trim();render();},150);});
document.getElementById("so").addEventListener("change",function(e){F.so=e.target.value;render();});
var sy=document.getElementById("sync");
render();
TRIPST.on(function(){if(!mine)render();});
if(!TRIPST.cloud){sy.textContent="📱 单独打开：勾的只存在这台设备（在网站「旅游」里打开会同步）";}
else{sy.textContent="☁️ 同步中…";TRIPST.sync().then(function(r){sy.textContent=r==="ok"?"☁️ 已同步（换设备也在）":"⚠️ 现在连不上后台，勾的先存在这台设备，下次打开再同步";});}
})();
</script>
</body></html>
